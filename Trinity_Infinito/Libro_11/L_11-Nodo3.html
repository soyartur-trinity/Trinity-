<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
<title>Libro 11 - Nodo 73: La Serpiente Mordiéndose la Cola</title>
<!-- Portal 73. Saneado en noviembre de 2026 sobre el original: los dos cuerpos de la serpiente, las
     veinticuatro escamas que laten en ola alrededor del círculo, la boca y la cola que se encuentran
     arriba y abajo, las ondas del infinito, las partículas en órbita y los flujos de autoconsumo.
     Sonido nuevo: el lazo que se sostiene solo (el tubo de Rijke, 1859; el mismo principio del acople
     de un micrófono frente a su parlante). La salida vuelve a entrar: del ruido de fondo nace un Fa
     grave que crece hasta su tamaño propio y se mantiene. Las escamas brillan con él. -->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    background: radial-gradient(ellipse at center, #050510 0%, #03040a 55%, #000 80%);
    background-color:#000;
    color:#fff;
    font-family: Georgia, serif;
    overflow:hidden;
    height:100vh; height:100dvh;
    display:flex; align-items:center; justify-content:center;
    cursor:none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    -webkit-user-select:none; user-select:none;
  }

  .cabecera {
    position:fixed; left:50%; top:calc(env(safe-area-inset-top, 0px) + 5.5vh);
    transform:translateX(-50%);
    width:max-content; max-width:92vw; text-align:center;
    z-index:5; pointer-events:none;
  }
  .titulo {
    font-size: clamp(16px, 4.8vw, 30px);
    font-weight:bold;
    letter-spacing: clamp(0.14em, 1.1vw, 0.36em);
    padding-left: clamp(0.14em, 1.1vw, 0.36em);
    line-height:1.45;
    color: rgba(244,255,238,0.92);
    text-shadow: 0 0 30px rgba(150,255,100,0.45);
  }
  .subtitulo {
    margin-top:0.6em;
    font-size: clamp(11px, 2.9vw, 15px);
    letter-spacing:0.3em; padding-left:0.3em; font-style:italic;
    color: rgba(225,245,215,0.5);
  }

  .escena {
    --L: min(66vh, 640px, 92vw);
    position:relative;
    width:var(--L); height:var(--L);
    margin-top:-5vh;
  }

  .resplandor {
    position:absolute; left:50%; top:50%;
    width:90%; height:90%;
    border-radius:50%;
    background: radial-gradient(circle, rgba(150,255,100,0.12), rgba(150,255,100,0.045) 40%, transparent 68%);
    animation: resplandor 18s ease-in-out infinite;
  }
  @keyframes resplandor {
    0%,100% { transform:translate(-50%,-50%) scale(0.8) rotate(0deg);   opacity:0.4; }
    50%     { transform:translate(-50%,-50%) scale(1.4) rotate(180deg); opacity:0.75; }
  }

  /* El cuerpo de la serpiente: dos círculos que giran en sentidos contrarios */
  .cuerpo {
    position:absolute; left:50%; top:50%;
    border-radius:50%;
    border:4px solid rgba(150,255,100,0.4);
    box-shadow: inset 0 0 calc(var(--L) * 0.06) rgba(150,255,100,0.2), 0 0 calc(var(--L) * 0.06) rgba(150,255,100,0.2);
    animation: gira 30s linear infinite;
  }
  .cuerpo.c1 { width:66.7%; height:66.7%; }
  .cuerpo.c2 { width:53.3%; height:53.3%; border-width:3px; animation-duration:25s; animation-direction:reverse; }
  @keyframes gira {
    from { transform:translate(-50%,-50%) rotate(0deg); }
    to   { transform:translate(-50%,-50%) rotate(360deg); }
  }

  /* Las escamas: una ola que recorre el círculo; el contenedor brilla con el sonido */
  .escamas { position:absolute; inset:0; opacity:0.75; }
  .escama {
    position:absolute;
    width:3.4%; height:3.4%; margin:-1.7% 0 0 -1.7%;
    border-radius:50%;
    background: radial-gradient(circle, rgba(175,255,130,0.85), rgba(150,255,100,0.3) 45%, transparent 72%);
    animation: escama 3s ease-in-out infinite;
  }
  @keyframes escama {
    0%,100% { transform:scale(0.8); opacity:0.4; }
    50%     { transform:scale(1.3); opacity:0.85; }
  }

  /* Boca y cola: arriba y abajo, donde el círculo se encuentra consigo mismo */
  .boca {
    position:absolute; left:50%;
    width:22%; height:22%;
    margin:-11% 0 0 -11%;
    border-radius:50%;
    background: radial-gradient(circle, rgba(255,215,120,0.42), rgba(255,160,100,0.16) 40%, transparent 68%);
    animation: boca 8s ease-in-out infinite;
  }
  @keyframes boca {
    0%,100% { transform:scale(1) rotate(0deg);     opacity:0.6; }
    50%     { transform:scale(1.5) rotate(180deg); opacity:0.9; }
  }

  /* Las ondas del infinito: elipses que giran y respiran */
  .onda8 {
    position:absolute; left:50%; top:50%;
    width:50%; height:25%;
    border:2px solid rgba(200,255,150,0.3);
    border-radius:50%;
    opacity:0.4;
    animation: onda8 16s ease-in-out infinite;
  }
  .onda8.o2 { width:41.7%; height:20.8%; animation-delay:-10.7s; }
  @keyframes onda8 {
    0%,100% { transform:translate(-50%,-50%) rotate(0deg)   scale(1); }
    25%     { transform:translate(-50%,-50%) rotate(45deg)  scale(1.2); }
    50%     { transform:translate(-50%,-50%) rotate(90deg)  scale(1); }
    75%     { transform:translate(-50%,-50%) rotate(135deg) scale(1.2); }
  }

  .orbita {
    position:absolute; left:50%; top:50%;
    width:6px; height:6px; margin:-3px 0 0 -3px;
    border-radius:50%;
    background: rgba(255,255,255,0.92);
    box-shadow: 0 0 12px rgba(150,255,100,0.85);
    animation: orbita 12s linear infinite;
  }
  @keyframes orbita {
    from { transform:rotate(0deg)   translateX(calc(var(--L) * 0.333)) rotate(0deg); }
    to   { transform:rotate(360deg) translateX(calc(var(--L) * 0.333)) rotate(-360deg); }
  }

  .consumo {
    position:absolute; left:50%; top:50%;
    width:16.7%; height:3px; margin-top:-1.5px;
    background: linear-gradient(90deg, rgba(150,255,100,0.8), rgba(255,200,100,0.65), transparent);
    transform-origin:left center;
    opacity:0;
    animation: consumo 10s ease-in-out forwards;
    pointer-events:none;
  }
  @keyframes consumo {
    0%,100% { transform:rotate(0deg) scaleX(0);      opacity:0; }
    50%     { transform:rotate(var(--a)) scaleX(1);  opacity:0.9; }
  }

  /* El toque: anillos que se abren, flujos y una espiral de partículas */
  .anillo-toque {
    position:absolute;
    width:var(--s); height:var(--s);
    margin:calc(var(--s) / -2) 0 0 calc(var(--s) / -2);
    border:2px solid rgba(150,255,100,0.55);
    border-radius:50%;
    pointer-events:none;
    animation: abre 2s ease-out forwards;
  }
  @keyframes abre {
    0%   { transform:scale(1); opacity:0.6; }
    100% { transform:scale(3); opacity:0; }
  }
  .espiral {
    position:absolute;
    width:6px; height:6px; margin:-3px 0 0 -3px;
    border-radius:50%;
    background: rgba(255,255,255,0.92);
    box-shadow: 0 0 12px rgba(150,255,100,0.85);
    pointer-events:none;
    animation: espiral 6s linear forwards;
  }
  @keyframes espiral {
    0%   { transform:rotate(0deg)   translateX(0) rotate(0deg);                     opacity:0; }
    10%  { opacity:1; }
    100% { transform:rotate(360deg) translateX(var(--r)) rotate(-360deg);           opacity:0; }
  }

  .centro { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; z-index:3; }
  .texto-central {
    text-align:center;
    font-size: clamp(14px, 4vw, 23px);
    letter-spacing:0.36em; padding-left:0.36em;
    line-height:2.15;
    color: rgba(255,255,255,0.95);
    text-shadow: 0 0 22px rgba(255,255,255,0.4), 0 0 10px rgba(0,0,0,0.85);
    opacity:0;
    animation: texto 15s ease-in-out infinite;
    animation-delay:-3s;
  }
  @keyframes texto {
    0%,100% { opacity:0;   transform:rotate(-5deg); }
    20%,80% { opacity:0.82; transform:rotate(0deg); }
  }

  .frases {
    position:fixed; left:50%;
    bottom:calc(env(safe-area-inset-bottom, 0px) + 15vh);
    transform:translateX(-50%);
    width:90vw; max-width:640px; height:3.4em;
    text-align:center;
    pointer-events:none;
  }
  .frase {
    position:absolute; left:0; right:0; bottom:0;
    font-size: clamp(14px, 3.8vw, 19px);
    line-height:1.6;
    letter-spacing:0.06em;
    font-style:italic;
    color: rgba(240,252,234,0.9);
    text-shadow: 0 0 18px rgba(150,255,100,0.3);
    opacity:0;
    animation: frase 20s ease-in-out infinite;
  }
  .frase.f2 { animation-delay:10s; }
  @keyframes frase {
    0%   { opacity:0; transform:translateY(6px); }
    7%   { opacity:1; transform:translateY(0); }
    43%  { opacity:1; transform:translateY(0); }
    50%  { opacity:0; transform:translateY(-4px); }
    100% { opacity:0; transform:translateY(-4px); }
  }

  .hint {
    position:fixed; left:50%;
    bottom:calc(env(safe-area-inset-bottom, 0px) + 50px);
    transform:translateX(-50%);
    width:max-content; max-width:88vw; text-align:center;
    font-size: clamp(12px, 3.2vw, 14px);
    letter-spacing:1px;
    color: rgba(240,252,234,0.88);
    animation: invita 3.4s infinite ease-in-out;
    pointer-events:none;
    transition: opacity 1.4s ease;
  }
  .hint.oculto { animation:none; opacity:0; }
  @keyframes invita { 0%,100% { opacity:0.45; } 50% { opacity:0.95; } }

  .infinito {
    position:fixed;
    bottom:calc(env(safe-area-inset-bottom, 0px) + 14px); right:22px;
    font-size:30px; text-decoration:none;
    color: rgba(200,235,185,0.4);
    transition: color 0.8s ease, text-shadow 0.8s ease;
    z-index:20;
    cursor:pointer;
  }
  .infinito:hover, .infinito:focus-visible { color: rgba(225,255,205,0.95); text-shadow:0 0 18px rgba(150,255,100,0.55); outline:none; }

  @media (max-width: 480px) {
    .frases { bottom:calc(env(safe-area-inset-bottom, 0px) + 14.5vh); height:4.9em; }
  }
  @media (orientation: landscape) and (max-height: 500px) {
    .subtitulo { display:none; }
    .titulo { font-size:17px; letter-spacing:0.2em; padding-left:0.2em; }
    .cabecera { top:calc(env(safe-area-inset-top, 0px) + 10px); }
    .escena { --L: min(62vh, 620px); margin-top:-4vh; }
    .texto-central { font-size:12px; line-height:1.8; }
    .frases { bottom:calc(env(safe-area-inset-bottom, 0px) + 30px); height:3.3em; }
    .frase { font-size:13px; line-height:1.45; }
    .hint { bottom:calc(env(safe-area-inset-bottom, 0px) + 8px); font-size:11px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation:none !important; transition:none !important; }
    .resplandor, .cuerpo, .onda8 { transform:translate(-50%,-50%); }
    .resplandor { opacity:0.6; }
    .escama { opacity:0.7; }
    .boca { opacity:0.75; }
    .orbita { display:none; }
    .texto-central { opacity:0.82; }
    .frases { height:auto; bottom:calc(env(safe-area-inset-bottom, 0px) + 9vh); }
    .frase { position:static; opacity:0.92; margin-bottom:0.35em; font-size: clamp(12px, 3.4vw, 16px); }
    .escena { margin-top:-12vh; }
    .hint { opacity:0.8; bottom:calc(env(safe-area-inset-bottom, 0px) + 18px); }
  }
</style>
</head>
<body>
  <div class="cabecera">
    <div class="titulo">LA SERPIENTE MORDIÉNDOSE LA COLA</div>
    <div class="subtitulo">Libro 11 - Nodo 73</div>
  </div>

  <div class="escena" id="escena">
    <div class="resplandor"></div>
    <div class="cuerpo c1"></div>
    <div class="cuerpo c2"></div>
    <div class="escamas" id="escamas"></div>
    <div class="boca" style="top:16.7%;"></div>
    <div class="boca" style="top:83.3%; animation-delay:-4s;"></div>
    <div class="onda8"></div>
    <div class="onda8 o2"></div>

    <div class="centro">
      <div class="texto-central">Principio<br>y fin<br>unidos<br><br>El círculo<br>sin ruptura</div>
    </div>
  </div>

  <div class="frases" aria-live="off">
    <p class="frase f1">El Ouroboros eterno<br>La serpiente que se devora a sí misma</p>
    <p class="frase f2">Donde termina comienza · Donde comienza termina<br>Ciclo perfecto</p>
  </div>

  <div class="hint" id="hint">( toca: sacude el lazo )</div>

  <a class="infinito" href="L_11-Nodo4.html" aria-label="Siguiente portal">∞</a>

<script>
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const escena = document.getElementById('escena');
  const escamas = document.getElementById('escamas');
  const hint = document.getElementById('hint');
  // El sonido se declara arriba
  let ctx = null, master, seco, sala, lazoDelay, lazoGain, mordidaGain, ruidoBuf, medidor, nivel = null;
  const F = 87.307;                                   // Fa grave

  /* Las veinticuatro escamas sobre el círculo; la ola las recorre en tres segundos */
  for (let i = 0; i < 24; i++) {
    const e = document.createElement('div'); e.className = 'escama';
    const a = (i / 24) * Math.PI * 2;
    e.style.left = (50 + Math.cos(a) * 33.3) + '%';
    e.style.top  = (50 + Math.sin(a) * 33.3) + '%';
    e.style.animationDelay = (-(3 - i * 0.125)) + 's';
    escamas.appendChild(e);
  }

  /* ---------------- El lazo que se sostiene solo ------------------------------------------------
     Un tubo de Rijke canta porque su propia vibración regula el calor que la alimenta; un micrófono
     frente a su parlante, porque lo que sale vuelve a entrar. Aquí el lazo es real dentro del audio:
     una línea de retardo del largo de un período de Fa, un filtro que deja pasar esa nota, una
     ganancia algo mayor que uno y una saturación suave que pone el límite. Basta un rumor de fondo:
     el tono crece hasta su tamaño propio y ahí se queda (un ciclo límite). La ganancia respira con
     el giro de la serpiente y con ella el timbre. Al tocar, una mordida: el lazo se abre un instante,
     entra un golpe de ruido y el tono vuelve solo a su círculo.
     Nota técnica: en Chrome, el retardo de un lazo suma un bloque de 128 muestras; el guion mide el
     período real en un contexto fuera de línea y corrige el retardo, para que suene en Fa en cualquier
     navegador.
  ------------------------------------------------------------------------------------------- */
  function makeReverbIR(ac, seconds = 4.5, decay = 2.4) {
    const len = Math.floor(ac.sampleRate * seconds);
    const buf = ac.createBuffer(2, len, ac.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    }
    return buf;
  }
  function curvaSuave(drive) {
    const c = new Float32Array(4097);
    for (let i = 0; i < c.length; i++) { const x = i / 2048 - 1; c[i] = Math.tanh(drive * x) / drive; }
    return c;
  }

  // Arma el lazo en cualquier contexto (también fuera de línea, para medirlo)
  function armarLazo(ac, dt, gInicial) {
    const dl = ac.createDelay(0.1); dl.delayTime.value = dt;
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = F; bp.Q.value = 1.2;
    const g = ac.createGain(); g.gain.value = gInicial;
    const sh = ac.createWaveShaper(); sh.curve = curvaSuave(2);
    dl.connect(bp); bp.connect(g); g.connect(sh); sh.connect(dl);
    return { dl, g, sh };
  }

  async function medirRetardo(sr) {                  // cuánto agrega el navegador al retardo del lazo
    try {
      const off = new OfflineAudioContext(1, Math.floor(sr * 2.4), sr);
      const dt0 = 1 / F - 128 / sr;
      const { dl, sh } = armarLazo(off, dt0, 1.5);
      const imp = off.createBuffer(1, 64, sr); imp.getChannelData(0).fill(0.05);
      const s = off.createBufferSource(); s.buffer = imp; s.connect(dl); s.start();
      sh.connect(off.destination);
      const x = (await off.startRendering()).getChannelData(0);
      const cr = [];
      for (let i = Math.floor(sr * 1.2); i < x.length; i++) if (x[i - 1] < 0 && x[i] >= 0) cr.push(i - 1 + (-x[i - 1]) / (x[i] - x[i - 1]));
      if (cr.length < 20) return dt0;
      const periodo = (cr[cr.length - 1] - cr[0]) / (cr.length - 1) / sr;
      const extra = periodo - dt0;                   // lo que el lazo agrega por su cuenta
      const dt = 1 / F - extra;
      return (dt > 128 / sr && dt < 0.02) ? dt : dt0;
    } catch (e) { return 1 / F - 128 / sr; }
  }

  async function startAudio() {
    if (ctx) return;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
    const t = ctx.currentTime, sr = ctx.sampleRate;
    master = ctx.createGain(); master.gain.value = 0; master.connect(ctx.destination);
    master.gain.setValueAtTime(0, t);
    master.gain.linearRampToValueAtTime(0.068, t + 6);
    seco = ctx.createGain(); seco.gain.value = 0.7; seco.connect(master);
    sala = ctx.createGain(); sala.gain.value = 0.5;
    const conv = ctx.createConvolver(); conv.buffer = makeReverbIR(ctx);
    sala.connect(conv); conv.connect(master);

    const lazo = armarLazo(ctx, 1 / F - 128 / sr, 0.75);
    lazoDelay = lazo.dl; lazoGain = lazo.g;
    // El rumor de fondo del que nace todo
    ruidoBuf = ctx.createBuffer(1, sr * 2, sr);
    const d = ruidoBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const rumor = ctx.createBufferSource(); rumor.buffer = ruidoBuf; rumor.loop = true;
    const rg = ctx.createGain(); rg.gain.value = 0.0006;
    rumor.connect(rg); rg.connect(lazoDelay); rumor.start();
    mordidaGain = ctx.createGain(); mordidaGain.gain.value = 0;
    const mord = ctx.createBufferSource(); mord.buffer = ruidoBuf; mord.loop = true;
    mord.connect(mordidaGain); mordidaGain.connect(lazoDelay); mord.start();
    // La serpiente muerde: la ganancia sube por encima de uno y respira con el giro (30 s)
    lazoGain.gain.setValueAtTime(0.75, t);
    lazoGain.gain.linearRampToValueAtTime(1.5, t + 3);
    const lfo = ctx.createOscillator(); lfo.frequency.value = 1 / 30;
    const lfoG = ctx.createGain(); lfoG.gain.value = 0;
    lfo.connect(lfoG); lfoG.connect(lazoGain.gain); lfo.start();
    lfoG.gain.setValueAtTime(0, t + 3); lfoG.gain.linearRampToValueAtTime(0.27, t + 9);
    // Lo que se oye: la salida del lazo, un poco más saturada afuera para que tenga cuerpo
    const afuera = ctx.createWaveShaper(); afuera.curve = curvaSuave(2.6);
    const pre = ctx.createGain(); pre.gain.value = 1.6;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2400; lp.Q.value = -3;
    const pan = ctx.createStereoPanner();
    const panLfo = ctx.createOscillator(); panLfo.frequency.value = 1 / 30;
    const panG = ctx.createGain(); panG.gain.value = 0.28;
    panLfo.connect(panG); panG.connect(pan.pan); panLfo.start();
    lazo.sh.connect(pre); pre.connect(afuera); afuera.connect(lp); lp.connect(pan);
    pan.connect(seco); pan.connect(sala);
    medidor = ctx.createAnalyser(); medidor.fftSize = 1024;
    lazo.sh.connect(medidor);
    nivel = new Float32Array(medidor.fftSize);
    // Se afina el retardo con lo que mide el propio navegador
    const dt = await medirRetardo(sr);
    lazoDelay.delayTime.setTargetAtTime(dt, ctx.currentTime, 0.05);
  }

  function morder() {
    if (!ctx) return;
    const t = ctx.currentTime + 0.01;
    const g = lazoGain.gain;
    g.cancelScheduledValues(t);
    g.setValueAtTime(1.5, t);
    g.linearRampToValueAtTime(0.7, t + 0.04);
    g.setValueAtTime(0.7, t + 0.22);
    g.linearRampToValueAtTime(1.5, t + 0.3);
    mordidaGain.gain.cancelScheduledValues(t);
    mordidaGain.gain.setValueAtTime(0.05, t + 0.2);
    mordidaGain.gain.linearRampToValueAtTime(0, t + 0.5);
  }

  /* ---------------- Las escamas brillan con el tono ------------------------------------------ */
  function brillar() {
    if (medidor) {
      medidor.getFloatTimeDomainData(nivel);
      let s = 0; for (let i = 0; i < nivel.length; i++) s += nivel[i] * nivel[i];
      const db = 20 * Math.log10(Math.sqrt(s / nivel.length) + 1e-9);
      const v = Math.max(0, Math.min(1, (db + 42) / 32));
      escamas.style.opacity = (0.3 + 0.7 * v).toFixed(3);
    }
    requestAnimationFrame(brillar);
  }

  /* ---------------- Lo que circula ---------------------------------------------------------- */
  function quitar(el) { el.addEventListener('animationend', () => el.remove(), { once: true }); }
  function consumo() {
    const f = document.createElement('div'); f.className = 'consumo';
    f.style.cssText = `--a:${(Math.random() * 360).toFixed(1)}deg;animation-delay:${(Math.random() * 5).toFixed(2)}s;`;
    escena.appendChild(f); quitar(f);
  }
  if (!reduce) {
    for (let i = 0; i < 12; i++) {                 // doce partículas repartidas en la órbita
      const p = document.createElement('div'); p.className = 'orbita';
      p.style.animationDelay = (-i) + 's';
      escena.appendChild(p);
    }
    setInterval(consumo, 2500);
    for (let i = 0; i < 6; i++) setTimeout(consumo, i * 800);
    requestAnimationFrame(brillar);
  }

  function tocar(cx, cy, muerde) {
    if (muerde) morder();
    if (reduce) return;
    const r = escena.getBoundingClientRect(), Lp = r.width;
    const x = ((cx - r.left) / r.width * 100).toFixed(2) + '%', y = ((cy - r.top) / r.height * 100).toFixed(2) + '%';
    for (let i = 0; i < 8; i++) setTimeout(() => {
      const a = document.createElement('div'); a.className = 'anillo-toque';
      a.style.cssText = `left:${x};top:${y};--s:${((50 + i * 40) / 600 * Lp).toFixed(1)}px;`;
      escena.appendChild(a); quitar(a);
    }, i * 150);
    for (let i = 0; i < 16; i++) setTimeout(() => {
      const f = document.createElement('div'); f.className = 'consumo';
      f.style.cssText = `left:${x};top:${y};--a:${(i / 16 * 360).toFixed(1)}deg;animation-duration:4s;`;
      escena.appendChild(f); quitar(f);
    }, i * 60);
    for (let i = 0; i < 20; i++) setTimeout(() => {
      const p = document.createElement('div'); p.className = 'espiral';
      p.style.cssText = `left:${x};top:${y};--r:${((50 + i * 8) / 600 * Lp).toFixed(1)}px;`;
      escena.appendChild(p); quitar(p);
    }, i * 50);
  }

  window.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.infinito')) return;
    const primero = !ctx;                           // el primer toque despierta el lazo: nace del rumor
    startAudio();
    hint.classList.add('oculto');
    tocar(e.clientX, e.clientY, !primero);
  });
</script>
</body>
</html>
