<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Libro 11 - Nodo 2: Causa Sin Precedente</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  html, body { height:100%; }
  body {
    background: radial-gradient(ellipse at center, #0b0b19 0%, #05050c 55%, #000 80%);
    color:#fff;
    font-family:'Georgia', serif;
    overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    cursor:none;
    -webkit-tap-highlight-color: transparent;
  }

  .titulo {
    position:fixed; top:calc(env(safe-area-inset-top, 0px) + 7vh); left:50%;
    transform:translateX(-50%);
    width:max-content; max-width:90vw; text-align:center;
    font-size: clamp(15px, 4.2vw, 22px);
    letter-spacing:0.32em;
    color: rgba(235,228,255,0.86);
    text-shadow: 0 0 26px rgba(150,100,255,0.45);
    z-index:5;
  }
  .subtitulo {
    position:fixed; top:calc(env(safe-area-inset-top, 0px) + 7vh + 2.4em); left:50%;
    transform:translateX(-50%);
    font-size: clamp(11px, 2.8vw, 13px);
    letter-spacing:0.28em; font-style:italic;
    color: rgba(200,190,235,0.5);
    z-index:5;
  }

  /* El campo causal: todo se ubica en porcentajes, nada se mide en píxeles fijos */
  .campo {
    position:relative;
    width:min(520px, 84vw);
    height:min(520px, 84vw);
  }

  .resplandor {
    position:absolute; inset:12%;
    border-radius:50%;
    background: radial-gradient(circle, rgba(150,100,255,0.16), transparent 68%);
    animation: respira 16s ease-in-out infinite;
    will-change: transform, opacity;
  }
  @keyframes respira {
    0%,100% { transform:scale(0.86); opacity:0.45; }
    50%     { transform:scale(1.12); opacity:0.85; }
  }

  .anillo {
    position:absolute; inset:14%;
    border-radius:50%;
    border:1px solid rgba(150,100,255,0.22);
  }

  /* La chispa recorre el anillo: una caja que gira, con la chispa en su borde superior */
  .recorrido {
    position:absolute; inset:14%;
    animation: gira 14s linear infinite;
    will-change: transform;
  }
  .chispa {
    position:absolute; top:-4px; left:50%;
    width:8px; height:8px; margin-left:-4px;
    border-radius:50%;
    background: rgba(255,255,255,0.95);
    box-shadow: 0 0 14px rgba(170,140,255,0.95), 0 0 30px rgba(120,150,255,0.6);
  }
  @keyframes gira { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }

  /* Los siete eslabones: cada uno se enciende cuando la chispa pasa */
  .eslabon {
    position:absolute;
    width:11%; height:11%;
    margin-left:-5.5%; margin-top:-5.5%;
    border-radius:50%;
    border:1px solid rgba(100,150,255,0.55);
    background: radial-gradient(circle, rgba(100,150,255,0.22), transparent 70%);
    animation: enciende 14s ease-out infinite;
    will-change: transform, opacity;
    opacity:0.35;
  }
  .eslabon.primero {
    border-color: rgba(255,170,110,0.7);
    background: radial-gradient(circle, rgba(255,160,100,0.28), transparent 70%);
  }
  @keyframes enciende {
    0%   { transform:scale(1.25); opacity:0.95; }
    18%  { transform:scale(1);    opacity:0.45; }
    100% { transform:scale(0.92); opacity:0.32; }
  }

  /* El centro: un punto que se enciende sin que nada lo toque */
  .origen {
    position:absolute; top:50%; left:50%;
    width:5%; height:5%;
    margin-left:-2.5%; margin-top:-2.5%;
    border-radius:50%;
    background: rgba(255,214,170,0.95);
    box-shadow: 0 0 18px rgba(255,170,110,0.8);
    animation: surge 14s ease-in-out infinite;
    will-change: transform, opacity;
  }
  @keyframes surge {
    0%   { transform:scale(0.2); opacity:0; }
    6%   { transform:scale(1.15); opacity:1; }
    30%  { transform:scale(1);    opacity:0.7; }
    80%  { transform:scale(0.9);  opacity:0.25; }
    100% { transform:scale(0.2);  opacity:0; }
  }

  /* Las frases: tres, cada una visible unos nueve segundos dentro de un ciclo de treinta */
  .frases {
    position:fixed; left:50%;
    bottom:calc(env(safe-area-inset-bottom, 0px) + 19vh);
    transform:translateX(-50%);
    width:88vw; max-width:560px; height:4.2em;
    text-align:center;
  }
  .frase {
    position:absolute; left:0; right:0; top:0;
    font-size: clamp(15px, 4.1vw, 20px);
    line-height:1.55;
    font-style:italic;
    color: rgba(236,230,255,0.92);
    text-shadow: 0 0 18px rgba(150,100,255,0.4);
    opacity:0;
    animation: frase 30s ease-in-out infinite;
    will-change: opacity, transform;
  }
  .frase.f2 { animation-delay:10s; }
  .frase.f3 { animation-delay:20s; }
  @keyframes frase {
    0%     { opacity:0; transform:translateY(6px); }
    4%     { opacity:1; transform:translateY(0); }
    30%    { opacity:1; transform:translateY(0); }
    33.3%  { opacity:0; transform:translateY(-4px); }
    100%   { opacity:0; transform:translateY(-4px); }
  }

  /* Las ondas que deja un toque: un comienzo que nada empujó */
  .onda {
    position:fixed;
    width:120px; height:120px; margin:-60px 0 0 -60px;
    border-radius:50%;
    border:1px solid rgba(255,190,140,0.75);
    pointer-events:none;
    animation: onda 3.2s ease-out forwards;
    will-change: transform, opacity;
  }
  @keyframes onda {
    0%   { transform:scale(0.05); opacity:1; }
    100% { transform:scale(3.4);  opacity:0; }
  }
  .punto-toque {
    position:fixed;
    width:10px; height:10px; margin:-5px 0 0 -5px;
    border-radius:50%;
    background: rgba(255,224,190,1);
    box-shadow: 0 0 20px rgba(255,170,110,0.95);
    pointer-events:none;
    animation: punto 3.2s ease-out forwards;
    will-change: transform, opacity;
  }
  @keyframes punto {
    0%   { transform:scale(0.2); opacity:0; }
    8%   { transform:scale(1.4); opacity:1; }
    100% { transform:scale(0.6); opacity:0; }
  }

  .codigo {
    position:fixed; left:50%;
    bottom:calc(env(safe-area-inset-bottom, 0px) + 18px);
    transform:translateX(-50%);
    font-family:'Courier New', monospace;
    font-size:10px; letter-spacing:2px;
    color: rgba(150,110,220,0.42);
    white-space:nowrap;
  }

  .hint {
    position:fixed; left:50%;
    bottom:calc(env(safe-area-inset-bottom, 0px) + 50px);
    transform:translateX(-50%);
    width:max-content; max-width:88vw; text-align:center;
    font-size: clamp(12px, 3.2vw, 14px);
    letter-spacing:1px;
    color: rgba(245,240,255,0.88);
    animation: invita 3.4s infinite ease-in-out;
    pointer-events:none;
    transition: opacity 1.2s ease;
  }
  @keyframes invita { 0%,100% { opacity:0.5; } 50% { opacity:0.95; } }

  .infinito {
    position:fixed;
    bottom:calc(env(safe-area-inset-bottom, 0px) + 14px); right:22px;
    font-size:30px; text-decoration:none;
    color: rgba(200,180,240,0.4);
    transition: color 0.8s ease, text-shadow 0.8s ease;
    z-index:20;
    cursor:pointer;
  }
  .infinito:hover, .infinito:focus-visible { color: rgba(255,200,150,0.95); text-shadow:0 0 18px rgba(255,170,110,0.55); outline:none; }

  @media (max-width: 480px) {
    .titulo { letter-spacing:0.2em; }
    .codigo { letter-spacing:1px; font-size:9px; }
    .frases { bottom:calc(env(safe-area-inset-bottom, 0px) + 16vh); }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation:none !important; }
    .eslabon { opacity:0.5; }
    .eslabon.primero { opacity:0.95; }
    .origen { opacity:0.8; }
    .recorrido { display:none; }
    .frases { height:auto; }
    .frase { position:static; opacity:0.92; margin-bottom:0.35em; }
    .hint { opacity:0.85; }
  }
</style>
</head>
<body>
  <div class="titulo">CAUSA SIN PRECEDENTE</div>
  <div class="subtitulo">Libro 11 - Nodo 2</div>

  <div class="campo" id="campo">
    <div class="resplandor"></div>
    <div class="anillo"></div>
    <div class="recorrido"><div class="chispa"></div></div>
    <div class="origen"></div>
  </div>

  <div class="frases" aria-live="off">
    <p class="frase f1">Toda causa busca su causa</p>
    <p class="frase f2">En el círculo, ninguna llegó primero</p>
    <p class="frase f3">El círculo entero es la causa sin precedente</p>
  </div>

  <div class="codigo">PORTAL_72::CAUSA_SIN_PRECEDENTE</div>
  <div class="hint">( toca — empieza algo que nada empujó )</div>

  <a class="infinito" href="L_11-Nodo3.html" aria-label="Siguiente portal">∞</a>

<script>
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const campo = document.getElementById('campo');
  const CICLO = 14;           // segundos de una vuelta de la chispa
  const N = 7;                // siete eslabones, como los siete nodos de cada libro

  /* Los eslabones se ubican en porcentajes sobre el anillo (inset 14% → radio 36%) */
  for (let i = 0; i < N; i++) {
    const a = (i / N) * Math.PI * 2 - Math.PI / 2;      // empieza arriba, donde nace la chispa
    const e = document.createElement('div');
    e.className = 'eslabon' + (i === 0 ? ' primero' : '');
    e.style.left = (50 + Math.cos(a) * 36) + '%';
    e.style.top  = (50 + Math.sin(a) * 36) + '%';
    e.style.animationDelay = (i * CICLO / N) + 's';     // se enciende cuando la chispa llega
    campo.appendChild(e);
  }

  /* ---------------- Diseño sonoro: la cadena causal que no tiene primer eslabón -----------
     Cada eslabón suena cuando la chispa lo alcanza: una nota empuja a la siguiente, como
     fichas de dominó. El primer eslabón no recibe golpe: su nota nace del silencio, con una
     entrada lenta, sin ataque. Y al cerrar la vuelta, el último eslabón vuelve a empujar al
     primero: la causa sin precedente era el círculo entero.
     Al tocar, suena una campana limpia que nada anunció: un comienzo propio.
  ------------------------------------------------------------------------------------------- */
  let started = false, ctx, master, verb, vuelta = null, inicio = 0;
  const NOTAS = [392.0, 349.2, 293.7, 261.6, 220.0, 196.0, 174.6]; // un descenso suave

  function makeIR(ac, seconds = 3.2, decay = 3) {
    const len = Math.floor(ac.sampleRate * seconds);
    const buf = ac.createBuffer(2, len, ac.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    }
    return buf;
  }

  function nota(f, cuando, suave) {
    const o = ctx.createOscillator(); o.type = suave ? 'sine' : 'triangle'; o.frequency.value = f;
    const g = ctx.createGain(); g.gain.value = 0;
    const p = ctx.createStereoPanner(); p.pan.value = (Math.random() * 1.2) - 0.6;
    o.connect(g); g.connect(p); p.connect(master); p.connect(verb);
    if (suave) {                                   // nace del silencio: sin golpe
      g.gain.setValueAtTime(0, cuando);
      g.gain.linearRampToValueAtTime(0.07, cuando + 1.1);
      g.gain.exponentialRampToValueAtTime(0.0008, cuando + 3.4);
    } else {                                       // empujada por la anterior
      g.gain.setValueAtTime(0, cuando);
      g.gain.linearRampToValueAtTime(0.055, cuando + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0008, cuando + 1.6);
    }
    o.start(cuando); o.stop(cuando + 3.6);
  }

  function unaVuelta() {
    if (!started) return;
    const t = ctx.currentTime + 0.05;
    for (let i = 0; i < N; i++) nota(NOTAS[i], t + i * CICLO / N, i === 0);
  }

  function campana(f) {
    const t = ctx.currentTime;
    [1, 2.01, 3.0].forEach((m, k) => {
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f * m;
      const g = ctx.createGain(); g.gain.value = 0;
      o.connect(g); g.connect(master); g.connect(verb);
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.09 / (k + 1), t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0006, t + 3.8 - k);
      o.start(t); o.stop(t + 4);
    });
  }

  function startAudio() {
    if (started) return; started = true;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain(); master.gain.value = 0; master.connect(ctx.destination);
    master.gain.linearRampToValueAtTime(0.3, ctx.currentTime + 5);

    const conv = ctx.createConvolver(); conv.buffer = makeIR(ctx);
    verb = ctx.createGain(); verb.gain.value = 0.55;
    verb.connect(conv); conv.connect(master);

    // Un fondo grave, casi inmóvil: lo que sostiene la cadena sin ser parte de ella
    [87.3, 130.8].forEach((f) => {
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f;
      const g = ctx.createGain(); g.gain.value = 0;
      o.connect(g); g.connect(master); g.connect(verb); o.start();
      g.gain.linearRampToValueAtTime(0.022, ctx.currentTime + 6);
    });

    // Sincronizar la cadena sonora con la vuelta visible de la chispa
    const transcurrido = (performance.now() - inicio) / 1000;
    const espera = (CICLO - (transcurrido % CICLO)) % CICLO;
    setTimeout(() => { unaVuelta(); vuelta = setInterval(unaVuelta, CICLO * 1000); }, espera * 1000);
  }

  function onda(x, y) {
    const w = document.createElement('div'); w.className = 'onda';
    w.style.left = x + 'px'; w.style.top = y + 'px';
    const p = document.createElement('div'); p.className = 'punto-toque';
    p.style.left = x + 'px'; p.style.top = y + 'px';
    document.body.appendChild(w); document.body.appendChild(p);
    setTimeout(() => { w.remove(); p.remove(); }, 3300);
  }

  const hint = document.querySelector('.hint');
  let despierto = false;
  window.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.infinito')) return;
    startAudio();
    if (!despierto) { despierto = true; if (hint) { hint.style.animation = 'none'; hint.style.opacity = '0.9'; requestAnimationFrame(() => { hint.style.opacity = '0'; }); } }
    if (!reduce) onda(e.clientX, e.clientY);
    if (ctx) campana(NOTAS[Math.floor(Math.random() * 3)] * 2);
  });

  inicio = performance.now();
</script>
</body>
</html>
