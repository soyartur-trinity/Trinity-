<!-- Portal 77. Saneado en noviembre de 2026 sobre el original: los tres anillos perfectos (ahora
     concéntricos; su giro no se ve, porque un círculo perfecto que gira no muestra dónde empieza), las
     ondas sin costura, el sin-comienzo y el sin-final, el ∞, las partículas en órbita eterna y las
     estelas del cursor. Sonido nuevo: la campana sin comienzo. Pierre Schaeffer (1948) cortó el ataque
     de una campana grabada y dejó de sonar a campana; la hizo girar en un surco cerrado, que no tiene
     primera ni última vuelta. Tres campanas sin golpe en tres surcos, uno por anillo, a 33⅓, 45 y 78
     revoluciones por minuto. Al tocar, un golpe que se disuelve en el giro. El ∞ lleva al Libro 12. -->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    background: radial-gradient(ellipse at center, #05050a 0%, #030308 55%, #000 80%);
    background-color:#000;
    color:#fff;
    font-family: Georgia, serif;
    overflow:hidden;
    height:100vh; height:100dvh;
    display:flex; align-items:center; justify-content:center;
    cursor:none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    -webkit-user-select:none; user-select:none;
  }

  .cabecera {
    position:fixed; left:50%; top:calc(env(safe-area-inset-top, 0px) + 5.5vh);
    transform:translateX(-50%);
    width:max-content; max-width:92vw; text-align:center;
    z-index:5; pointer-events:none;
  }
  .titulo {
    font-size: clamp(17px, 5vw, 32px);
    font-weight:bold;
    letter-spacing: clamp(0.16em, 1.2vw, 0.4em);
    padding-left: clamp(0.16em, 1.2vw, 0.4em);
    line-height:1.45;
    color: rgba(246,246,255,0.92);
    text-shadow: 0 0 30px rgba(200,200,255,0.5);
  }
  .subtitulo {
    margin-top:0.6em;
    font-size: clamp(11px, 2.9vw, 15px);
    letter-spacing:0.3em; padding-left:0.3em; font-style:italic;
    color: rgba(225,225,250,0.5);
  }

  .escena {
    --L: min(66vh, 640px, 92vw);
    position:relative;
    width:var(--L); height:var(--L);
    margin-top:-5vh;
  }

  .resplandor {
    position:absolute; left:50%; top:50%;
    width:95%; height:95%;
    border-radius:50%;
    background: radial-gradient(circle, rgba(200,200,255,0.11), rgba(200,200,255,0.04) 40%, transparent 68%);
    animation: resplandor 20s ease-in-out infinite;
  }
  @keyframes resplandor {
    0%,100% { transform:translate(-50%,-50%) scale(0.8) rotate(0deg);   opacity:0.4; }
    50%     { transform:translate(-50%,-50%) scale(1.45) rotate(180deg); opacity:0.75; }
  }

  /* Los tres anillos: tres surcos */
  .anillo {
    position:absolute; left:50%; top:50%;
    border-radius:50%;
    border:3px solid rgba(200,200,255,0.4);
    box-shadow: inset 0 0 calc(var(--L) * 0.086) rgba(200,200,255,0.15), 0 0 calc(var(--L) * 0.086) rgba(200,200,255,0.15);
    animation: gira 25s linear infinite;
  }
  .anillo.a1 { width:64.3%; height:64.3%; }
  .anillo.a2 { width:50%;   height:50%;   animation-duration:20s; animation-direction:reverse; }
  .anillo.a3 { width:35.7%; height:35.7%; animation-duration:30s; }
  @keyframes gira {
    from { transform:translate(-50%,-50%) rotate(0deg); }
    to   { transform:translate(-50%,-50%) rotate(360deg); }
  }

  .sin-costura {
    position:absolute; left:50%; top:50%;
    width:100%; height:100%;
    border:1px solid rgba(200,200,255,0.15);
    border-radius:50%;
    opacity:0.3;
    animation: sin-costura 20s ease-in-out infinite;
  }
  .sin-costura.s2 { animation-duration:25s; animation-delay:-6.7s; }
  @keyframes sin-costura {
    0%,100% { transform:translate(-50%,-50%) scale(0.9) rotate(0deg); }
    50%     { transform:translate(-50%,-50%) scale(1.3) rotate(180deg); }
  }

  .sin-comienzo, .sin-final {
    position:absolute; left:50%;
    width:14.3%; height:14.3%; margin:-7.15% 0 0 -7.15%;
    border-radius:50%;
    pointer-events:none;
  }
  .sin-comienzo {
    top:27%;
    background: radial-gradient(circle, rgba(255,255,255,0.32), rgba(200,200,255,0.14) 40%, transparent 70%);
    animation: sin-comienzo 16s ease-in-out infinite;
  }
  @keyframes sin-comienzo {
    0%,100% { transform:translate(0, 0) scale(0.8); opacity:0.5; }
    50%     { transform:translate(calc(var(--L) * 0.057), calc(var(--L) * -0.071)) scale(1.5); opacity:0.9; }
  }
  .sin-final {
    top:73%;
    background: radial-gradient(circle, rgba(200,200,255,0.32), rgba(150,150,255,0.14) 40%, transparent 70%);
    animation: sin-final 16s ease-in-out infinite;
  }
  @keyframes sin-final {
    0%,100% { transform:translate(0, 0) scale(1.5); opacity:0.9; }
    50%     { transform:translate(calc(var(--L) * -0.057), calc(var(--L) * 0.071)) scale(0.8); opacity:0.5; }
  }

  .simbolo {
    position:absolute; left:50%; top:50%;
    font-size: calc(var(--L) * 0.12);
    line-height:1;
    color: rgba(200,200,255,0.32);
    text-shadow: 0 0 40px rgba(200,200,255,0.6);
    opacity:0;
    animation: respira 15s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes respira {
    0%,100% { transform:translate(-50%,-50%) scale(0.7) rotate(-10deg); opacity:0; }
    50%     { transform:translate(-50%,-50%) scale(1.3) rotate(10deg);  opacity:0.7; }
  }

  .eterna {
    position:absolute; left:50%; top:50%;
    width:5px; height:5px; margin:-2.5px 0 0 -2.5px;
    border-radius:50%;
    background: rgba(255,255,255,0.95);
    box-shadow: 0 0 14px rgba(255,255,255,0.85);
    animation: eterna 18s linear infinite;
    pointer-events:none;
  }
  @keyframes eterna {
    from { transform:rotate(0deg)   translateX(var(--r)) rotate(0deg); }
    to   { transform:rotate(360deg) translateX(var(--r)) rotate(-360deg); }
  }

  .continuo {
    position:absolute; left:50%; top:50%;
    width:35.7%; height:3px; margin:-1.5px 0 0 -17.85%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.7), transparent);
    opacity:0;
    animation: continuo 13s ease-in-out forwards;
    pointer-events:none;
  }
  @keyframes continuo {
    0%,100% { transform:rotate(0deg) scaleX(0);     opacity:0; }
    50%     { transform:rotate(var(--a)) scaleX(1); opacity:0.9; }
  }

  /* El toque: anillos que se abren desde el punto, y un ∞ */
  .onda-toque {
    position:absolute;
    width:var(--s); height:var(--s);
    margin:calc(var(--s) / -2) 0 0 calc(var(--s) / -2);
    border:2px solid rgba(200,200,255,0.4);
    border-radius:50%;
    pointer-events:none;
    animation: abre 3s ease-out forwards;
  }
  @keyframes abre {
    0%   { transform:scale(1); opacity:0.6; }
    100% { transform:scale(2); opacity:0; }
  }
  .simbolo.toque { font-size: calc(var(--L) * 0.14); animation: respira 4s ease-out forwards; }

  .centro { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; z-index:3; }
  .texto-central {
    text-align:center;
    font-size: clamp(13px, 3.7vw, 22px);
    letter-spacing:0.38em; padding-left:0.38em;
    line-height:1.95;
    color: rgba(255,255,255,0.95);
    text-shadow: 0 0 22px rgba(255,255,255,0.4), 0 0 10px rgba(0,0,0,0.85);
    opacity:0;
    animation: texto 15s ease-in-out infinite;
    animation-delay:-3s;
  }
  @keyframes texto {
    0%,100% { opacity:0;   transform:scale(0.85) rotate(-2deg); }
    20%,80% { opacity:0.82; transform:scale(1) rotate(0deg); }
  }

  .frases {
    position:fixed; left:50%;
    bottom:calc(env(safe-area-inset-bottom, 0px) + 15vh);
    transform:translateX(-50%);
    width:90vw; max-width:660px; height:3.4em;
    text-align:center;
    pointer-events:none;
  }
  .frase {
    position:absolute; left:0; right:0; bottom:0;
    font-size: clamp(14px, 3.8vw, 19px);
    line-height:1.6;
    letter-spacing:0.06em;
    font-style:italic;
    color: rgba(240,240,252,0.9);
    text-shadow: 0 0 18px rgba(200,200,255,0.32);
    opacity:0;
    animation: frase 20s ease-in-out infinite;
  }
  .frase.f2 { animation-delay:10s; }
  @keyframes frase {
    0%   { opacity:0; transform:translateY(6px); }
    7%   { opacity:1; transform:translateY(0); }
    43%  { opacity:1; transform:translateY(0); }
    50%  { opacity:0; transform:translateY(-4px); }
    100% { opacity:0; transform:translateY(-4px); }
  }

  .hint {
    position:fixed; left:50%;
    bottom:calc(env(safe-area-inset-bottom, 0px) + 50px);
    transform:translateX(-50%);
    width:max-content; max-width:88vw; text-align:center;
    font-size: clamp(12px, 3.2vw, 14px);
    letter-spacing:1px;
    color: rgba(240,240,252,0.88);
    animation: invita 3.4s infinite ease-in-out;
    pointer-events:none;
    transition: opacity 1.4s ease;
  }
  .hint.oculto { animation:none; opacity:0; }
  @keyframes invita { 0%,100% { opacity:0.45; } 50% { opacity:0.95; } }

  .infinito {
    position:fixed;
    bottom:calc(env(safe-area-inset-bottom, 0px) + 14px); right:22px;
    font-size:30px; text-decoration:none;
    color: rgba(205,205,240,0.4);
    transition: color 0.8s ease, text-shadow 0.8s ease;
    z-index:20;
    cursor:pointer;
  }
  .infinito:hover, .infinito:focus-visible { color: rgba(240,240,255,0.95); text-shadow:0 0 18px rgba(200,200,255,0.6); outline:none; }

  @media (max-width: 480px) {
    .frases { bottom:calc(env(safe-area-inset-bottom, 0px) + 14.5vh); height:4.9em; }
  }
  @media (orientation: landscape) and (max-height: 500px) {
    .subtitulo { display:none; }
    .titulo { font-size:17px; letter-spacing:0.2em; padding-left:0.2em; }
    .cabecera { top:calc(env(safe-area-inset-top, 0px) + 10px); }
    .escena { --L: min(62vh, 620px); margin-top:-4vh; }
    .texto-central { font-size:11px; line-height:1.6; }
    .frases { bottom:calc(env(safe-area-inset-bottom, 0px) + 30px); height:3.3em; }
    .frase { font-size:13px; line-height:1.45; }
    .hint { bottom:calc(env(safe-area-inset-bottom, 0px) + 8px); font-size:11px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation:none !important; transition:none !important; }
    .resplandor, .anillo, .sin-costura { transform:translate(-50%,-50%); }
    .resplandor { opacity:0.6; }
    .sin-comienzo, .sin-final { opacity:0.7; }
    .simbolo { opacity:0.45; transform:translate(-50%,-50%); }
    .texto-central { opacity:0.82; }
    .frases { height:auto; bottom:calc(env(safe-area-inset-bottom, 0px) + 9vh); }
    .frase { position:static; opacity:0.92; margin-bottom:0.35em; font-size: clamp(12px, 3.4vw, 16px); }
    .escena { margin-top:-12vh; }
    .hint { opacity:0.8; bottom:calc(env(safe-area-inset-bottom, 0px) + 18px); }
  }
</style>

<body>
  <div class="cabecera">
    <div class="titulo">EL CÍRCULO SIN PRINCIPIO</div>
    <div class="subtitulo">Libro 11 - Nodo 77</div>
  </div>

  <div class="escena" id="escena">
    <div class="resplandor"></div>
    <div class="anillo a1"></div>
    <div class="anillo a2"></div>
    <div class="anillo a3"></div>
    <div class="sin-costura"></div>
    <div class="sin-costura s2"></div>
    <div class="sin-comienzo"></div>
    <div class="sin-final"></div>
    <div class="simbolo">∞</div>

    <div class="centro">
      <div class="texto-central">Ni comienzo<br>Ni final<br><br>Solo<br>la danza<br>eterna<br><br>∞</div>
    </div>
  </div>

  <div class="frases" aria-live="off">
    <p class="frase f1">El círculo perfecto<br>Sin primera ni última vuelta</p>
    <p class="frase f2">La causalidad circular completada<br>El bucle que trasciende el tiempo lineal</p>
  </div>

  <div class="hint" id="hint">( toca: un comienzo )</div>

  <a class="infinito" href="../Libro_12/L_12-Nodo1.html" aria-label="Siguiente portal">∞</a>

<script>
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const escena = document.getElementById('escena');
  const hint = document.getElementById('hint');
  // El sonido se declara arriba
  let ctx = null, master, seco, sala;
  const surcos = [];                                 // por anillo: { prima, gain, nivel, seca }

  /* ---------------- La campana sin comienzo ----------------------------------------------------
     En 1948 Pierre Schaeffer grabó una campana, le cortó el ataque y dejó de sonar a campana: se
     oía como una flauta, un órgano. Reconocemos un instrumento sobre todo por su comienzo (lo
     midieron después Saldanha y Corso, 1964). Schaeffer hizo girar esos sonidos en un surco cerrado,
     un círculo del disco que no lleva a ninguna parte y no tiene primera ni última vuelta. Aquí, tres
     campanas de Fa, Do y Fa sin su golpe, cada una en un surco del largo de una vuelta de disco: el
     anillo grande a 33⅓ revoluciones (1,8 s), el del medio a 45 (1,33 s), el pequeño a 78 (0,77 s).
     Cada vuelta se oye como una respiración, y los tres giros nunca coinciden en un mismo punto. Cada
     surco viaja de un lado al otro al ritmo de su anillo, cuyo giro el ojo no ve. Al tocar, una campana
     entera, con su golpe: por un instante es campana; después se disuelve en el giro.
  ------------------------------------------------------------------------------------------- */
  const SURCOS = [
    { prima: 174.61, vuelta: 60 / 33.333, giro: 25,  sentido:  1, nivel: 1.0  },   // anillo grande
    { prima: 261.63, vuelta: 60 / 45,     giro: 20,  sentido: -1, nivel: 0.78 },   // anillo del medio
    { prima: 349.23, vuelta: 60 / 78,     giro: 30,  sentido:  1, nivel: 0.6  },   // anillo pequeño
  ];

  function makeReverbIR(ac, seconds = 5, decay = 2.2) {
    const len = Math.floor(ac.sampleRate * seconds);
    const buf = ac.createBuffer(2, len, ac.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    }
    return buf;
  }

  // La misma campana de tercera mayor del portal 71: zumbido, prima, tercera, quinta, nominal...
  function campanaSeca(sr, prima) {
    const dur = 5.2, n = Math.floor(sr * dur), d = new Float32Array(n);
    const P = [[0.5, 0.5, 2.6, -4], [1, 0.45, 1.9, 0], [1.25, 0.33, 1.4, 5], [1.5, 0.2, 1.1, -4],
               [2, 0.4, 1.2, 0], [2.52, 0.16, 0.8, 0], [3.01, 0.13, 0.6, 0], [4.2, 0.09, 0.35, 0], [5.4, 0.05, 0.2, 0]];
    for (const [r, a, tau, c] of P) {
      const f = prima * r * Math.pow(2, c / 1200);
      const w1 = 2 * Math.PI * f / sr, w2 = 2 * Math.PI * f * 1.0016 / sr, k = Math.exp(-1 / (tau * sr));
      let env = a * 0.5;
      for (let i = 0; i < n; i++) { d[i] += env * (Math.sin(w1 * i) + Math.sin(w2 * i)); env *= k; }
    }
    const nc = Math.floor(sr * 0.012);
    for (let i = 0; i < nc; i++) d[i] += (Math.random() * 2 - 1) * 0.3 * Math.exp(-i / (sr * 0.003));
    const nf = Math.floor(sr * 1.2);
    for (let i = 0; i < nf; i++) d[n - 1 - i] *= 0.5 - 0.5 * Math.cos(Math.PI * i / nf);
    let m = 0; for (let i = 0; i < n; i++) m = Math.max(m, Math.abs(d[i]));
    for (let i = 0; i < n; i++) d[i] *= 0.8 / m;
    return d;
  }

  // El surco cerrado: un tramo sin el ataque, del largo de una vuelta, con la costura fundida.
  // Dentro de cada vuelta la campana se apaga un poco; se compensa la mitad de esa caída, para que
  // la vuelta respire sin que la costura suene a golpe.
  function surcoCerrado(seca, sr, vuelta) {
    const corte = Math.floor(sr * 0.5), P = Math.floor(sr * vuelta), X = Math.floor(sr * 0.08);
    const q = Math.floor(P / 10);
    let a = 0, z = 0;
    for (let i = 0; i < q; i++) { a += seca[corte + i] ** 2; z += seca[corte + P - q + i] ** 2; }
    const caida = Math.log(Math.sqrt(a / q) / Math.sqrt(z / q) || 1);
    const lazo = new Float32Array(P);
    const comp = (i) => Math.exp(0.5 * caida * i / P);
    for (let i = 0; i < P; i++) lazo[i] = seca[corte + i] * comp(i);
    for (let i = 0; i < X; i++) {
      const u = i / X;
      lazo[i] = seca[corte + i] * comp(i) * Math.sin(u * Math.PI / 2) + seca[corte + P + i] * comp(P + i) * Math.cos(u * Math.PI / 2);
    }
    let s = 0; for (let i = 0; i < P; i++) s += lazo[i] * lazo[i];
    const r = Math.sqrt(s / P) || 1;
    for (let i = 0; i < P; i++) lazo[i] *= 0.25 / r;
    return lazo;
  }

  function startAudio() {
    if (ctx) return;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
    const t = ctx.currentTime, sr = ctx.sampleRate;
    master = ctx.createGain(); master.gain.value = 0; master.connect(ctx.destination);
    master.gain.setValueAtTime(0, t);
    master.gain.linearRampToValueAtTime(0.06, t + 6);
    seco = ctx.createGain(); seco.gain.value = 0.7; seco.connect(master);
    sala = ctx.createGain(); sala.gain.value = 0.5;
    const conv = ctx.createConvolver(); conv.buffer = makeReverbIR(ctx);
    sala.connect(conv); conv.connect(master);
    SURCOS.forEach((S) => {
      const seca = campanaSeca(sr, S.prima);
      const lazo = surcoCerrado(seca, sr, S.vuelta);
      const b = ctx.createBuffer(1, lazo.length, sr); b.getChannelData(0).set(lazo);
      const src = ctx.createBufferSource(); src.buffer = b; src.loop = true;
      const g = ctx.createGain(); g.gain.value = 0;
      const p = ctx.createStereoPanner(); p.pan.value = 0;
      const lfo = ctx.createOscillator(); lfo.frequency.value = 1 / S.giro;
      const lg = ctx.createGain(); lg.gain.value = 0.45 * S.sentido;
      lfo.connect(lg); lg.connect(p.pan); lfo.start(t);
      src.connect(g); g.connect(p); p.connect(seco); p.connect(sala);
      src.start(t, Math.random() * S.vuelta);                    // ningún surco empieza donde otro
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(S.nivel, t + 6);
      surcos.push({ ...S, g, seca });
    });
  }

  function golpe(S, pan) {
    const t = ctx.currentTime + 0.01, sr = ctx.sampleRate;
    const b = ctx.createBuffer(1, S.seca.length, sr); b.getChannelData(0).set(S.seca);
    const s = ctx.createBufferSource(); s.buffer = b;
    const g = ctx.createGain(); g.gain.value = 0.55;
    const p = ctx.createStereoPanner(); p.pan.value = pan;
    s.connect(g); g.connect(p); p.connect(seco); p.connect(sala);
    s.start(t);
    s.onended = () => { s.disconnect(); g.disconnect(); p.disconnect(); };
    // El surco de esa campana la recibe: crece un poco y vuelve
    S.g.gain.cancelScheduledValues(t);
    S.g.gain.setValueAtTime(S.g.gain.value, t);
    S.g.gain.setTargetAtTime(S.nivel * 1.55, t + 0.4, 0.8);
    S.g.gain.setTargetAtTime(S.nivel, t + 3.5, 2.2);
  }

  /* ---------------- Lo que gira sin empezar ------------------------------------------------- */
  function quitar(el) { el.addEventListener('animationend', () => el.remove(), { once: true }); }
  function continuo(x, y, a, extra) {
    const f = document.createElement('div'); f.className = 'continuo';
    f.style.cssText = `left:${x};top:${y};--a:${a.toFixed(1)}deg;` + (extra || `animation-delay:${(Math.random() * 6).toFixed(2)}s;`);
    escena.appendChild(f); quitar(f);
  }
  function orbitante(x, y, r, dur, extra) {
    const p = document.createElement('div'); p.className = 'eterna';
    p.style.cssText = `left:${x};top:${y};--r:${r};` + (dur ? `animation:eterna ${dur}s linear forwards;` : '') + (extra || '');
    escena.appendChild(p);
    if (dur) quitar(p);
    return p;
  }
  if (!reduce) {
    for (let i = 0; i < 24; i++) orbitante('50%', '50%', `calc(var(--L) * ${(0.257 + (i % 4) * 0.043).toFixed(3)})`, 0, `animation-delay:${(-i * 0.75).toFixed(2)}s;`);
    const azar = () => continuo('50%', '50%', Math.random() * 360);
    setInterval(azar, 2700);
    for (let i = 0; i < 8; i++) setTimeout(azar, i * 900);
  }

  /* ---------------- El toque: un comienzo ----------------------------------------------------- */
  function tocar(cx, cy) {
    const r = escena.getBoundingClientRect(), L = r.width;
    const dist = Math.hypot(cx - (r.left + L / 2), cy - (r.top + L / 2)) / L;
    const k = dist < 0.215 ? 2 : dist < 0.285 ? 1 : 0;           // el anillo más cercano al toque
    if (ctx && surcos[k]) golpe(surcos[k], Math.max(-0.7, Math.min(0.7, (cx / innerWidth) * 1.4 - 0.7)));
    if (reduce) return;
    const x = ((cx - r.left) / L * 100).toFixed(2) + '%', y = ((cy - r.top) / L * 100).toFixed(2) + '%';
    for (let i = 0; i < 10; i++) setTimeout(() => {
      const o = document.createElement('div'); o.className = 'onda-toque';
      o.style.cssText = `left:${x};top:${y};--s:${((60 + i * 45) / 700 * L).toFixed(1)}px;`;
      escena.appendChild(o); quitar(o);
    }, i * 120);
    for (let i = 0; i < 16; i++) setTimeout(() => continuo(x, y, i * 22.5, 'animation-duration:6s;'), i * 70);
    for (let i = 0; i < 32; i++) setTimeout(() => orbitante(x, y, `${((50 + (i % 4) * 25) / 700 * L).toFixed(1)}px`, 8), i * 40);
    const s = document.createElement('div'); s.className = 'simbolo toque'; s.textContent = '∞';
    s.style.cssText = `left:${x};top:${y};`;
    escena.appendChild(s); quitar(s);
  }

  window.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.infinito')) return;
    startAudio();
    hint.classList.add('oculto');
    tocar(e.clientX, e.clientY);
  });

  /* Con el ratón, estelas que entran en órbita por donde pasa */
  let ultimoPaso = 0;
  window.addEventListener('pointermove', (e) => {
    if (reduce || e.pointerType !== 'mouse') return;
    const t = performance.now();
    if (t - ultimoPaso < 250) return;
    ultimoPaso = t;
    const r = escena.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width * 100, py = (e.clientY - r.top) / r.height * 100;
    if (px < 0 || py < 0 || px > 100 || py > 100) return;
    orbitante(`${px.toFixed(2)}%`, `${py.toFixed(2)}%`, `${(60 / 700 * r.width).toFixed(1)}px`, 4);
  });
</script>
</body>
