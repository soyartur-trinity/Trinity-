<style>
  * { margin:0; padding:0; box-sizing:border-box;
      -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; }

  html, body { height:100%; }
  body {
    background:#000;
    overflow:hidden;
    display:flex; justify-content:center; align-items:center;
    height:100vh; height:100dvh;
    font-family:'Georgia', serif;
    cursor:none;
    -webkit-tap-highlight-color: transparent;
  }

  .unreached-past {
    position:relative;
    width:min(800px, 95vw);
    height:min(800px, 86vh);
  }

  /* Campo de aproximación: un aura redonda que gira */
  .quantum-approach-field {
    position:absolute; top:50%; left:50%;
    width:min(900px, 116vmin); height:min(900px, 116vmin);
    border-radius:50%;
    background: conic-gradient(from 0deg at 50% 50%,
      transparent 0deg, rgba(59,130,246,0.09) 90deg, transparent 180deg, rgba(147,51,234,0.09) 270deg, transparent 360deg);
    -webkit-mask: radial-gradient(circle closest-side, #000 35%, rgba(0,0,0,0.6) 68%, transparent 100%);
            mask: radial-gradient(circle closest-side, #000 35%, rgba(0,0,0,0.6) 68%, transparent 100%);
    transform: translate(-50%,-50%);
    animation: fieldRotate 20s infinite linear;
    will-change: transform;
    pointer-events:none;
  }
  @keyframes fieldRotate {
    from { transform: translate(-50%,-50%) rotate(0deg); }
    to   { transform: translate(-50%,-50%) rotate(360deg); }
  }

  /* El horizonte de la memoria */
  .memory-horizon {
    position:absolute; top:50%; left:50%;
    width:min(450px, 56vmin); height:min(450px, 56vmin);
    border-radius:50%;
    background: radial-gradient(circle at center,
      transparent 30%, rgba(147,51,234,0.07) 40%, rgba(59,130,246,0.13) 60%, rgba(6,182,212,0.06) 80%, transparent 100%);
    transform: translate(-50%,-50%);
    animation: horizonPulse 8s infinite alternate ease-in-out;
    will-change: transform, opacity;
    pointer-events:none;
  }
  @keyframes horizonPulse {
    0%   { transform: translate(-50%,-50%) scale(1);   opacity:1; }
    100% { transform: translate(-50%,-50%) scale(1.2); opacity:0.75; }
  }

  .temporal-asymptote {
    position:absolute; top:50%; left:50%;
    width:min(300px, 38vmin); height:min(300px, 38vmin);
    border:1px dashed rgba(147,51,234,0.35);
    border-radius:50%;
    transform: translate(-50%,-50%);
    animation: asymptoteRotate 15s infinite linear;
    will-change: transform;
    pointer-events:none;
  }
  @keyframes asymptoteRotate {
    from { transform: translate(-50%,-50%) rotate(0deg); }
    to   { transform: translate(-50%,-50%) rotate(360deg); }
  }

  /* Los anillos de Zenón: cada uno, a la mitad de la distancia del anterior.
     El dibujo es igual a sí mismo cada tres segundos: se acerca siempre y nunca llega. */
  .approach-ring {
    position:absolute; top:50%; left:50%;
    width:min(420px, 52vmin); height:min(420px, 52vmin);
    border:1px solid rgba(59,130,246,0.5);
    border-radius:50%;
    transform: translate(-50%,-50%) scale(1);
    opacity:0;
    animation: zenon 15s infinite linear;
    will-change: transform, opacity;
    pointer-events:none;
  }
  .approach-ring:nth-child(2) { animation-delay:-3s;  border-color: rgba(120,110,245,0.5); }
  .approach-ring:nth-child(3) { animation-delay:-6s;  border-color: rgba(147,51,234,0.5); }
  .approach-ring:nth-child(4) { animation-delay:-9s;  border-color: rgba(6,182,212,0.45); }
  .approach-ring:nth-child(5) { animation-delay:-12s; border-color: rgba(59,130,246,0.5); }
  @keyframes zenon {
    0%   { transform: translate(-50%,-50%) scale(1);      opacity:0; }
    6%   { transform: translate(-50%,-50%) scale(0.81);   opacity:0.9; }
    20%  { transform: translate(-50%,-50%) scale(0.5);    opacity:0.9; }
    40%  { transform: translate(-50%,-50%) scale(0.25);   opacity:0.85; }
    60%  { transform: translate(-50%,-50%) scale(0.125);  opacity:0.75; }
    80%  { transform: translate(-50%,-50%) scale(0.0625); opacity:0.5; }
    100% { transform: translate(-50%,-50%) scale(0.0313); opacity:0; }
  }

  .temporal-void {
    position:absolute; top:50%; left:50%;
    width:min(50px, 7vmin); height:min(50px, 7vmin);
    border-radius:50%;
    background: radial-gradient(circle, #000 40%, transparent 60%);
    transform: translate(-50%,-50%);
    animation: voidPulse 4s infinite;
    will-change: transform;
    pointer-events:none;
  }
  @keyframes voidPulse {
    0%,100% { transform: translate(-50%,-50%) scale(1); }
    50%     { transform: translate(-50%,-50%) scale(1.5); }
  }

  /* La línea de Zenón: llega desde la derecha y nunca alcanza el borde */
  .zeno-carril {
    position:absolute; top:50%; left:0;
    width:100%; height:1px;
    animation: zenoParadox 10s infinite;
    will-change: transform;
    pointer-events:none;
  }
  .zeno-line {
    width:min(400px, 50vmin); height:1px;
    background: repeating-linear-gradient(90deg,
      rgba(147,51,234,0.5) 0, rgba(147,51,234,0.5) 10px, transparent 10px, transparent 20px);
  }
  @keyframes zenoParadox {
    0%   { transform: translateX(100%); }
    90%  { transform: translateX(min(50px, 6vmin)); }
    100% { transform: translateX(100%); }
  }

  /* El pasado que se acerca */
  .approaching-past {
    position:absolute; left:0;
    width:min(100px, 13vmin); height:1px;
    background: linear-gradient(90deg, rgba(147,51,234,0.85), transparent);
    opacity:0;
    animation: pastApproach 6s infinite;
    will-change: transform, opacity;
    pointer-events:none;
  }
  @keyframes pastApproach {
    0%   { transform: translateX(min(300px, 38vmin)); opacity:0; }
    50%  { opacity:1; }
    99%  { transform: translateX(calc(-1 * min(50px, 6vmin))); opacity:1; }
    100% { transform: translateX(min(300px, 38vmin)); opacity:0; }
  }

  .zeno-point {
    position:absolute;
    width:clamp(4px, 0.8vmin, 6px); height:clamp(4px, 0.8vmin, 6px);
    border-radius:50%;
    background: rgba(147,51,234,0.85);
    animation: zenoDance 3s infinite alternate;
    will-change: transform;
    pointer-events:none;
  }
  @keyframes zenoDance {
    0%   { transform: translateX(0) scale(1); }
    100% { transform: translateX(min(100px, 13vmin)) scale(0.5); }
  }

  /* Partículas en órbita */
  .asymptotic-particle {
    position:absolute; top:50%; left:50%;
    width:clamp(3px, 0.55vmin, 4px); height:clamp(3px, 0.55vmin, 4px);
    margin:-2px 0 0 -2px;
    border-radius:50%;
    background: rgba(6,182,212,0.75);
    opacity:0;
    animation: asymptoticOrbit 8s infinite linear;
    pointer-events:none;
  }
  @keyframes asymptoticOrbit {
    0%   { transform: rotate(0deg)   translateX(min(200px, 25vmin)) rotate(0deg);    opacity:0; }
    50%  { opacity:1; }
    100% { transform: rotate(360deg) translateX(min(200px, 25vmin)) rotate(-360deg); opacity:0; }
  }

  /* Fragmentos del pasado: cada paso los deja a una fracción fija de la distancia que les falta */
  .frag {
    --R: min(350px, 44vmin);
    position:absolute; top:50%; left:50%;
    width:3px; height:3px; margin:-1.5px 0 0 -1.5px;
    border-radius:50%;
    background: rgba(147,51,234,0.8);
    opacity:0;
    animation: acerca 3.5s infinite linear;
    pointer-events:none;
  }
  @keyframes acerca {
    0%   { transform: rotate(var(--a)) translateX(var(--R));                opacity:0; }
    20%  { transform: rotate(var(--a)) translateX(calc(var(--R) * 0.487)); opacity:0.5; }
    40%  { transform: rotate(var(--a)) translateX(calc(var(--R) * 0.237)); opacity:0.76; }
    60%  { transform: rotate(var(--a)) translateX(calc(var(--R) * 0.115)); opacity:0.88; }
    80%  { transform: rotate(var(--a)) translateX(calc(var(--R) * 0.056)); opacity:0.94; }
    100% { transform: rotate(var(--a)) translateX(calc(var(--R) * 0.027)); opacity:0; }
  }

  .memory-fragment {
    position:absolute;
    width:2px; height:2px;
    border-radius:50%;
    background: rgba(147,51,234,0.7);
    opacity:0;
    animation: fragmentFloat 4s infinite;
    pointer-events:none;
  }
  @keyframes fragmentFloat { 0%,100% { opacity:0; } 50% { opacity:1; } }

  /* Las memorias inalcanzables */
  .unreachable-memory {
    position:absolute;
    width:max-content;
    color: rgba(175,125,245,0.92);
    font-size: clamp(13px, 3.5vw, 15px);

  .u1 { top:25%;    left:18%;  animation-delay:0s; }
  .u2 { top:25%;    right:18%; animation-delay:3.5s; }
  .u3 { bottom:25%; right:18%; animation-delay:7s; }
  .u4 { bottom:25%; left:18%;  animation-delay:10.5s; }
  @keyframes memoryFade {
    0%       { opacity:0;    transform: translateX(min(40px, 6vmin)); }
    14%      { opacity:0.92; transform: translateX(0); }
    78%      { opacity:0.92; transform: translateX(0); }
    90%,100% { opacity:0;    transform: translateX(calc(-1 * min(14px, 2vmin))); }
  }

  .paradox-control {
    position:absolute; top:4%; left:50%;
    width:max-content; max-width:86vw;
    text-align:center;
    color: rgba(110,160,250,0.8);
    font-size: clamp(10px, 2.8vw, 12px);
    letter-spacing:2px;
    transform: translateX(-50%);
    animation: controlPulse 5s infinite;
    z-index:20;
  }
  @keyframes controlPulse { 0%,100% { opacity:0.6; } 50% { opacity:1; } }

  .paradox-inscription {
    position:absolute; bottom:7%; left:50%;
    width:88%;
    color: rgba(120,165,250,0.95);
    font-size: clamp(16px, 4.4vw, 20px);
    font-style:italic;
    text-align:center; line-height:1.5;
    text-shadow: 0 0 15px rgba(59,130,246,0.4);
    opacity:0;
    transform: translateX(-50%) scale(0.96);
    animation: inscriptionGlow 16s infinite ease-in-out;
    will-change: opacity, transform;
    z-index:20;
  }
  @keyframes inscriptionGlow {
    0%       { opacity:0;    transform: translateX(-50%) scale(0.96); }
    12%      { opacity:0.95; transform: translateX(-50%) scale(1); }
    80%      { opacity:0.95; transform: translateX(-50%) scale(1.02); }
    92%,100% { opacity:0;    transform: translateX(-50%) scale(1.02); }
  }

  /* El toque: un anillo que se cierra sobre el punto tocado */
  .acercamiento {
    position:fixed;
    width:min(120px, 20vmin); height:min(120px, 20vmin);
    border:1px solid rgba(110,150,250,0.85);
    border-radius:50%;
    transform: translate(-50%,-50%) scale(2);
    opacity:0;
    pointer-events:none;
    animation: seCierra 2.6s ease-out forwards;
  }
  @keyframes seCierra {
    0%   { transform: translate(-50%,-50%) scale(2);    opacity:0; }
    20%  { opacity:0.9; }
    100% { transform: translate(-50%,-50%) scale(0.06); opacity:0; }
  }

  .transmission-code {
    position:fixed; left:50%;
    bottom:calc(env(safe-area-inset-bottom, 0px) + 14px);
    transform: translateX(-50%);
    color: rgba(147,51,234,0.45);
    font-family:'Courier New', monospace;
    font-size:10px; letter-spacing:2px; line-height:1.5;
    text-align:center; white-space:nowrap;
    animation: codeFlicker 5s infinite ease-in-out;
  }
  @keyframes codeFlicker { 0%,100% { opacity:0.3; } 50% { opacity:0.7; } }

  .hint {
    position:fixed; left:50%;
    bottom:calc(env(safe-area-inset-bottom, 0px) + 50px);
    transform: translateX(-50%);
    width:max-content; max-width:88vw; text-align:center;
    font-size: clamp(12px, 3.2vw, 14px);
    letter-spacing:1px;
    color: rgba(235,235,255,0.88);
    animation: invita 3.4s infinite ease-in-out;
    pointer-events:none;
    transition: opacity 1.4s ease;
    z-index:30;
  }
  .hint.oculto { animation:none; opacity:0; }
  @keyframes invita { 0%,100% { opacity:0.45; } 50% { opacity:0.95; } }

  .infinito {
    position:fixed;
    bottom:calc(env(safe-area-inset-bottom, 0px) + 14px); right:22px;
    font-size:30px; text-decoration:none;
    color: rgba(170,170,245,0.4);
    transition: color 0.8s ease, text-shadow 0.8s ease;
    z-index:31;
    cursor:pointer;
  }
  .infinito:hover, .infinito:focus-visible { color: rgba(220,220,255,0.95); text-shadow: 0 0 18px rgba(90,130,240,0.6); outline:none; }

  @media (max-width: 480px) {
    .u1, .u4 { left:7%; }
    .u2, .u3 { right:7%; }
    .transmission-code { font-size:7px; letter-spacing:0.3px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation:none !important; }
    .approach-ring { opacity:0.7; }
    .approach-ring:nth-child(1) { transform: translate(-50%,-50%) scale(0.81); }
    .approach-ring:nth-child(2) { transform: translate(-50%,-50%) scale(0.405); }
    .approach-ring:nth-child(3) { transform: translate(-50%,-50%) scale(0.2); }
    .approach-ring:nth-child(4) { transform: translate(-50%,-50%) scale(0.1); }
    .approach-ring:nth-child(5) { transform: translate(-50%,-50%) scale(0.05); }
    .zeno-carril { transform: translateX(min(50px, 6vmin)); }
    .unreachable-memory { opacity:0.9; transform:none; }
    .paradox-inscription { opacity:0.95; transform: translateX(-50%); }
    .paradox-control { opacity:0.85; }
    .hint { opacity:0.85; }
    .hint.oculto { opacity:0; }
  }
</style>

<script>
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const campo = document.getElementById('campo');

  /* Las variables del sonido van arriba */
  let started = false, ctx, master, sala;

  /* ---------------- Partículas, fragmentos del pasado y memorias ---------------- */
  if (!reduce) {
    for (let i = 0; i < 8; i++) {
      const p = document.createElement('div');
      p.className = 'asymptotic-particle';
      p.style.animationDelay = (-Math.random() * 8).toFixed(2) + 's';
      campo.appendChild(p);
    }
    for (let i = 0; i < 16; i++) {
      const f = document.createElement('div');
      f.className = 'frag';
      f.style.setProperty('--a', (Math.random() * 360).toFixed(1) + 'deg');
      f.style.animationDelay = (-Math.random() * 3.5).toFixed(2) + 's';
      f.addEventListener('animationiteration', () => f.style.setProperty('--a', (Math.random() * 360).toFixed(1) + 'deg'));
      campo.appendChild(f);
    }
    setInterval(() => {
      const m = document.createElement('div');
      m.className = 'memory-fragment';
      m.style.left = (Math.random() * 100) + '%';
      m.style.top = (Math.random() * 100) + '%';
      m.style.animationDelay = (Math.random() * 4).toFixed(2) + 's';
      campo.appendChild(m);
      setTimeout(() => m.remove(), 8000);
    }, 800);
  }

  /* ---------------- La inscripción alterna con la que aparecía al tocarla ---------------- */
  const frases = [
    'El pasado que siempre se acerca<br>pero nunca llega',
    'El pasado está siempre a mitad de camino<br>pero el camino se divide infinitamente'
  ];
  const frase = document.getElementById('frase');
  let fi = 0;
  frase.addEventListener('animationiteration', () => { fi = (fi + 1) % frases.length; frase.innerHTML = frases[fi]; });

  /* ---------------- Diseño sonoro: la pelota que rebota ---------------------------------------
     Una pelota que rebota pierde en cada golpe una fracción fija de su velocidad: cada salto
     dura una fracción del anterior y cada golpe suena más suave. La suma de los saltos es
     finita, y sin embargo son infinitos: en la teoría de sistemas se llama comportamiento de
     Zenón, y la pelota que rebota es su ejemplo clásico. Aquí, golpes de madera que se apuran
     hacia un final que nunca llega a oírse: se apagan antes del límite. Después, silencio, y
     otra aproximación empieza desde otro lado. Debajo, un Sol grave con su quinta, lejano.
     Al tocar, nace una serie nueva del lado donde tocaste.
  ------------------------------------------------------------------------------------------- */
  const MADERAS = [523.25, 587.33, 659.25, 783.99, 880.0];
  function makeReverbIR(ac, seconds = 4.5, decay = 2.5) {
    const len = Math.floor(ac.sampleRate * seconds);
    const buf = ac.createBuffer(2, len, ac.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    }
    return buf;
  }
  let ruido;
  function golpe(t, f, v, p) {
    // La madera: un tono breve con su cuerpo grave y el chasquido del contacto
    [[f, v], [f * 2.76, v * 0.3], [f * 0.5, v * 0.35]].forEach(([fr, nv], i) => {
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = fr;
      const a = ctx.createGain(); a.gain.value = 0;
      o.connect(a); a.connect(p);
      a.gain.setValueAtTime(0, t);
      a.gain.linearRampToValueAtTime(nv, t + 0.002);
      a.gain.exponentialRampToValueAtTime(0.0001, t + (i === 2 ? 0.12 : 0.07));
      o.start(t); o.stop(t + 0.14);
    });
    const s = ctx.createBufferSource(); s.buffer = ruido;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 3200; bp.Q.value = 2;
    const a = ctx.createGain(); a.gain.value = 0;
    s.connect(bp); bp.connect(a); a.connect(p);
    a.gain.setValueAtTime(v * 1.2, t); a.gain.exponentialRampToValueAtTime(0.0001, t + 0.012);
    s.start(t); s.stop(t + 0.02);
  }
  function serie(t0, pan) {
    const f = MADERAS[Math.floor(Math.random() * MADERAS.length)];
    const p = ctx.createStereoPanner(); p.pan.value = pan;
    p.connect(master); p.connect(sala);
    const e = 0.8;                         // cada salto dura el 80 % del anterior
    let t = t0, T = 1.25, n = 0;
    while (n < 16) {
      const v = 0.11 * Math.pow(e, 1.15 * n);
      if (v < 0.0035) break;               // se apaga antes del límite
      golpe(t, f, v, p);
      p.pan.setValueAtTime(pan * Math.pow(0.9, n), t);
      t += T; T *= e; n++;
    }
    setTimeout(() => p.disconnect(), (t - ctx.currentTime + 1) * 1000);
    return t;                              // cuándo se apagó la serie
  }
  function ciclo(desde) {
    if (!started) return;
    const fin = serie(desde, (Math.random() * 2 - 1) * 0.75);
    const siguiente = fin + 2.5 + Math.random() * 2.5;
    setTimeout(() => ciclo(siguiente), Math.max(0, (siguiente - ctx.currentTime - 0.5) * 1000));
  }
  function startAudio() {
    if (started) return;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 3; comp.attack.value = 0.005; comp.release.value = 0.3;
    comp.connect(ctx.destination);
    master = ctx.createGain(); master.gain.value = 0; master.connect(comp);
    master.gain.linearRampToValueAtTime(0.6, ctx.currentTime + 6);
    sala = ctx.createGain(); sala.gain.value = 0.4;
    const conv = ctx.createConvolver(); conv.buffer = makeReverbIR(ctx);
    sala.connect(conv); conv.connect(master);
    ruido = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.05), ctx.sampleRate);
    const d = ruido.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;

    // El horizonte: un Sol grave con su quinta, que respira lejos
    const fondo = ctx.createGain(); fondo.gain.value = 0.015;
    const resp = ctx.createOscillator(); resp.frequency.value = 1 / 16;
    const respG = ctx.createGain(); respG.gain.value = 0.005;
    resp.connect(respG); respG.connect(fondo.gain); resp.start();
    [[98.0, 1], [146.83, 0.55], [196.0, 0.2]].forEach(([f, v]) => {
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f;
      const a = ctx.createGain(); a.gain.value = v;
      o.connect(a); a.connect(fondo); o.start();
    });
    fondo.connect(master); fondo.connect(sala);

    started = true;
    setTimeout(() => ciclo(ctx.currentTime + 0.2), 4500);
  }

  function acercamiento(x, y) {
    if (reduce) return;
    const r = document.createElement('div');
    r.className = 'acercamiento';
    r.style.left = x + 'px'; r.style.top = y + 'px';
    document.body.appendChild(r);
    setTimeout(() => r.remove(), 2700);
  }

  const hint = document.getElementById('hint');
  window.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.infinito')) return;
    startAudio();
    if (hint) hint.classList.add('oculto');
    const pan = Math.max(-0.85, Math.min(0.85, (e.clientX / innerWidth) * 1.7 - 0.85));
    serie(ctx.currentTime + 0.02, pan);
    acercamiento(e.clientX, e.clientY);
  });
</script>
