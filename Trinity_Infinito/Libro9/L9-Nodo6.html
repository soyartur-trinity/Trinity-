<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
<meta name="temporal-state" content="instant_eternity">
<meta name="philosophical-concept" content="nunc_stans">
<title>Nodo 62: La Eternidad Instantánea</title>
<!-- Portal 62. Saneado en noviembre de 2026 sobre el original: el destello eterno en el centro,
     la rueda de Boecio con su punto que la recorre, los treinta puntos de la circunferencia y
     el lazo del infinito (que estaba corrido por un error de centrado). Frases, paradoja,
     paleta y símbolo del original; sonido nuevo (tota simul). -->
<style>
  * { margin:0; padding:0; box-sizing:border-box;
      -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; }

  html, body { height:100%; }
  body {
    background: linear-gradient(to bottom, #000, #0a0012, #000);
    background-color:#000;
    overflow:hidden;
    display:flex; justify-content:center; align-items:center;
    height:100vh; height:100dvh;
    font-family:'Georgia', serif;
    cursor:none;
    -webkit-tap-highlight-color: transparent;
  }

  .instant-eternity {
    position:relative;
    width:min(800px, 95vw);
    height:min(800px, 86vh);
  }

  .eternity-field {
    position:absolute; inset:0;
    background:
      radial-gradient(circle at 30% 30%, rgba(147,51,234,0.06) 0%, transparent 50%),
      radial-gradient(circle at 70% 70%, rgba(59,130,246,0.06) 0%, transparent 50%);
    animation: fieldBreath 12s infinite alternate;
    pointer-events:none;
  }
  @keyframes fieldBreath { 0% { opacity:0.3; } 100% { opacity:0.7; } }

  /* La dilatación del tiempo: un aura redonda que gira lento */
  .time-dilation {
    position:absolute; top:50%; left:50%;
    width:min(920px, 118vmin); height:min(920px, 118vmin);
    border-radius:50%;
    background: conic-gradient(from 0deg at 50% 50%,
      transparent 0deg, rgba(147,51,234,0.05) 90deg, transparent 180deg, rgba(59,130,246,0.05) 270deg, transparent 360deg);
    -webkit-mask: radial-gradient(circle closest-side, #000 40%, transparent 100%);
            mask: radial-gradient(circle closest-side, #000 40%, transparent 100%);
    transform: translate(-50%,-50%);
    animation: dilationSpin 40s infinite linear;
    pointer-events:none;
  }
  @keyframes dilationSpin {
    from { transform: translate(-50%,-50%) rotate(0deg); }
    to   { transform: translate(-50%,-50%) rotate(360deg); }
  }

  canvas.anillos { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }

  /* La rueda de Boecio: el tiempo es a la eternidad lo que el círculo a su centro */
  .boethius-wheel {
    position:absolute; top:50%; left:50%;
    width:min(400px, 50vmin); height:min(400px, 50vmin);
    border:1px dotted rgba(59,130,246,0.3);
    border-radius:50%;
    transform: translate(-50%,-50%);
    animation: wheelTurn 30s infinite linear;
    will-change: transform;
    pointer-events:none;
  }
  .boethius-wheel::before {
    content:''; position:absolute; top:0; left:50%;
    width:clamp(7px, 1.3vmin, 10px); height:clamp(7px, 1.3vmin, 10px);
    border-radius:50%;
    background: rgba(215,185,255,1);
    box-shadow: 0 0 10px rgba(170,110,245,0.9), 0 0 22px rgba(147,51,234,0.6);
    transform: translate(-50%,-50%);
  }
  @keyframes wheelTurn {
    from { transform: translate(-50%,-50%) rotate(0deg); }
    to   { transform: translate(-50%,-50%) rotate(360deg); }
  }

  /* Los treinta puntos de la circunferencia */
  .q-pos {
    --R: min(200px, 25vmin);
    position:absolute; top:50%; left:50%;
    width:0; height:0;
    pointer-events:none;
  }
  .quantum-eternity {
    position:absolute;
    width:clamp(3px, 0.65vmin, 5px); height:clamp(3px, 0.65vmin, 5px);
    margin:calc(clamp(3px, 0.65vmin, 5px) / -2) 0 0 calc(clamp(3px, 0.65vmin, 5px) / -2);
    border-radius:50%;
    background: rgba(255,255,255,0.9);
    opacity:0;
    animation: quantumEternal 3s infinite;
  }
  .quantum-eternity.nota { background: rgba(225,200,255,1); box-shadow: 0 0 6px rgba(170,110,245,0.8); }
  @keyframes quantumEternal {
    0%,100% { transform: scale(1); opacity:0; }
    5%,95%  { opacity:1; }
    50%     { transform: scale(0); opacity:1; }
  }
  .brillo {
    position:absolute;
    width:clamp(16px, 3vmin, 24px); height:clamp(16px, 3vmin, 24px);
    margin:calc(clamp(16px, 3vmin, 24px) / -2) 0 0 calc(clamp(16px, 3vmin, 24px) / -2);
    border-radius:50%;
    background: radial-gradient(circle, rgba(235,215,255,0.95) 0%, rgba(170,110,245,0.5) 35%, transparent 70%);
    opacity:0;
  }
  .brillo.suena { animation: suena 2.8s ease-out; }
  @keyframes suena {
    0%   { transform: scale(0.4); opacity:0; }
    8%   { transform: scale(1.2); opacity:1; }
    100% { transform: scale(0.8); opacity:0; }
  }

  /* El lazo del infinito, ahora centrado */
  .infinity-moment {
    position:absolute; top:50%; left:50%;
    width:min(300px, 38vmin); height:min(150px, 19vmin);
    transform: translate(-50%,-50%);
    pointer-events:none;
  }
  .infinity-loop {
    position:absolute; inset:0;
    border:2px solid rgba(147,51,234,0.42);
    border-radius:50% 0 50% 0;
    animation: infinityRotate 10s infinite linear;
    will-change: transform;
  }
  .infinity-loop::before {
    content:''; position:absolute; inset:0;
    border:2px solid rgba(59,130,246,0.42);
    border-radius:0 50% 0 50%;
    transform: rotate(90deg);
  }
  @keyframes infinityRotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  .instant-compression {
    position:absolute; top:50%; left:50%;
    width:2px; height:2px;
    border-radius:50%;
    background: rgba(255,255,255,0.8);
    transform: translate(-50%,-50%) scale(1);
    opacity:0;
    animation: compressExpand 5s infinite;
    pointer-events:none;
  }
  @keyframes compressExpand {
    0%,100% { transform: translate(-50%,-50%) scale(1);  opacity:0; }
    50%     { transform: translate(-50%,-50%) scale(50); opacity:0.1; }
  }

  /* Nunc stans: el ahora que permanece; su brillo en una capa que respira */
  .nunc-stans {
    position:absolute; top:50%; left:50%;
    width:min(100px, 13vmin); height:min(100px, 13vmin);
    border:1px solid rgba(147,51,234,0.55);
    border-radius:50%;
    transform: translate(-50%,-50%);
    pointer-events:none;
  }
  .nunc-stans::after {
    content:''; position:absolute; inset:-1px;
    border-radius:50%;
    box-shadow: 0 0 70px rgba(147,51,234,0.85), 0 0 24px rgba(147,51,234,0.6);
    opacity:0.25;
    animation: standingNow 8s infinite ease-in-out;
  }
  @keyframes standingNow { 0%,100% { opacity:0.25; } 50% { opacity:1; } }

  .eternal-flash {
    position:absolute; top:50%; left:50%;
    width:min(20px, 2.8vmin); height:min(20px, 2.8vmin);
    border-radius:50%;
    background: radial-gradient(circle, #fff 0%, rgba(147,51,234,0.9) 20%, rgba(59,130,246,0.6) 40%, rgba(6,182,212,0.3) 60%, transparent 100%);
    transform: translate(-50%,-50%) scale(0);
    animation: flashEternal 4s infinite;
    will-change: transform, opacity;
    pointer-events:none;
    z-index:10;
  }
  @keyframes flashEternal {
    0%,100% { transform: translate(-50%,-50%) scale(0);  opacity:0; }
    10%     { transform: translate(-50%,-50%) scale(1);  opacity:1; }
    50%     { transform: translate(-50%,-50%) scale(20); opacity:0.1; }
    90%     { transform: translate(-50%,-50%) scale(1);  opacity:1; }
  }
  /* Tota simul: el destello del centro cuando reúne todas las notas */
  .reunion {
    position:absolute; top:50%; left:50%;
    width:min(40px, 5.5vmin); height:min(40px, 5.5vmin);
    border-radius:50%;
    background: radial-gradient(circle, rgba(255,250,240,1) 0%, rgba(210,180,255,0.7) 35%, transparent 70%);
    transform: translate(-50%,-50%) scale(1);
    opacity:0;
    pointer-events:none;
    z-index:11;
  }
  .reunion.vivo { animation: reunion 4s ease-out; }
  @keyframes reunion {
    0%   { transform: translate(-50%,-50%) scale(1);  opacity:0; }
    10%  { transform: translate(-50%,-50%) scale(3);  opacity:1; }
    100% { transform: translate(-50%,-50%) scale(10); opacity:0; }
  }

  .infinity-point {
    position:absolute;
    width:clamp(5px, 0.8vmin, 6px); height:clamp(5px, 0.8vmin, 6px);
    border-radius:50%;
    background: rgba(147,51,234,0.75);
    animation: infinityPulse 4s infinite;
    pointer-events:none;
  }
  .infinity-point::after {
    content:''; position:absolute; inset:-3px;
    border-radius:50%; border:1px solid rgba(147,51,234,0.45);
    animation: puntoHalo 4s infinite;
    animation-delay:inherit;
  }
  @keyframes infinityPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.3); } }
  @keyframes puntoHalo { 0% { transform: scale(0.6); opacity:0.8; } 60%,100% { transform: scale(2.4); opacity:0; } }

  .eternity-spark {
    position:absolute;
    width:3px; height:3px;
    border-radius:50%;
    background: rgba(255,255,255,0.9);
    opacity:0;
    animation: sparkFlash 2s infinite;
    pointer-events:none;
  }
  @keyframes sparkFlash {
    0%,100% { opacity:0; transform: scale(1); }
    50%     { opacity:1; transform: scale(1.5); }
  }

  /* Las palabras eternas */
  .eternal-text {
    position:absolute;
    width:max-content;
    color: rgba(180,130,245,0.92);
    font-size: clamp(13px, 3.5vw, 15px);
    font-style:italic;
    letter-spacing:1px;
    text-shadow: 0 0 10px rgba(147,51,234,0.45);
    opacity:0;
    transform: translateX(var(--tx, 0)) scale(0.85);
    animation: textEternal 14s infinite ease-in-out;
    will-change: transform, opacity;
    pointer-events:none;
    z-index:20;
  }
  .x1 { top:19%;    left:50%;  --tx:-50%; animation-delay:0s; }
  .x2 { top:50%;    right:12%; animation-delay:3.5s; }
  .x3 { bottom:21%; left:50%;  --tx:-50%; animation-delay:7s; }
  .x4 { top:50%;    left:12%;  animation-delay:10.5s; }
  @keyframes textEternal {
    0%       { opacity:0;    transform: translateX(var(--tx, 0)) scale(0.85); }
    14%      { opacity:0.92; transform: translateX(var(--tx, 0)) scale(1); }
    80%      { opacity:0.92; transform: translateX(var(--tx, 0)) scale(1); }
    92%,100% { opacity:0;    transform: translateX(var(--tx, 0)) scale(0.92); }
  }

  .eternity-control {
    position:absolute; top:4%; left:50%;
    width:max-content; max-width:86vw;
    text-align:center;
    color: rgba(110,160,250,0.85);
    font-size: clamp(10px, 2.8vw, 12px);
    letter-spacing:2px;
    transform: translateX(-50%);
    animation: controlGlow 6s infinite;
    z-index:20;
  }
  @keyframes controlGlow { 0%,100% { opacity:0.6; } 50% { opacity:1; } }

  .paradox-inscription {
    position:absolute; bottom:6%; left:50%;
    width:88%;
    color: rgba(120,165,250,0.95);
    font-size: clamp(16px, 4.4vw, 20px);
    font-style:italic;
    text-align:center; line-height:1.5;
    text-shadow: 0 0 15px rgba(59,130,246,0.4);
    opacity:0;
    transform: translateX(-50%) scale(0.96);
    animation: inscriptionPulse 16s infinite ease-in-out;
    will-change: opacity, transform;
    z-index:20;
  }
  .paradox-inscription .autor { display:block; margin-top:0.3em; font-size:0.72em; letter-spacing:2px; font-style:normal; opacity:0.8; }
  @keyframes inscriptionPulse {
    0%       { opacity:0;    transform: translateX(-50%) scale(0.96); }
    12%      { opacity:0.95; transform: translateX(-50%) scale(1); }
    80%      { opacity:0.95; transform: translateX(-50%) scale(1.02); }
    92%,100% { opacity:0;    transform: translateX(-50%) scale(1.02); }
  }

  .transmission-code {
    position:fixed; left:50%;
    bottom:calc(env(safe-area-inset-bottom, 0px) + 14px);
    transform: translateX(-50%);
    color: rgba(147,51,234,0.45);
    font-family:'Courier New', monospace;
    font-size:10px; letter-spacing:2px; line-height:1.5;
    text-align:center; white-space:nowrap;
    animation: codeFlicker 5s infinite ease-in-out;
  }
  @keyframes codeFlicker { 0%,100% { opacity:0.3; } 50% { opacity:0.7; } }

  .hint {
    position:fixed; left:50%;
    bottom:calc(env(safe-area-inset-bottom, 0px) + 50px);
    transform: translateX(-50%);
    width:max-content; max-width:88vw; text-align:center;
    font-size: clamp(12px, 3.2vw, 14px);
    letter-spacing:1px;
    color: rgba(240,232,255,0.88);
    animation: invita 3.4s infinite ease-in-out;
    pointer-events:none;
    transition: opacity 1.4s ease;
    z-index:30;
  }
  .hint.oculto { animation:none; opacity:0; }
  @keyframes invita { 0%,100% { opacity:0.45; } 50% { opacity:0.95; } }

  .infinito {
    position:fixed;
    bottom:calc(env(safe-area-inset-bottom, 0px) + 14px); right:22px;
    font-size:30px; text-decoration:none;
    color: rgba(190,160,245,0.4);
    transition: color 0.8s ease, text-shadow 0.8s ease;
    z-index:31;
    cursor:pointer;
  }
  .infinito:hover, .infinito:focus-visible { color: rgba(230,210,255,0.95); text-shadow: 0 0 18px rgba(147,51,234,0.6); outline:none; }

  @media (max-width: 480px) {
    .x2 { right:6%; top:43%; }
    .x4 { left:6%;  top:55%; }
    .transmission-code { font-size:7px; letter-spacing:0.3px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation:none !important; }
    .quantum-eternity { opacity:0.8; }
    .eternal-flash { transform: translate(-50%,-50%) scale(1); opacity:1; }
    .nunc-stans::after { opacity:0.6; }
    .eternal-text { opacity:0.9; transform: translateX(var(--tx, 0)); }
    .paradox-inscription { opacity:0.95; transform: translateX(-50%); }
    .eternity-control { opacity:0.85; }
    .hint { opacity:0.85; }
    .hint.oculto { opacity:0; }
  }
</style>
</head>
<body>
  <div class="instant-eternity" id="campo">
    <div class="eternity-field"></div>
    <div class="time-dilation"></div>
    <canvas class="anillos" id="anillos"></canvas>

    <div class="boethius-wheel" id="rueda"></div>
    <div class="infinity-moment"><div class="infinity-loop"></div></div>

    <div class="instant-compression"></div>
    <div class="nunc-stans"></div>
    <div class="eternal-flash"></div>
    <div class="reunion" id="reunion"></div>

    <div class="infinity-point" style="top:30%; left:30%;"></div>
    <div class="infinity-point" style="top:30%; right:30%; animation-delay:1s;"></div>
    <div class="infinity-point" style="bottom:30%; left:30%; animation-delay:2s;"></div>
    <div class="infinity-point" style="bottom:30%; right:30%; animation-delay:3s;"></div>

    <div class="eternity-control">NUNC STANS ACTIVO</div>

    <div class="eternal-text x1">NUNC STANS</div>
    <div class="eternal-text x2">AHORA ETERNO</div>
    <div class="eternal-text x3">INSTANTE INFINITO</div>
    <div class="eternal-text x4">ETERNIDAD YA</div>

    <div class="paradox-inscription" id="frase">Toda la eternidad<br>en un solo instante</div>
  </div>

  <div class="transmission-code">LIBRO_9::NODO_6::ETERNIDAD_INSTANTÁNEA::ACTIVO<br>NUNC_STANS::COMPRESIÓN_TEMPORAL::INFINITO</div>
  <div class="hint" id="hint">( toca: comprime la eternidad )</div>

  <a class="infinito" href="L9-Nodo7.html" aria-label="Siguiente portal">∞</a>

<script>
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const campo = document.getElementById('campo');
  const rueda = document.getElementById('rueda');
  const reunion = document.getElementById('reunion');
  const lienzo = document.getElementById('anillos');
  const g = lienzo.getContext('2d');
  let W = 0, H = 0;

  /* Las variables del sonido van arriba */
  let started = false, ctx, master, sala, ultimo = -1;

  /* ---------------- Los treinta puntos: uno de cada tres es una nota ---------------- */
  const brillos = [];
  for (let i = 0; i < 30; i++) {
    const pos = document.createElement('div');
    pos.className = 'q-pos';
    pos.style.transform = `rotate(${i * 12}deg) translateY(calc(-1 * var(--R)))`;
    const q = document.createElement('div');
    q.className = 'quantum-eternity' + (i % 3 === 0 ? ' nota' : '');
    q.style.animationDelay = (i * 0.1).toFixed(1) + 's';
    pos.appendChild(q);
    if (i % 3 === 0) { const b = document.createElement('div'); b.className = 'brillo'; pos.appendChild(b); brillos.push(b); }
    campo.insertBefore(pos, rueda);
  }
  function brillar(k) {
    if (reduce) return;
    const b = brillos[k]; b.classList.remove('suena'); void b.offsetWidth; b.classList.add('suena');
  }
  function reunir() {
    if (reduce) return;
    reunion.classList.remove('vivo'); void reunion.offsetWidth; reunion.classList.add('vivo');
    brillos.forEach((b, k) => brillar(k));
    anillo(true);
  }

  /* ---------------- Anillos sin tiempo (lienzo): se cierran sobre el centro y vuelven ---------------- */
  const anillos = [];
  function anillo(fuerte) {
    anillos.push({ nace: performance.now() + (fuerte ? 0 : Math.random() * 6000), dura: fuerte ? 4000 : 6000,
                   a: fuerte ? 0.8 : Math.random() * 0.5, fuerte });
  }
  function medir() {
    const r = campo.getBoundingClientRect(); W = r.width; H = r.height;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    lienzo.width = Math.round(W * dpr); lienzo.height = Math.round(H * dpr);
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  medir(); addEventListener('resize', medir);
  function dibujar(ahora) {
    g.clearRect(0, 0, W, H);
    const R = Math.min(300, 0.4 * Math.min(W, H));
    for (let i = anillos.length - 1; i >= 0; i--) {
      const o = anillos[i], v = (ahora - o.nace) / o.dura;
      if (v >= 1) { anillos.splice(i, 1); continue; }
      if (v < 0) continue;
      // el original: de grande a casi nada y de vuelta; el del toque solo se abre desde el centro
      const r = o.fuerte ? 5 + R * v : 5 + (R - 5) * Math.abs(1 - 2 * v);
      const al = o.fuerte ? o.a * (1 - v) : o.a * (1 - Math.abs(1 - 2 * v));
      g.beginPath(); g.arc(W / 2, H / 2, r, 0, Math.PI * 2);
      g.strokeStyle = 'rgba(' + (o.fuerte ? '215,185,255' : '147,51,234') + ',' + al.toFixed(3) + ')';
      g.lineWidth = 1; g.stroke();
    }
    requestAnimationFrame(dibujar);
  }

  if (!reduce) {
    setInterval(() => anillo(false), 1000);
    requestAnimationFrame(dibujar);
    setInterval(() => {
      const c = document.createElement('div');
      c.className = 'instant-compression';
      c.style.animationDelay = (Math.random() * 5).toFixed(2) + 's';
      campo.appendChild(c); setTimeout(() => c.remove(), 10000);
    }, 2000);
    setInterval(() => {
      const sp = document.createElement('div');
      sp.className = 'eternity-spark';
      sp.style.left = (Math.random() * 100) + '%'; sp.style.top = (Math.random() * 100) + '%';
      sp.style.animationDelay = (Math.random() * 2).toFixed(2) + 's';
      campo.appendChild(sp); setTimeout(() => sp.remove(), 4000);
    }, 300);
  }

  /* ---------------- La inscripción alterna con las que aparecían al tocar ---------------- */
  const frases = [
    'Toda la eternidad<br>en un solo instante',
    '∞ tiempo = 1 instante<br>0 duración = toda la eternidad',
    '«La eternidad es la posesión total, simultánea<br>y perfecta de una vida sin límites»<span class="autor">BOECIO</span>'
  ];
  const frase = document.getElementById('frase');
  let fi = 0;
  frase.addEventListener('animationiteration', () => { fi = (fi + 1) % frases.length; frase.innerHTML = frases[fi]; });

  /* ---------------- Diseño sonoro: tota simul ----------------------------------------------
     Boecio define la eternidad como «la posesión total, simultánea y perfecta de una vida sin
     límites» (tota simul), y la compara con el centro de un círculo: el tiempo recorre la
     circunferencia punto por punto; el centro está a la misma distancia de todos a la vez.
     La luz de la rueda tarda treinta segundos en dar la vuelta. Al pasar por cada punto
     marcado despierta una nota: diez notas de una escala pentatónica de Re, cada una del lado
     del círculo donde está. Esa melodía es el tiempo. Cuando la luz vuelve a lo alto, el centro
     las suena todas juntas, sobre un Re grave: la vida entera en un instante.
     Al tocar, el centro las reúne en ese momento.
  ------------------------------------------------------------------------------------------- */
  const PASO = 3000, VUELTA = 30000;
  const NOTAS = [587.33, 440.0, 493.88, 369.99, 329.63, 440.0, 587.33, 659.25, 493.88, 739.99];
  const t0 = performance.now();
  function reloj() {
    if (!reduce) {
      const a = rueda.getAnimations()[0];
      if (a && a.currentTime !== null) return a.currentTime;
    }
    return performance.now() - t0;
  }
  function makeReverbIR(ac, seconds = 5.5, decay = 2.3) {
    const len = Math.floor(ac.sampleRate * seconds);
    const buf = ac.createBuffer(2, len, ac.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    }
    return buf;
  }
  function campana(f, t, nivel, pan, dura) {
    const p = ctx.createStereoPanner(); p.pan.value = pan;
    p.connect(master); p.connect(sala);
    [[1, 1], [2, 0.22], [2.76, 0.08], [3, 0.05]].forEach(([h, v]) => {
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f * h;
      const a = ctx.createGain(); a.gain.value = 0;
      o.connect(a); a.connect(p);
      a.gain.setValueAtTime(0, t);
      a.gain.linearRampToValueAtTime(nivel * v, t + 0.006);
      a.gain.exponentialRampToValueAtTime(0.0002, t + dura / h);
      o.start(t); o.stop(t + dura / h + 0.05);
    });
  }
  function todas(t) {                     // tota simul: las diez notas desde el centro, sobre un Re grave
    NOTAS.forEach((f) => campana(f, t, 0.022, 0, 8));
    campana(146.83, t, 0.05, 0, 9);
    campana(73.42, t, 0.04, 0, 9);
  }
  function programar() {
    if (!started) return;
    const ms = reloj(), ahora = ctx.currentTime;
    const m0 = Math.floor(ms / PASO);
    for (let m = Math.max(ultimo + 1, m0 + 1); m <= m0 + 1; m++) {
      const t = ahora + (m * PASO - ms) / 1000;
      const k = m % 10;
      const espera = Math.max(0, (t - ahora) * 1000);
      if (k === 0) { todas(t); setTimeout(reunir, espera); }
      else {
        campana(NOTAS[k], t, 0.06, Math.sin(k * 36 * Math.PI / 180) * 0.75, 3.2);
        setTimeout(() => brillar(k), espera);
      }
      ultimo = m;
    }
  }
  function startAudio() {
    if (started) return;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 3; comp.attack.value = 0.01; comp.release.value = 0.4;
    comp.connect(ctx.destination);
    master = ctx.createGain(); master.gain.value = 0; master.connect(comp);
    master.gain.linearRampToValueAtTime(0.55, ctx.currentTime + 6);
    sala = ctx.createGain(); sala.gain.value = 0.38;
    const conv = ctx.createConvolver(); conv.buffer = makeReverbIR(ctx);
    sala.connect(conv); conv.connect(master);
    // El centro: un Re muy grave que apenas se oye, siempre presente
    const fondo = ctx.createGain(); fondo.gain.value = 0.012;
    [[73.42, 1], [110, 0.4]].forEach(([f, v]) => {
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f;
      const a = ctx.createGain(); a.gain.value = v;
      o.connect(a); a.connect(fondo); o.start();
    });
    fondo.connect(master);
    started = true;
    ultimo = Math.floor(reloj() / PASO);
    setInterval(programar, 100);
  }

  const hint = document.getElementById('hint');
  window.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.infinito')) return;
    startAudio();
    if (hint) hint.classList.add('oculto');
    todas(ctx.currentTime + 0.02);
    reunir();
  });
</script>
