<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
<title>Portal 57 · El Instante Eterno — Trinity Infinito</title>
<!-- Portal 57. Saneado en noviembre de 2026 sobre el original: el punto del ahora, la línea de
     Kronos, el estallido de Kairós y el círculo de Aión. Frases, paradoja, paleta y símbolo
     del original; sonido nuevo (cronostasis, la ilusión del reloj detenido). -->
<style>
  * { margin:0; padding:0; box-sizing:border-box;
      -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; }

  html, body { height:100%; }
  body {
    background:#000;
    overflow:hidden;
    display:flex; justify-content:center; align-items:center;
    height:100vh; height:100dvh;
    font-family:'Georgia', serif;
    cursor:none;
    -webkit-tap-highlight-color: transparent;
  }

  .eternal-instant {
    position:relative;
    width:min(800px, 95vw);
    height:min(800px, 86vh);
  }

  /* Resonancia Trinity */
  .trinity-resonance {
    position:absolute; top:50%; left:50%;
    width:130%; height:130%;
    background:
      radial-gradient(circle at 30% 30%, rgba(147,51,234,0.05) 0%, transparent 50%),
      radial-gradient(circle at 70% 70%, rgba(59,130,246,0.05) 0%, transparent 50%),
      radial-gradient(circle at 50% 50%, rgba(34,197,94,0.025) 0%, transparent 50%);
    transform: translate(-50%,-50%);
    animation: resonancePulse 30s infinite alternate ease-in-out;
    pointer-events:none;
  }
  @keyframes resonancePulse {
    0%   { opacity:0.2; transform: translate(-50%,-50%) scale(1); }
    100% { opacity:0.6; transform: translate(-50%,-50%) scale(1.1); }
  }

  /* Anillos del tiempo y líneas temporales (lienzo) */
  canvas.tiempo { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }

  /* Aión: el círculo que gira sobre sí mismo */
  .eternal-layer {
    position:absolute; inset:0;
    animation: eternalRotate 80s infinite linear;
    will-change: transform;
    pointer-events:none;
  }
  @keyframes eternalRotate {
    from { transform: rotate(0deg)   scale(1); }
    50%  { transform: rotate(180deg) scale(1.05); }
    to   { transform: rotate(360deg) scale(1); }
  }
  .aion-circle {
    position:absolute; top:50%; left:50%;
    width:min(400px, 50vmin); height:min(400px, 50vmin);
    border:2px dotted rgba(147,51,234,0.38);
    border-radius:50%;
    transform: translate(-50%,-50%);
    animation: aionRotate 40s infinite linear reverse;
    will-change: transform;
  }
  @keyframes aionRotate {
    from { transform: translate(-50%,-50%) rotate(0deg)   scale(1); }
    50%  { transform: translate(-50%,-50%) rotate(180deg) scale(1.1); }
    to   { transform: translate(-50%,-50%) rotate(360deg) scale(1); }
  }

  /* Kairós: el estallido del momento oportuno */
  .kairos-burst {
    position:absolute; top:50%; left:50%;
    width:min(200px, 26vmin); height:min(200px, 26vmin);
    border-radius:50%;
    background: radial-gradient(circle, transparent 25%, rgba(147,51,234,0.16), rgba(59,130,246,0.11), transparent 75%);
    transform: translate(-50%,-50%) scale(0);
    animation: kairosPulse 6s infinite ease-in-out;
    will-change: transform, opacity;
    pointer-events:none;
  }
  @keyframes kairosPulse {
    0%,100% { transform: translate(-50%,-50%) scale(0);   opacity:0; }
    30%,70% { transform: translate(-50%,-50%) scale(1.2); opacity:0.8; }
    50%     { transform: translate(-50%,-50%) scale(1);   opacity:1; }
  }
  .kairos-flash {
    position:absolute; top:50%; left:50%;
    width:min(200px, 26vmin); height:min(200px, 26vmin);
    border-radius:50%;
    background: radial-gradient(circle, rgba(255,245,235,0.55) 0%, rgba(170,110,245,0.32) 30%, rgba(59,130,246,0.14) 55%, transparent 72%);
    transform: translate(-50%,-50%) scale(0.2);
    opacity:0;
    pointer-events:none;
  }
  .kairos-flash.vivo { animation: kairosAbre 4.6s ease-out; }
  @keyframes kairosAbre {
    0%   { transform: translate(-50%,-50%) scale(0.2); opacity:0; }
    8%   { transform: translate(-50%,-50%) scale(1.3); opacity:1; }
    70%  { transform: translate(-50%,-50%) scale(1.7); opacity:0.75; }
    100% { transform: translate(-50%,-50%) scale(2.6); opacity:0; }
  }

  /* Kronos: la línea que pasa (se detiene durante Kairós) */
  .kronos-line {
    position:absolute; top:50%; left:0;
    width:100%; height:1px;
    background: linear-gradient(90deg, transparent, rgba(59,130,246,0.45), rgba(147,51,234,0.7), rgba(59,130,246,0.45), transparent);
    animation: kronosFlow 12s infinite linear;
    will-change: transform;
    pointer-events:none;
  }
  .kronos-line.detenido { animation-play-state: paused; }
  @keyframes kronosFlow {
    0%   { transform: translateX(-100%); opacity:0.8; }
    50%  { transform: translateX(0%);    opacity:1; }
    100% { transform: translateX(100%);  opacity:0.8; }
  }

  /* El punto del ahora y su resplandor (en capa aparte: el brillo respira por opacidad) */
  .now-glow {
    position:absolute; top:50%; left:50%;
    width:min(260px, 36vmin); height:min(260px, 36vmin);
    border-radius:50%;
    background: radial-gradient(circle,
      rgba(147,51,234,0.4) 0%, rgba(147,51,234,0.2) 18%, rgba(59,130,246,0.12) 35%, rgba(6,182,212,0.05) 52%, transparent 68%);
    transform: translate(-50%,-50%) scale(1);
    animation: glowBreath 4s infinite ease-in-out;
    will-change: transform, opacity;
    pointer-events:none;
  }
  @keyframes glowBreath {
    0%,100% { transform: translate(-50%,-50%) scale(0.85); opacity:0.7; }
    66%     { transform: translate(-50%,-50%) scale(1.15); opacity:1; }
  }
  .now-point {
    position:absolute; top:50%; left:50%;
    width:clamp(7px, 1.4vmin, 10px); height:clamp(7px, 1.4vmin, 10px);
    border-radius:50%;
    background: radial-gradient(circle, #fff 0%, rgba(255,245,235,0.95) 20%, rgba(147,51,234,0.9) 40%, rgba(59,130,246,0.7) 60%, transparent 100%);
    box-shadow: 0 0 18px rgba(147,51,234,0.9), 0 0 40px rgba(59,130,246,0.6);
    transform: translate(-50%,-50%);
    animation: nowPulse 4s infinite ease-in-out;
    will-change: transform, opacity;
    z-index:15;
  }
  @keyframes nowPulse {
    0%,100% { transform: translate(-50%,-50%) scale(1);   opacity:1; }
    33%     { transform: translate(-50%,-50%) scale(1.3); opacity:0.9; }
    66%     { transform: translate(-50%,-50%) scale(1.6); opacity:0.8; }
  }

  /* Momentos cuánticos */
  .quantum-moment {
    position:absolute;
    width:clamp(2px, 0.5vmin, 4px); height:clamp(2px, 0.5vmin, 4px);
    border-radius:50%;
    background: rgba(255,255,255,0.9);
    box-shadow: 0 0 4px rgba(255,255,255,0.6);
    opacity:0;
    animation: quantumBlink 3s infinite ease-in-out;
    will-change: transform, opacity;
    pointer-events:none;
  }
  @keyframes quantumBlink {
    0%,100% { opacity:0; transform: scale(0.5); }
    50%     { opacity:1; transform: scale(1.2); }
  }

  /* Fragmentos temporales: se leen en ronda, cada uno unos nueve segundos y medio */
  .temporal-fragment {
    position:absolute;
    width:max-content;
    color: rgba(175,120,245,0.9);
    font-size: clamp(12px, 3.3vw, 14px);
    letter-spacing:2px;
    text-shadow: 0 0 10px rgba(147,51,234,0.45);
    opacity:0;
    transform: translateY(14px) scale(0.9);
    animation: fragmentFloat 16s infinite ease-in-out;
    will-change: transform, opacity;
    pointer-events:none;
    z-index:20;
  }
  .t1 { top:25%;    left:16%;  animation-delay:0s; }
  .t2 { top:25%;    right:16%; animation-delay:2s; }
  .t3 { bottom:27%; right:16%; animation-delay:4s; }
  .t4 { bottom:27%; left:16%;  animation-delay:6s; }
  @keyframes fragmentFloat {
    0%       { opacity:0;   transform: translateY(14px) scale(0.9); }
    12%      { opacity:0.9; transform: translateY(0) scale(1); }
    72%      { opacity:0.9; transform: translateY(0) scale(1); }
    84%,100% { opacity:0;   transform: translateY(-8px) scale(0.95); }
  }

  /* El tiempo de Planck: es un dato, por eso va en monoespaciada */
  .planck-time {
    position:absolute; top:8%; left:50%;
    width:max-content;
    color: rgba(110,160,250,0.85);
    font-family:'Courier New', monospace;
    font-size: clamp(12px, 3.2vw, 14px);
    letter-spacing:2px;
    text-shadow: 0 0 10px rgba(59,130,246,0.35);
    transform: translateX(-50%);
    animation: planckFlicker 5s infinite ease-in-out;
    z-index:20;
  }
  @keyframes planckFlicker { 0%,100% { opacity:0.5; } 50% { opacity:0.95; } }

  /* La frase */
  .eternal-text {
    position:absolute; bottom:8%; left:50%;
    width:88%;
    color: rgba(190,150,245,0.95);
    font-size: clamp(16px, 4.4vw, 20px);
    font-style:italic;
    text-align:center; line-height:1.5;
    text-shadow: 0 0 20px rgba(147,51,234,0.45);
    opacity:0;
    transform: translateX(-50%) scale(0.95);
    animation: textEternal 16s infinite ease-in-out;
    will-change: opacity, transform;
    z-index:20;
  }
  @keyframes textEternal {
    0%       { opacity:0;    transform: translateX(-50%) scale(0.95); }
    12%      { opacity:0.95; transform: translateX(-50%) scale(1); }
    80%      { opacity:0.95; transform: translateX(-50%) scale(1.03); }
    92%,100% { opacity:0;    transform: translateX(-50%) scale(1.03); }
  }

  .transmission-code {
    position:fixed; left:50%;
    bottom:calc(env(safe-area-inset-bottom, 0px) + 18px);
    transform: translateX(-50%);
    color: rgba(147,51,234,0.45);
    font-family:'Courier New', monospace;
    font-size:10px; letter-spacing:2px;
    white-space:nowrap;
    animation: codeFlicker 5s infinite ease-in-out;
  }
  @keyframes codeFlicker { 0%,100% { opacity:0.3; } 50% { opacity:0.7; } }

  .hint {
    position:fixed; left:50%;
    bottom:calc(env(safe-area-inset-bottom, 0px) + 50px);
    transform: translateX(-50%);
    width:max-content; max-width:88vw; text-align:center;
    font-size: clamp(12px, 3.2vw, 14px);
    letter-spacing:1px;
    color: rgba(240,232,255,0.88);
    animation: invita 3.4s infinite ease-in-out;
    pointer-events:none;
    transition: opacity 1.4s ease;
    z-index:30;
  }
  .hint.oculto { animation:none; opacity:0; }
  @keyframes invita { 0%,100% { opacity:0.45; } 50% { opacity:0.95; } }

  .infinito {
    position:fixed;
    bottom:calc(env(safe-area-inset-bottom, 0px) + 14px); right:22px;
    font-size:30px; text-decoration:none;
    color: rgba(190,160,245,0.4);
    transition: color 0.8s ease, text-shadow 0.8s ease;
    z-index:31;
    cursor:pointer;
  }
  .infinito:hover, .infinito:focus-visible { color: rgba(230,210,255,0.95); text-shadow: 0 0 18px rgba(147,51,234,0.6); outline:none; }

  @media (max-width: 480px) {
    .t1, .t4 { left:7%; }
    .t2, .t3 { right:7%; }
    .transmission-code { font-size:7px; letter-spacing:0.3px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation:none !important; }
    .kairos-burst { transform: translate(-50%,-50%) scale(1); opacity:0.6; }
    .kronos-line { opacity:0.8; }
    .now-glow { opacity:0.85; }
    .temporal-fragment { opacity:0.9; transform:none; }
    .eternal-text { opacity:0.95; transform: translateX(-50%); }
    .planck-time { opacity:0.8; }
    .quantum-moment { opacity:0.55; }
    .hint { opacity:0.85; }
    .hint.oculto { opacity:0; }
  }
</style>
</head>
<body>
  <div class="eternal-instant" id="campo">
    <div class="trinity-resonance"></div>
    <canvas class="tiempo" id="tiempo"></canvas>
    <div class="eternal-layer"><div class="aion-circle"></div></div>

    <div class="kairos-burst"></div>
    <div class="kairos-flash" id="kairos"></div>
    <div class="kronos-line" id="kronos"></div>
    <div class="now-glow"></div>
    <div class="now-point"></div>

    <div class="temporal-fragment t1">AHORA</div>
    <div class="temporal-fragment t2">SIEMPRE</div>
    <div class="temporal-fragment t3">NUNCA</div>
    <div class="temporal-fragment t4">ETERNO</div>

    <div class="planck-time">t = 5.39 × 10⁻⁴⁴ s = ∞</div>

    <div class="eternal-text" id="frase">El instante contiene<br>toda la eternidad</div>
  </div>

  <div class="transmission-code">TRINITY::LIBRO_9::NODO_1::INSTANTE_ETERNO::RESONANDO</div>
  <div class="hint" id="hint">( toca: el instante se abre )</div>

  <a class="infinito" href="L9-Nodo2.html" aria-label="Siguiente portal">∞</a>

<script>
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const campo = document.getElementById('campo');
  const lienzo = document.getElementById('tiempo');
  const g = lienzo.getContext('2d');
  const kronos = document.getElementById('kronos');
  const kairos = document.getElementById('kairos');
  let W = 0, H = 0;

  /* Las variables del sonido van arriba: el resto del guion puede llamarlas */
  let started = false, ctx, master, sala, aionPan;
  let proximoTic = 0, ticN = 0, kairosHasta = 0, ultimoKairos = 0, pedidoKairos = false;

  function medir() {
    const r = campo.getBoundingClientRect(); W = r.width; H = r.height;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    lienzo.width = Math.round(W * dpr); lienzo.height = Math.round(H * dpr);
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (reduce) pistaQuieta();
  }
  addEventListener('resize', medir);

  /* ---------------- Anillos del tiempo y líneas temporales ---------------- */
  const COLORES = ['147,51,234', '59,130,246', '6,182,212', '34,197,94'];
  const anillos = [], lineas = [];
  function anillo(fuerte) {
    // Como en el original: cada anillo vive ocho segundos desde que se crea, aunque su expansión
    // dure más; por eso muchos se apagan a mitad de camino y el centro queda más poblado
    const ahora = performance.now();
    anillos.push({ nace: ahora + (fuerte ? 0 : Math.random() * 3000), muere: ahora + (fuerte ? 7000 : 8000),
                   dura: fuerte ? 7000 : 6000 + Math.random() * 4000,
                   c: fuerte ? '205,170,255' : COLORES[Math.floor(Math.random() * 4)], k: fuerte ? 2 : 1 });
  }
  function linea() {
    const a = Math.random() * Math.PI * 2, d = 0.2 + Math.random() * 0.4;
    lineas.push({ nace: performance.now() + Math.random() * 4000, dura: 8000, a, d });
  }
  function dibujar(ahora) {
    g.clearRect(0, 0, W, H);
    const m = Math.min(W, H), cx = W / 2, cy = H / 2;
    const r0 = 10, r1 = Math.min(350, 0.46 * m);
    for (let i = anillos.length - 1; i >= 0; i--) {
      const o = anillos[i], v = (ahora - o.nace) / o.dura;
      if (v >= 1 || ahora >= o.muere) { anillos.splice(i, 1); continue; }
      if (v < 0) continue;
      const e = 1 - Math.pow(1 - v, 2);                       // ease-out, como el original
      const al = (v < 0.8 ? 0.9 - 0.7 * (v / 0.8) : 0.2 * (1 - (v - 0.8) / 0.2)) * Math.min(1, (o.muere - ahora) / 400);
      g.beginPath(); g.arc(cx, cy, r0 + (r1 - r0) * e, 0, Math.PI * 2);
      g.strokeStyle = 'rgba(' + o.c + ',' + Math.min(1, al * 0.42 * o.k).toFixed(3) + ')';
      g.lineWidth = v < 0.8 ? 1 - 0.5 * (v / 0.8) : 0.5 - 0.3 * ((v - 0.8) / 0.2);
      g.stroke();
    }
    const largo = Math.min(500, 0.62 * m);
    for (let i = lineas.length - 1; i >= 0; i--) {
      const o = lineas[i], v = (ahora - o.nace) / o.dura;
      if (v >= 1) { lineas.splice(i, 1); continue; }
      if (v < 0) continue;
      const s = 0.5 - 0.5 * Math.cos(2 * Math.PI * v);          // crece y vuelve, como el original
      const x0 = cx + Math.cos(o.a) * o.d * W, y0 = cy + Math.sin(o.a) * o.d * H;
      const x1 = x0 + Math.cos(o.a) * largo * s, y1 = y0 + Math.sin(o.a) * largo * s;
      const gr = g.createLinearGradient(x0, y0, x1, y1);
      gr.addColorStop(0, 'rgba(147,51,234,0)');
      gr.addColorStop(0.5, 'rgba(147,51,234,' + (0.32 * s).toFixed(3) + ')');
      gr.addColorStop(1, 'rgba(147,51,234,0)');
      g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1);
      g.strokeStyle = gr; g.lineWidth = 1; g.stroke();
    }
    requestAnimationFrame(dibujar);
  }
  function pistaQuieta() {
    g.clearRect(0, 0, W, H);
    const m = Math.min(W, H);
    [0.08, 0.16, 0.27, 0.4].forEach((k, i) => {
      g.beginPath(); g.arc(W / 2, H / 2, k * m, 0, Math.PI * 2);
      g.strokeStyle = 'rgba(' + COLORES[i] + ',0.3)'; g.lineWidth = 1; g.stroke();
    });
  }

  /* ---------------- Momentos cuánticos ---------------- */
  for (let i = 0; i < 40; i++) {
    const q = document.createElement('div');
    q.className = 'quantum-moment';
    q.style.left = (Math.random() * 100) + '%';
    q.style.top = (Math.random() * 100) + '%';
    q.style.animationDelay = (Math.random() * 3).toFixed(2) + 's';
    q.style.animationDuration = (2 + Math.random() * 2).toFixed(2) + 's';
    if (i % 5 === 0) { q.style.background = 'rgba(59,130,246,0.9)';  q.style.boxShadow = '0 0 4px rgba(59,130,246,0.6)'; }
    else if (i % 5 === 1) { q.style.background = 'rgba(6,182,212,0.9)'; q.style.boxShadow = '0 0 4px rgba(6,182,212,0.6)'; }
    campo.appendChild(q);
  }

  medir();
  if (!reduce) {
    for (let i = 0; i < 6; i++) setTimeout(() => anillo(false), i * 800);
    setInterval(() => anillo(false), 1200);
    for (let i = 0; i < 8; i++) setTimeout(linea, i * 600);
    setInterval(linea, 1000);
    requestAnimationFrame(dibujar);
  }

  /* ---------------- Textos: cada uno cambia mientras está invisible ---------------- */
  const fragmentos = [
    ['AHORA', 'SIEMPRE', 'NUNCA', 'ETERNO'],
    ['PRESENTE', 'PASADO', 'FUTURO', 'ATEMPORAL'],
    ['KRONOS', 'KAIRÓS', 'AIÓN', 'AHORA'],
    ['t = 0', 't = ∞', 't = −∞', 't = i']
  ];
  const frases = [
    'El instante contiene<br>toda la eternidad',
    'El ahora es la puerta<br>al tiempo eterno',
    'En el presente<br>habita la infinitud',
    'Cada momento<br>es todos los momentos'
  ];
  document.querySelectorAll('.temporal-fragment').forEach((el, k) => {
    let gi = 0;
    el.addEventListener('animationiteration', () => { gi = (gi + 1) % fragmentos.length; el.textContent = fragmentos[gi][k]; });
  });
  const frase = document.getElementById('frase');
  let fi = 0;
  frase.addEventListener('animationiteration', () => { fi = (fi + 1) % frases.length; frase.innerHTML = frases[fi]; });

  /* ---------------- La línea de Kronos: su fase, sin contar las pausas ---------------- */
  const t0 = performance.now();
  let pausado = 0, pausaDesde = 0;
  function faseKronos() {
    const ahora = pausaDesde ? pausaDesde : performance.now();
    return (((ahora - t0 - pausado) / 12000) % 1 + 1) % 1;
  }
  function detenerKronos(ms) {
    if (reduce || pausaDesde) return;
    pausaDesde = performance.now();
    kronos.classList.add('detenido');
    setTimeout(() => {
      pausado += performance.now() - pausaDesde; pausaDesde = 0;
      kronos.classList.remove('detenido');
    }, ms);
  }
  function abrirKairos() {
    kairos.classList.remove('vivo'); void kairos.offsetWidth; kairos.classList.add('vivo');
    if (!reduce) { anillo(true); setTimeout(() => anillo(true), 500); setTimeout(() => anillo(true), 1100); }
    detenerKronos(3000);
  }

  /* ---------------- Diseño sonoro: cronostasis, la ilusión del reloj detenido ---------------
     Al mirar un reloj, el primer segundo parece durar más que los siguientes: la aguja se
     queda quieta un momento (Yarrow y otros, 2001). Al oído le pasa lo mismo con el primer
     tono que escucha cuando levanta un teléfono. Aquí suenan los tres tiempos griegos de la
     imagen. Kronos: un tictac seco de madera que acompaña a la línea de un lado al otro.
     Aión: debajo, un drone de Re que gira en el espacio como su círculo. Kairós: al tocar,
     el tic siguiente no se apaga; se abre en un tono de La que se sostiene, y el reloj espera
     tres segundos antes de seguir: el instante se estira. Si nadie toca, Kairós vuelve
     solo cada medio minuto.
  ------------------------------------------------------------------------------------------- */
  function makeReverbIR(ac, seconds = 5, decay = 2.4) {
    const len = Math.floor(ac.sampleRate * seconds);
    const buf = ac.createBuffer(2, len, ac.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    }
    return buf;
  }
  let ruido;
  function tic(t, par) {
    const s = ctx.createBufferSource(); s.buffer = ruido;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = par ? 2500 : 1850; bp.Q.value = 7;
    const g1 = ctx.createGain(); g1.gain.value = 0;
    const p = ctx.createStereoPanner();
    const f = faseKronos(); p.pan.value = Math.max(-0.8, Math.min(0.8, (2 * f - 1) * 1.6));
    s.connect(bp); bp.connect(g1); g1.connect(p); p.connect(master); p.connect(sala);
    g1.gain.setValueAtTime(0, t);
    g1.gain.linearRampToValueAtTime(0.9, t + 0.002);
    g1.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
    s.start(t); s.stop(t + 0.06);
  }
  function tonoKairos(t) {
    // El tic que no se apaga: un La con su quinta, golpeado como un tic y sostenido
    [[440, 0.05], [440.7, 0.03], [880, 0.016], [659.25, 0.022], [1320, 0.006]].forEach(([f, v]) => {
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f;
      const a = ctx.createGain(); a.gain.value = 0;
      o.connect(a); a.connect(master); a.connect(sala);
      a.gain.setValueAtTime(0, t);
      a.gain.linearRampToValueAtTime(v, t + 0.006);
      a.gain.linearRampToValueAtTime(v * 0.62, t + 0.35);
      a.gain.setValueAtTime(v * 0.62, t + 3.2);
      a.gain.exponentialRampToValueAtTime(0.0003, t + 7.5);
      o.start(t); o.stop(t + 7.6);
    });
  }
  function reloj() {                       // programa los tics con un poco de anticipación
    if (!started) return;
    const ahora = ctx.currentTime;
    if (proximoTic < ahora - 0.2) proximoTic = Math.ceil(ahora);   // al volver de una pestaña en segundo plano
    while (proximoTic < ahora + 0.25) {
      const t = proximoTic;
      if (pedidoKairos && t >= ahora) {
        pedidoKairos = false; ultimoKairos = t; kairosHasta = t + 3;
        tonoKairos(t);
        setTimeout(abrirKairos, Math.max(0, (t - ahora) * 1000));
        proximoTic = t + 3; ticN++;
        continue;
      }
      if (t >= kairosHasta) tic(t, ticN % 2 === 0);
      ticN++; proximoTic = t + 1;
    }
    if (ahora - ultimoKairos > 30 && !pedidoKairos) pedidoKairos = true;
  }
  function startAudio() {
    if (started) return;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 3; comp.attack.value = 0.01; comp.release.value = 0.4;
    comp.connect(ctx.destination);
    master = ctx.createGain(); master.gain.value = 0; master.connect(comp);
    master.gain.linearRampToValueAtTime(0.5, ctx.currentTime + 6);
    sala = ctx.createGain(); sala.gain.value = 0.32;
    const conv = ctx.createConvolver(); conv.buffer = makeReverbIR(ctx);
    sala.connect(conv); conv.connect(master);

    ruido = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.08), ctx.sampleRate);
    const d = ruido.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;

    // Aión: Re grave con su quinta y su octava, que gira lento en el estéreo (40 s, como su círculo)
    const aion = ctx.createGain(); aion.gain.value = 0.026;
    aionPan = ctx.createStereoPanner(); aionPan.pan.value = 0;
    const giro = ctx.createOscillator(); giro.frequency.value = 1 / 40;
    const giroG = ctx.createGain(); giroG.gain.value = 0.45;
    giro.connect(giroG); giroG.connect(aionPan.pan); giro.start();
    const resp = ctx.createOscillator(); resp.frequency.value = 1 / 19;
    const respG = ctx.createGain(); respG.gain.value = 0.008;
    resp.connect(respG); respG.connect(aion.gain); resp.start();
    [[73.42, 1], [110, 0.6], [146.83, 0.35], [220.4, 0.12]].forEach(([f, v]) => {
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f;
      const a = ctx.createGain(); a.gain.value = v;
      o.connect(a); a.connect(aion); o.start();
    });
    aion.connect(aionPan); aionPan.connect(master); aionPan.connect(sala);

    started = true;
    proximoTic = Math.ceil(ctx.currentTime + 0.3);
    ultimoKairos = ctx.currentTime;
    setInterval(reloj, 50);
  }

  const hint = document.getElementById('hint');
  window.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.infinito')) return;
    const primera = !started;
    startAudio();
    if (hint) hint.classList.add('oculto');
    if (started && ctx.currentTime >= kairosHasta - 0.5) pedidoKairos = true;
    if (primera) reloj();
  });
</script>
