<style>

  canvas.ondas { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }

  .transmission-code {

<script>
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const campo = document.getElementById('campo');
  const giro = document.getElementById('giro');
  const destello = document.getElementById('destello');
  const lienzo = document.getElementById('ondas');
  const g = lienzo.getContext('2d');
  let W = 0, H = 0;

  /* Las variables del sonido van arriba */
  let started = false, ctx, master, sala, panA, panB, lado = 1;

  /* ---------------- Ondas retroactivas (lienzo): vuelven hacia el origen ---------------- */
  const ondas = [];
  function onda() { ondas.push({ nace: performance.now() + Math.random() * 6000, dura: 6000 }); }
  function medir() {
    const r = campo.getBoundingClientRect(); W = r.width; H = r.height;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    lienzo.width = Math.round(W * dpr); lienzo.height = Math.round(H * dpr);
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  medir(); addEventListener('resize', medir);
  function dibujar(ahora) {
    g.clearRect(0, 0, W, H);
    const R = Math.min(250, 0.31 * Math.min(W, H));
    for (let i = ondas.length - 1; i >= 0; i--) {
      const o = ondas[i], v = (ahora - o.nace) / o.dura;
      if (v >= 1) { ondas.splice(i, 1); continue; }
      if (v < 0) continue;
      // como el original: de 500 a 50 en la primera mitad, de 50 a 10 en la segunda
      const r = v < 0.5 ? R - (R - 0.1 * R) * (v / 0.5) : 0.1 * R - 0.08 * R * ((v - 0.5) / 0.5);
      const al = v < 0.5 ? 0.4 * (v / 0.5) : 0.4 * (1 - (v - 0.5) / 0.5);
      g.beginPath(); g.arc(W / 2, H / 2, r, 0, Math.PI * 2);
      g.strokeStyle = 'rgba(160,90,240,' + al.toFixed(3) + ')';
      g.lineWidth = 1; g.stroke();
    }
    requestAnimationFrame(dibujar);
  }

  function efimero(clase, dentro, vida) {
    const e = document.createElement('div');
    e.className = clase;
    e.style.left = (dentro ? 30 + Math.random() * 40 : Math.random() * 100) + '%';
    e.style.top  = (dentro ? 30 + Math.random() * 40 : Math.random() * 100) + '%';
    e.style.animationDelay = (Math.random() * vida / 1000).toFixed(2) + 's';
    campo.appendChild(e); setTimeout(() => e.remove(), vida * 2);
  }
  function nodoErrante() {
    const n = document.createElement('div');
    n.className = 'bootstrap-node';
    n.style.left = (20 + Math.random() * 60) + '%'; n.style.top = (20 + Math.random() * 60) + '%';
    n.style.animationDelay = (Math.random() * 5).toFixed(2) + 's';
    campo.appendChild(n);
    setTimeout(() => { n.remove(); nodoErrante(); }, 10000);
  }
  if (!reduce) {
    setInterval(onda, 1200);
    requestAnimationFrame(dibujar);
    setInterval(() => efimero('causal-echo', true, 4000), 800);
    setInterval(() => efimero('temporal-ripple', false, 3000), 600);
    setInterval(() => efimero('nachtraglich-spark', false, 2000), 400);
    for (let i = 0; i < 4; i++) setTimeout(nodoErrante, i * 500);
  }

  /* ---------------- La frase alterna con la que aparecía al tocarla ---------------- */
  const frases = [
    'El origen que se causa a sí mismo<br>desde su propio futuro',
    'El futuro causa el pasado<br>El efecto crea la causa'
  ];
  const frase = document.getElementById('frase');
  let fi = 0;
  frase.addEventListener('animationiteration', () => { fi = (fi + 1) % frases.length; frase.innerHTML = frases[fi]; });

  /* ---------------- Diseño sonoro: el canon cangrejo -----------------------------------------
     En el siglo XIV, Guillaume de Machaut escribió un rondó, «Ma fin est mon commencement»
     («Mi fin es mi comienzo»), donde una voz canta la melodía y otra la canta al revés, de la
     última nota a la primera; Bach repitió el gesto en la Ofrenda musical, con el canon que
     se llama cangrejo. Aquí, doce notas en Re: la voz violeta las canta hacia adelante, de un
     lado; la azul, hacia atrás, del otro. Se cruzan en el medio, donde una canta lo que la otra
     acaba de cantar, y en cada momento forman una consonancia. La voz azul termina en la nota
     con que empezó la violeta: la primera nota recién se oye como origen cuando llega la
     cadencia, y solo entonces entra, grave, la quinta de Re que la confirma. A posteriori,
     como la Nachträglichkeit del original.
     Al tocar, las voces cambian de lado (los dos puntos del lazo también) y suena el origen.
  ------------------------------------------------------------------------------------------- */
  const M = [293.66, 329.63, 349.23, 392.0, 440.0, 466.16, 587.33, 523.25, 466.16, 587.33, 523.25, 440.0];
  const NOTA = 1.6, CICLO = M.length * NOTA + 4.8;
  function makeReverbIR(ac, seconds = 5, decay = 2.4) {
    const len = Math.floor(ac.sampleRate * seconds);
    const buf = ac.createBuffer(2, len, ac.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    }
    return buf;
  }
  function voz(f, t, dur, destino, tipo, nivel) {
    const o = ctx.createOscillator(); o.type = tipo; o.frequency.value = f;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = tipo === 'triangle' ? 1700 : 4000;
    const a = ctx.createGain(); a.gain.value = 0;
    o.connect(lp); lp.connect(a); a.connect(destino);
    a.gain.setValueAtTime(0, t);
    a.gain.linearRampToValueAtTime(nivel, t + 0.07);
    a.gain.setValueAtTime(nivel, t + dur - 0.12);
    a.gain.linearRampToValueAtTime(0, t + dur + 0.25);
    o.start(t); o.stop(t + dur + 0.3);
    if (tipo === 'sine') {                 // la voz azul lleva un poco de octava
      const o2 = ctx.createOscillator(); o2.type = 'sine'; o2.frequency.value = f * 2;
      const a2 = ctx.createGain(); a2.gain.value = 0;
      o2.connect(a2); a2.connect(destino);
      a2.gain.setValueAtTime(0, t);
      a2.gain.linearRampToValueAtTime(nivel * 0.18, t + 0.07);
      a2.gain.setValueAtTime(nivel * 0.18, t + dur - 0.12);
      a2.gain.linearRampToValueAtTime(0, t + dur + 0.25);
      o2.start(t); o2.stop(t + dur + 0.3);
    }
  }
  function origen(t, nivel, dur) {        // la quinta de Re, grave
    [[73.42, 1], [110.0, 0.7], [146.83, 0.4]].forEach(([f, v]) => {
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f;
      const a = ctx.createGain(); a.gain.value = 0;
      o.connect(a); a.connect(master); a.connect(sala);
      a.gain.setValueAtTime(0, t);
      a.gain.linearRampToValueAtTime(nivel * v, t + 1.2);
      a.gain.setValueAtTime(nivel * v, t + dur * 0.5);
      a.gain.linearRampToValueAtTime(0, t + dur);
      o.start(t); o.stop(t + dur + 0.1);
    });
  }
  function canon(t0) {
    M.forEach((f, k) => {
      voz(f, t0 + k * NOTA, NOTA, panA, 'triangle', 0.075);                 // hacia adelante
      voz(M[M.length - 1 - k], t0 + k * NOTA, NOTA, panB, 'sine', 0.06);    // hacia atrás
    });
    origen(t0 + (M.length - 1) * NOTA, 0.03, 7.5);                         // llega con la cadencia
  }
  function startAudio() {
    if (started) return;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 3; comp.attack.value = 0.01; comp.release.value = 0.4;
    comp.connect(ctx.destination);
    master = ctx.createGain(); master.gain.value = 0; master.connect(comp);
    master.gain.linearRampToValueAtTime(0.27, ctx.currentTime + 6);
    sala = ctx.createGain(); sala.gain.value = 0.38;
    const conv = ctx.createConvolver(); conv.buffer = makeReverbIR(ctx);
    sala.connect(conv); conv.connect(master);
    panA = ctx.createStereoPanner(); panA.pan.value = -0.6;
    panB = ctx.createStereoPanner(); panB.pan.value = 0.6;
    panA.connect(master); panA.connect(sala); panB.connect(master); panB.connect(sala);

    started = true;
    let t = ctx.currentTime + 1.2;
    canon(t);
    const siguiente = () => { t += CICLO; canon(t); setTimeout(siguiente, CICLO * 1000); };
    setTimeout(siguiente, (CICLO - 2) * 1000);
  }

  function cambiarDeLado() {
    lado = -lado;
    if (!reduce) giro.classList.toggle('vuelta');
    if (!started) return;
    const t = ctx.currentTime;
    panA.pan.cancelScheduledValues(t); panB.pan.cancelScheduledValues(t);
    panA.pan.setValueAtTime(panA.pan.value, t); panB.pan.setValueAtTime(panB.pan.value, t);
    panA.pan.linearRampToValueAtTime(-0.6 * lado, t + 1.6);
    panB.pan.linearRampToValueAtTime(0.6 * lado, t + 1.6);
  }

  const hint = document.getElementById('hint');
  window.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.infinito')) return;
    const primera = !started;
    startAudio();
    if (hint) hint.classList.add('oculto');
    if (!reduce) { destello.classList.remove('vivo'); void destello.offsetWidth; destello.classList.add('vivo'); }
    if (primera) { origen(ctx.currentTime + 0.02, 0.022, 3); return; }
    cambiarDeLado();
    origen(ctx.currentTime + 0.02, 0.022, 3);
  });
</script>
</body>
