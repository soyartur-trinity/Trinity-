<!-- Portal 69. Saneado en noviembre de 2026 sobre el original: el círculo de la danza, el resplandor,
     los pasos cuánticos, las espirales, las piruetas vacías, los gestos, las cintas y las palabras.
     Las espirales y piruetas que cambiaban de borde son ahora capas que se funden. Los pulsos de
     ritmo pasan a ser cinco pasos con su péndulo: metrónomos sin director que terminan al unísono
     (Pantaleone, 2002). Sonido nuevo: sus golpes de madera. -->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {

    position:fixed; left:50%; top:calc(env(safe-area-inset-top, 0px) + 5.5vh);

    letter-spacing:0.3em; padding-left:0.3em; font-style:italic;

  .pista {
    --L: min(86vw, 54vh, 640px);
    position:relative;
    width:var(--L); height:var(--L);
    margin-top:-6vh;
    border-radius:50%;
    background: radial-gradient(circle, rgba(22,11,34,0.5), transparent 72%);
    border:1px solid rgba(255,255,255,0.05);
  }

  .danza-eterna {
    position:absolute; inset:0; border-radius:50%;
    background:
      radial-gradient(circle at 30% 40%, rgba(100,80,255,0.09), transparent 55%),
      radial-gradient(circle at 70% 60%, rgba(255,100,200,0.07), transparent 55%);
    animation: danzaEterna 20s ease-in-out infinite;
  }
  @keyframes danzaEterna { 0%,100% { opacity:0.35; } 50% { opacity:0.8; } }

  .resplandor {
    position:absolute; left:50%; top:50%;
    width:56%; height:56%;
    border-radius:50%;
    background: radial-gradient(circle, rgba(150,100,255,0.15), rgba(150,100,255,0.04) 45%, transparent 70%);
    animation: resplandor 18s ease-in-out infinite;
  }
  @keyframes resplandor {
    0%,100% { transform:translate(-50%,-50%) scale(0.8) rotate(0deg); }
    50%     { transform:translate(-50%,-50%) scale(1.4) rotate(180deg); }
  }

  .paso-cuantico {
    position:absolute; left:50%; top:50%;
    width:13%; height:13%; margin:-6.5% 0 0 -6.5%;
    border-radius:50%;
    background: radial-gradient(circle, rgba(255,255,255,0.12), rgba(255,255,255,0.03) 45%, transparent 70%);
    opacity:0;
    animation: pasoCuantico 25s linear infinite;
  }
  @keyframes pasoCuantico {
    0%   { transform:translate(var(--q1x), var(--q1y)) scale(0);   opacity:0; }
    20%  { transform:translate(var(--q2x), var(--q2y)) scale(1.2); opacity:0.45; }
    40%  { transform:translate(var(--q3x), var(--q3y)) scale(0.8); opacity:0.32; }
    60%  { transform:translate(var(--q4x), var(--q4y)) scale(1.5); opacity:0.52; }
    80%  { transform:translate(var(--q5x), var(--q5y)) scale(0.6); opacity:0.22; }
    100% { transform:translate(var(--q6x), var(--q6y)) scale(0);   opacity:0; }
  }

  /* Las espirales: un círculo y un cuadrado redondeado que se funden mientras giran */
  .espiral {
    position:absolute; left:50%; top:50%;
    width:29%; height:29%;
    opacity:0.32;
    animation: espiral 15s linear infinite;
  }
  .espiral i { position:absolute; inset:0; border:2px solid rgba(255,255,255,0.22); }
  .espiral .redonda  { border-radius:50%; animation: verRedonda 15s linear infinite; }
  .espiral .cuadrada { border-radius:38%; animation: verCuadrada 15s linear infinite; }
  @keyframes espiral {
    0%   { transform:translate(-50%,-50%) rotate(0deg)   scale(0.5); }
    50%  { transform:translate(-50%,-50%) rotate(180deg) scale(1.5); }
    100% { transform:translate(-50%,-50%) rotate(360deg) scale(0.5); }
  }
  @keyframes verRedonda  { 0%,50%,100% { opacity:1; } 25%,75% { opacity:0.15; } }
  @keyframes verCuadrada { 0%,50%,100% { opacity:0; } 25%,75% { opacity:0.85; } }
  .espiral.e2, .espiral.e2 i { animation-delay:-5s; }
  .espiral.e3, .espiral.e3 i { animation-delay:-10s; }
  .espiral.suelta { animation: espiral var(--dur) linear forwards; }
  .espiral.suelta i { animation-duration: var(--dur); animation-iteration-count:1; }

  .pirueta {
    position:absolute;
    width:17%; height:26%;
    border-radius:50% 50% 40% 60%;
    background: linear-gradient(180deg, rgba(200,150,255,0.17), rgba(150,100,255,0.1) 50%, transparent);
    -webkit-mask-image: radial-gradient(ellipse, #000 40%, transparent 72%);
            mask-image: radial-gradient(ellipse, #000 40%, transparent 72%);
    opacity:0;
    animation: pirueta 12s ease-in-out infinite;
  }
  @keyframes pirueta {
    0%,100% { transform:translate(0, 0) rotate(0deg) scale(0.8); opacity:0; }
    25%     { opacity:0.5; }
    50%     { transform:translate(var(--px), var(--py)) rotate(360deg) scale(1.2); opacity:0.7; }
    75%     { opacity:0.4; }
  }

  .pulso-ritmo {
    position:absolute;
    width:20%; height:20%; margin:-10% 0 0 -10%;
    border-radius:50%;
    background: radial-gradient(circle, rgba(150,100,255,0.32), rgba(100,150,255,0.14) 40%, transparent 70%);
    opacity:0;
    animation: pulsoRitmo 8s ease-in-out infinite;

  @keyframes pulsoRitmo {
    0%,100% { transform:scale(0.5); opacity:0; }
    15%     { opacity:0.6; }
    50%     { transform:scale(2);   opacity:0.8; }
    85%     { opacity:0.3; }
  }

  /* Los cinco pasos: un péndulo y su pie, que se enciende en cada golpe */

  .brazo-m {
    position:absolute; left:-1px; bottom:0;
    width:2px; height:calc(var(--L) * 0.15);

    transform-origin: 50% 100%;

  .pie {
    position:absolute; left:0; top:0;
    width:calc(var(--L) * 0.11); height:calc(var(--L) * 0.11);
    border-radius:50%;
    background: radial-gradient(circle, rgba(255,215,170,0.75), rgba(200,150,255,0.25) 40%, transparent 70%);
    transform:translate(-50%,-50%) scale(0.6);
    opacity:0.12;

  .gesto {
    position:absolute;
    width:calc(var(--L) * 0.21); height:3px;
    background: linear-gradient(90deg, transparent, rgba(255,200,150,0.7), rgba(200,150,255,0.7), transparent);

    animation: gesto 10s ease-in-out forwards;
  }
  @keyframes gesto {
    0%,100% { transform:translate(0, 0) rotate(0deg) scaleX(0); opacity:0; }
    20%     { opacity:0.8; }
    50%     { transform:translate(var(--gx), var(--gy)) rotate(var(--gr)) scaleX(1); opacity:0.9; }
    80%     { opacity:0.5; }
  }

  .traza {
    position:absolute;
    width:5px; height:5px; margin:-2.5px 0 0 -2.5px;
    border-radius:50%;
    background: rgba(255,255,255,0.92);
    box-shadow: 0 0 14px rgba(255,255,255,0.7);
    opacity:0;
    animation: traza 12s ease-in-out forwards;
  }
  @keyframes traza {
    0%,100% { transform:translate(0, 0); opacity:0; }
    10%     { opacity:1; }
    50%     { transform:translate(var(--tx), var(--ty)); opacity:0.8; }
    90%     { opacity:0.3; }

  .cinta {
    position:absolute;
    width:calc(var(--L) * 0.29); height:2px;

  @keyframes cinta {

    50%     { transform:translateY(var(--ry)) rotate(var(--rr)) scaleX(1); opacity:0.7; }

  .texto-danza {

    font-size: clamp(12px, 3.2vw, 17px);

    50%     { transform:translate(-50%,-50%) rotate(2deg);  opacity:0.8; }

  /* Mientras habla la revelación, el texto central se retira */
  .centro { position:absolute; inset:0; pointer-events:none; transition: opacity 1.2s ease; z-index:3; }

  .revelacion {

  .frases {
    position:fixed; left:50%;
    bottom:calc(env(safe-area-inset-bottom, 0px) + 16vh);

    width:90vw; max-width:620px; height:3.4em;
    text-align:center;
    pointer-events:none;

  .frase {
    position:absolute; left:0; right:0; bottom:0;
    font-size: clamp(14px, 3.9vw, 19px);
    line-height:1.6;
    letter-spacing:0.06em;
    font-style:italic;
    color: rgba(242,238,252,0.9);
    text-shadow: 0 0 18px rgba(150,100,255,0.35);
    opacity:0;
    animation: frase 30s ease-in-out infinite;
  }
  .frase.f2 { animation-delay:10s; }
  .frase.f3 { animation-delay:20s; }
  @keyframes frase {
    0%     { opacity:0; transform:translateY(6px); }
    4.7%   { opacity:1; transform:translateY(0); }
    29.3%  { opacity:1; transform:translateY(0); }
    33.3%  { opacity:0; transform:translateY(-4px); }
    100%   { opacity:0; transform:translateY(-4px); }
  }

  .hint {
    position:fixed; left:50%;
    bottom:calc(env(safe-area-inset-bottom, 0px) + 50px);
    transform:translateX(-50%);
    width:max-content; max-width:88vw; text-align:center;

    animation: invita 3.4s infinite ease-in-out;
    pointer-events:none;
    transition: opacity 1.4s ease;
  }
  .hint.oculto { animation:none; opacity:0; }
  @keyframes invita { 0%,100% { opacity:0.45; } 50% { opacity:0.95; } }

  .infinito {
    position:fixed;
    bottom:calc(env(safe-area-inset-bottom, 0px) + 14px); right:22px;
    font-size:30px; text-decoration:none;
    color: rgba(205,190,240,0.4);
    transition: color 0.8s ease, text-shadow 0.8s ease;
    z-index:20;
    cursor:pointer;
  }
  .infinito:hover, .infinito:focus-visible { color: rgba(245,242,255,0.95); text-shadow:0 0 18px rgba(170,140,255,0.6); outline:none; }

  @media (max-width: 480px) {
    .frases { bottom:calc(env(safe-area-inset-bottom, 0px) + 16.5vh); height:4.9em; }
  }
  @media (orientation: landscape) and (max-height: 500px) {
    .subtitulo { display:none; }
    .cabecera { top:calc(env(safe-area-inset-top, 0px) + 10px); }
    .pista { --L: min(58vh, 640px); margin-top:-4vh; }
    .frases { bottom:calc(env(safe-area-inset-bottom, 0px) + 30px); height:3.3em; }
    .frase { font-size:13px; line-height:1.45; }
    .hint { bottom:calc(env(safe-area-inset-bottom, 0px) + 8px); font-size:11px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation:none !important; }
    .texto-central { opacity:0.85; transform:translate(-50%,-50%); }
    .texto-danza { opacity:0.6; transform:rotate(var(--rotation)); }
    .resplandor { transform:translate(-50%,-50%); }
    .espiral { transform:translate(-50%,-50%); }
    .espiral .cuadrada { opacity:0; }
    .paso-cuantico, .pirueta { display:none; }
    .pulso-ritmo { opacity:0.45; }
    .pie { opacity:0.35; }
    .frases { height:auto; bottom:calc(env(safe-area-inset-bottom, 0px) + 9vh); }
    .frase { position:static; opacity:0.92; margin-bottom:0.35em; font-size: clamp(12px, 3.4vw, 16px); }
    .pista { margin-top:-12vh; }
    .hint { opacity:0.8; bottom:calc(env(safe-area-inset-bottom, 0px) + 18px); }
    .revelacion { opacity:1; transform:translate(-50%,-50%); }
  }
</style>

<script>
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const pista = document.getElementById('pista');
  const hint = document.getElementById('hint');
  let L = pista.clientWidth;
  addEventListener('resize', () => { L = pista.clientWidth; colocarMetros(); });
  // El sonido se declara arriba
  let ctx = null, master, seco, sala, ruidoBuf, coro;
  const al = (r) => (Math.random() * 2 - 1) * r;

  /* ---------------- Metrónomos sin director ----------------------------------------------------
     Pantaleone (2002) puso varios metrónomos sobre una tabla que podía rodar sobre dos latas:
     cada uno marca su tiempo, pero cada vaivén empuja un poco la tabla, y la tabla empuja a todos.
     En unas decenas de segundos terminan oscilando juntos, sin que ninguno mande. Es el modelo de
     Kuramoto: osciladores casi iguales, acoplados por lo que comparten. Aquí son cinco pasos en
     ronda, cada uno con su péndulo y su golpe de madera; empiezan repartidos, como un arpegio que
     gira, y se van juntando hasta golpear a la vez. Entonces aparece, debajo, el acorde. Al tocar,
     se dispersan y vuelven a encontrarse.
  ------------------------------------------------------------------------------------------- */
  const N = 5, OMEGA = 2 * Math.PI * 0.95, K = 0.16, RUIDO = 0.01, AMPLITUD = 26;
  const DESVIO = [-0.008, 0.004, -0.004, 0.008, 0];
  const omega = DESVIO.map(d => OMEGA * (1 + d + al(0.001)));
  let theta = omega.map((_, i) => (i / N) * 2 * Math.PI + al(0.3));
  let orden = 0, juntosDesde = null;
  const GOLPE = [880, 987.77, 1108.73, 1318.51, 1479.98];       // la mayor pentatónica, uno por paso

  const metros = [];
  const capa = document.getElementById('metros');
  for (let i = 0; i < N; i++) {
    const m = document.createElement('div'); m.className = 'metro';
    m.innerHTML = '<div class="pie"></div><div class="brazo-m"></div>';
    capa.appendChild(m);
    metros.push({ el: m, brazo: m.querySelector('.brazo-m'), pie: m.querySelector('.pie'), base: -90 + i * 72 });
  }
  function colocarMetros() {
    metros.forEach(m => {
      const a = m.base * Math.PI / 180, r = 0.25 * L;
      m.el.style.transform = `translate(${(Math.cos(a) * r).toFixed(1)}px, ${(Math.sin(a) * r).toFixed(1)}px)`;
      m.brazo.style.transform = `rotate(${m.base + 90}deg)`;
    });
  }
  colocarMetros();

  function gauss() { return Math.sqrt(-2 * Math.log(1 - Math.random())) * Math.cos(2 * Math.PI * Math.random()); }
  let antes = performance.now();
  function paso() {
    const ahora = performance.now();
    const dt = Math.min(0.1, (ahora - antes) / 1000); antes = ahora;
    let re = 0, im = 0;
    for (const t of theta) { re += Math.cos(t); im += Math.sin(t); }
    re /= N; im /= N;
    orden = Math.hypot(re, im);
    const psi = Math.atan2(im, re);
    for (let i = 0; i < N; i++) {
      const previo = theta[i];
      theta[i] += dt * (omega[i] + K * orden * Math.sin(psi - theta[i])) + RUIDO * Math.sqrt(dt) * gauss();
      // un golpe cada vez que el péndulo pasa por el centro (cada medio ciclo)
      const kAntes = Math.floor(previo / Math.PI), kAhora = Math.floor(theta[i] / Math.PI);
      if (kAhora > kAntes) golpe(i, kAhora % 2 === 0, (theta[i] - kAhora * Math.PI) / (theta[i] - previo) * dt);
    }
    // Si llevan mucho tiempo juntos, una ráfaga los dispersa sola
    if (orden > 0.97) { if (juntosDesde === null) juntosDesde = ahora; else if (ahora - juntosDesde > 45000) dispersar(1.2); }
    else juntosDesde = null;
    if (ctx) coro.gain.setTargetAtTime(0.009 * Math.pow(orden, 6), ctx.currentTime, 1.0);
  }
  setInterval(paso, 20);

  function dibujar() {
    metros.forEach((m, i) => {
      m.brazo.style.transform = `rotate(${(m.base + 90 + AMPLITUD * Math.sin(theta[i])).toFixed(2)}deg)`;
    });
    requestAnimationFrame(dibujar);
  }
  if (!reduce) requestAnimationFrame(dibujar);

  function dispersar(fuerza) {
    theta = theta.map(t => t + (Math.random() < 0.5 ? -1 : 1) * fuerza * (1.2 + Math.random() * 1.6));
    juntosDesde = null;
  }

  /* ---------------- Diseño sonoro --------------------------------------------------------------
     Cada paso tiene su golpe de madera: un tono breve que cae apenas y un chasquido de ruido; en el
     pasaje de vuelta, el mismo golpe una quinta más abajo (tic y tac). Desfasados, forman un
     arpegio que gira; juntos, un acorde de un solo golpe. Debajo, La, Mi, La y Do sostenido, que
     solo se oyen cuando la danza está junta.
  ------------------------------------------------------------------------------------------- */
  function makeReverbIR(ac, seconds = 3.5, decay = 2.6) {
    const len = Math.floor(ac.sampleRate * seconds);
    const buf = ac.createBuffer(2, len, ac.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    }
    return buf;
  }

  function golpe(i, tic, retraso) {
    if (!reduce) {
      metros[i].pie.animate(
        [{ opacity: 0.95, transform: 'translate(-50%,-50%) scale(1.25)' }, { opacity: 0.12, transform: 'translate(-50%,-50%) scale(0.6)' }],
        { duration: 650, easing: 'ease-out', delay: Math.max(0, (0.03 - retraso) * 1000) });
    }
    if (!ctx) return;
    const t = ctx.currentTime + 0.03 - Math.min(0.025, retraso);
    const f = GOLPE[i] * (tic ? 1 : 2 / 3);
    const p = ctx.createStereoPanner(); p.pan.value = Math.cos((metros[i].base) * Math.PI / 180) * 0.7;
    p.connect(seco); p.connect(sala);
    const o = ctx.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f * 0.92, t + 0.03);
    const g = ctx.createGain(); g.gain.value = 0;
    o.connect(g); g.connect(p);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(tic ? 0.06 : 0.045, t + 0.002); g.gain.exponentialRampToValueAtTime(0.0003, t + 0.11);
    o.start(t); o.stop(t + 0.13);
    const n = ctx.createBufferSource(); n.buffer = ruidoBuf;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f * 2.2; bp.Q.value = 3;
    const gn = ctx.createGain(); gn.gain.value = 0;
    n.connect(bp); bp.connect(gn); gn.connect(p);
    gn.gain.setValueAtTime(0, t); gn.gain.linearRampToValueAtTime(0.05, t + 0.001); gn.gain.exponentialRampToValueAtTime(0.0003, t + 0.025);
    n.start(t, Math.random()); n.stop(t + 0.04);
  }

  function startAudio() {
    if (ctx) return;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
    master = ctx.createGain(); master.gain.value = 0; master.connect(ctx.destination);
    master.gain.setValueAtTime(0, ctx.currentTime);
    master.gain.linearRampToValueAtTime(1.2, ctx.currentTime + 6);
    seco = ctx.createGain(); seco.gain.value = 0.7; seco.connect(master);
    sala = ctx.createGain(); sala.gain.value = 0.4;
    const conv = ctx.createConvolver(); conv.buffer = makeReverbIR(ctx);
    sala.connect(conv); conv.connect(master);
    ruidoBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const d = ruidoBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    coro = ctx.createGain(); coro.gain.value = 0;
    coro.connect(seco); coro.connect(sala);
    [[110, 1], [164.81, 0.7], [220, 0.6], [277.18, 0.4]].forEach(([f, v]) => {
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f;
      const g = ctx.createGain(); g.gain.value = v;
      o.connect(g); g.connect(coro); o.start();
    });
  }

  /* ---------------- La danza que sigue ---------------------------------------------------------- */
  function gesto(x, y, gx, gy, gr, dur) {
    const g = document.createElement('div'); g.className = 'gesto';
    g.style.cssText = `left:${x};top:${y};--gx:${gx.toFixed(1)}px;--gy:${gy.toFixed(1)}px;--gr:${gr.toFixed(0)}deg;` + (dur ? `animation-duration:${dur}s;` : `animation-delay:${(Math.random() * 5).toFixed(2)}s;`);
    pista.appendChild(g); setTimeout(() => g.remove(), (dur || 15) * 1000 + 100);
  }
  function trazas(x, y, n, rango, dur) {
    for (let i = 0; i < n; i++) setTimeout(() => {
      const t = document.createElement('div'); t.className = 'traza';
      const a = (i / n) * Math.PI * 2 + Math.random() * 0.3, d = (rango[0] + Math.random() * rango[1]) * L;
      t.style.cssText = `left:${x};top:${y};--tx:${(Math.cos(a) * d).toFixed(1)}px;--ty:${(Math.sin(a) * d).toFixed(1)}px;animation-duration:${dur}s;` + (dur > 8 ? `animation-delay:${(Math.random() * 4).toFixed(2)}s;` : '');
      pista.appendChild(t); setTimeout(() => t.remove(), dur * 1000 + 4100);
    }, i * (dur > 8 ? 100 : 50));
  }
  function cinta() {
    const c = document.createElement('div'); c.className = 'cinta';
    c.style.cssText = `left:${20 + Math.random() * 50}%;top:${20 + Math.random() * 60}%;--ry:${(al(0.14) * L).toFixed(1)}px;--rr:${al(90).toFixed(0)}deg;animation-delay:${(Math.random() * 6).toFixed(2)}s;`;
    pista.appendChild(c); setTimeout(() => c.remove(), 20100);
  }
  function palabraDanza() {
    const textos = ['baile', 'ritmo', 'cadencia', 'armonía', 'gravedad', 'levedad', 'espacio', 'tiempo'];
    const t = document.createElement('div'); t.className = 'texto-danza';
    t.textContent = textos[Math.floor(Math.random() * textos.length)];
    const dur = 14 + Math.random() * 8;
    t.style.cssText = `top:${18 + Math.random() * 62}%;left:${12 + Math.random() * 60}%;--rotation:${al(6).toFixed(1)}deg;animation-duration:${dur.toFixed(1)}s;animation-iteration-count:1;`;
    pista.appendChild(t); setTimeout(() => t.remove(), dur * 1000);
  }
  function espiralSuelta(x, y, tam, dur, borde) {
    const e = document.createElement('div'); e.className = 'espiral suelta';
    e.style.cssText = `left:${x};top:${y};width:${tam}%;height:${tam}%;--dur:${dur}s;` + (borde ? 'opacity:0.5;' : '');
    e.innerHTML = '<i class="redonda"></i><i class="cuadrada"></i>';
    pista.appendChild(e); setTimeout(() => e.remove(), dur * 1000);
  }
  const gestoLibre = () => gesto(`${20 + Math.random() * 60}%`, `${20 + Math.random() * 60}%`, al(0.21) * L, al(0.21) * L, al(360));

  if (!reduce) {
    setInterval(gestoLibre, 2000);
    setInterval(() => trazas('50%', '50%', 15, [0.14, 0.29], 12), 7000);
    setInterval(cinta, 4000);
    setInterval(palabraDanza, 5000);
    for (let i = 0; i < 8; i++) setTimeout(gestoLibre, i * 700);
    trazas('50%', '50%', 15, [0.14, 0.29], 12);
    for (let i = 0; i < 4; i++) setTimeout(cinta, i * 1200);
  }

  /* ---------------- El toque ---------------------------------------------------------------- */
  let pendiente = null;
  let revelandoHasta = null;
  function revelacion(texto, sombra, x, y, ms) {
    const v = document.createElement('div'); v.className = 'revelacion';
    v.textContent = texto;
    v.style.left = x; v.style.top = y;
    v.style.setProperty('--sombra', sombra);
    v.style.animationDuration = (ms / 1000) + 's';
    pista.appendChild(v); setTimeout(() => v.remove(), ms + 100);
    pista.classList.add('revelando');
    clearTimeout(revelandoHasta); revelandoHasta = setTimeout(() => pista.classList.remove('revelando'), Math.max(1000, ms - 900));
  }
  function toque(cx, cy) {
    dispersar(1);
    if (reduce) return;
    const r = pista.getBoundingClientRect();
    const px = ((cx - r.left) / r.width) * 100, py = ((cy - r.top) / r.height) * 100;
    for (let i = 0; i < 5; i++) setTimeout(() => espiralSuelta(`${px}%`, `${py}%`, 11 + i * 6, 10 + i * 2), i * 300);
    for (let i = 0; i < 12; i++) setTimeout(() => { const a = i * 30 * Math.PI / 180; gesto(`${px}%`, `${py}%`, Math.cos(a) * 0.21 * L, Math.sin(a) * 0.21 * L, i * 30, 4); }, i * 80);
    trazas(`${px}%`, `${py}%`, 20, [0.07, 0.21], 6);
    pendiente = setTimeout(() => revelacion('LA DANZA\nES PURA', 'rgba(150,100,255,0.85)', `${Math.max(30, Math.min(70, px))}%`, `${Math.max(15, Math.min(85, py))}%`, 5000), 400);
  }
  function revelar() {
    clearTimeout(pendiente);
    revelacion('EL MOVIMIENTO\nES ETERNO', 'rgba(255,100,200,0.9)', '50%', '50%', reduce ? 9000 : 10000);
    if (reduce) return;
    for (let i = 0; i < 8; i++) setTimeout(() => espiralSuelta('50%', '50%', 14 + i * 9, 20 + i * 3, true), i * 500);
  }

  let ultimo = 0;
  window.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.infinito')) return;
    startAudio();
    hint.classList.add('oculto');
    const t = performance.now();
    if (t - ultimo < 380) { ultimo = 0; revelar(); return; }
    ultimo = t;
    toque(e.clientX, e.clientY);
  });

  /* Con el ratón, una estela de movimiento */
  let ultimoPaso = 0;
  window.addEventListener('pointermove', (e) => {
    if (reduce || e.pointerType !== 'mouse') return;
    const t = performance.now();
    if (t - ultimoPaso < 150) return;
    ultimoPaso = t;
    const r = pista.getBoundingClientRect();
    const px = ((e.clientX - r.left) / r.width) * 100, py = ((e.clientY - r.top) / r.height) * 100;
    if (px < 0 || py < 0 || px > 100 || py > 100) return;
    trazas(`${px}%`, `${py}%`, 1, [0.03, 0.08], 3);
  });
</script>
</body>
</html>
