<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
<title>Portal 66 · El Acto Espontáneo — Trinity Infinito</title>

<!-- Portal 66. Saneado en noviembre de 2026 sobre el original: el círculo del ahora, sus pulsos,
     los destellos, los saltos de color, las formas que cambian y las palabras sueltas.
     Las formas que cambiaban de borde son ahora dos capas que se funden. El acto ya no ocurre a
     intervalos fijos: llega cuando una tensión que fluctúa al azar cruza un umbral (Schurger,
     Sitt y Dehaene, 2012), como el rayo. Sonido nuevo: el umbral. -->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    background: radial-gradient(ellipse at center, #0c0618 0%, #050309 55%, #000 82%);
    background-color:#000;
    color:#fff;
    font-family: Georgia, serif;
    overflow:hidden;
    height:100vh; height:100dvh;
    display:flex; align-items:center; justify-content:center;
    cursor:none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    -webkit-user-select:none; user-select:none;
  }

  .cabecera {
    position:fixed; left:50%; top:calc(env(safe-area-inset-top, 0px) + 5.5vh);
    transform:translateX(-50%);
    width:max-content; max-width:92vw; text-align:center;
    z-index:5; pointer-events:none;
  }
  .titulo {
    font-size: clamp(17px, 5vw, 31px);
    font-weight:bold;
    letter-spacing: clamp(0.16em, 1.2vw, 0.42em);
    padding-left: clamp(0.16em, 1.2vw, 0.42em);
    line-height:1.45;
    color: rgba(250,244,255,0.92);
    text-shadow: 0 0 30px rgba(150,100,255,0.5);
  }
  .subtitulo {
    margin-top:0.6em;
    font-size: clamp(11px, 2.9vw, 15px);
    letter-spacing:0.3em; padding-left:0.3em; font-style:italic;
    color: rgba(228,220,250,0.5);
  }

  /* El momento ahora */
  .ahora {
    --L: min(84vw, 52vh, 600px);
    position:relative;
    width:var(--L); height:var(--L);
    margin-top:-6vh;
    border-radius:50%;
    background: radial-gradient(circle, rgba(22,11,34,0.55), transparent 72%);
    border:1px solid rgba(255,255,255,0.05);
  }

  .acto-puro {
    position:absolute; inset:0; border-radius:50%;
    background:
      radial-gradient(circle at 30% 40%, rgba(250,110,200,0.10), transparent 55%),
      radial-gradient(circle at 70% 60%, rgba(110,200,250,0.08), transparent 55%);
    animation: actoPuro 20s ease-in-out infinite;
  }
  @keyframes actoPuro { 0%,100% { opacity:0.3; } 50% { opacity:0.75; } }

  .pulso-ahora {
    position:absolute; left:50%; top:50%;
    width:33%; height:33%;
    border:1px solid rgba(255,255,255,0.2);
    border-radius:50%;
    animation: ahoraRespira 8s ease-in-out infinite;
  }
  @keyframes ahoraRespira {
    0%,100% { transform:translate(-50%,-50%) scale(0.8); opacity:0.3; }
    50%     { transform:translate(-50%,-50%) scale(1.5); opacity:0.7; }
  }

  /* La tensión que se acumula: el guion fija su brillo y su tamaño */
  .tension {
    position:absolute; left:50%; top:50%;
    width:34%; height:34%;
    border-radius:50%;
    background: radial-gradient(circle, rgba(255,226,180,0.55), rgba(250,130,200,0.2) 45%, transparent 70%);
    transform:translate(-50%,-50%) scale(1);
    opacity:0.1;
    transition: transform 0.12s linear, opacity 0.12s linear;
    will-change: transform, opacity;
  }

  .destello {
    position:absolute; left:50%; top:50%;
    width:50%; height:50%;
    border-radius:50%;
    background: radial-gradient(circle, rgba(255,255,255,0.75), rgba(255,240,220,0.25) 35%, transparent 68%);
    opacity:0;
    transform:translate(-50%,-50%) scale(0);
    pointer-events:none;
  }
  .destello.vivo { animation: destello 1.5s ease-out forwards; }
  @keyframes destello {
    0%   { transform:translate(-50%,-50%) scale(0.2); opacity:0; }
    10%  { transform:translate(-50%,-50%) scale(1.4); opacity:1; }
    100% { transform:translate(-50%,-50%) scale(3);   opacity:0; }
  }

  .salto {
    position:absolute; left:50%; top:50%;
    width:22%; height:22%;
    margin:-11% 0 0 -11%;
    border-radius:50%;
    background: radial-gradient(circle, rgba(110,200,255,0.24), rgba(110,200,255,0.06) 45%, transparent 70%);
    opacity:0;
    animation: salto 25s ease-in-out infinite;
  }
  @keyframes salto {
    0%,100% { transform:translate(var(--q1x), var(--q1y)) scale(0);   opacity:0; }
    25%     { transform:translate(var(--q2x), var(--q2y)) scale(1.5); opacity:0.6; }
    50%     { transform:translate(var(--q3x), var(--q3y)) scale(0.8); opacity:0.3; }
    75%     { transform:translate(var(--q4x), var(--q4y)) scale(2);   opacity:0.4; }
  }

  /* Las formas espontáneas: un círculo y un cuadrado que se funden mientras giran */
  .forma {
    position:absolute;
    width:13%; height:13%;
    opacity:0;
    animation: formaGira 14s ease-in-out infinite;
  }
  .forma i {
    position:absolute; inset:0;
    border:2px solid rgba(255,255,255,0.42);
  }
  .forma .redonda  { border-radius:50%; animation: verRedonda 14s ease-in-out infinite; }
  .forma .cuadrada { border-radius:12%; animation: verCuadrada 14s ease-in-out infinite; }
  @keyframes formaGira {
    0%,100% { transform:rotate(0deg) scale(0);     opacity:0; }
    15%     { opacity:0.6; }
    25%     { transform:rotate(45deg) scale(1.5);  opacity:0.8; }
    50%     { transform:rotate(180deg) scale(2);   opacity:0.7; }
    75%     { transform:rotate(270deg) scale(1.2); opacity:0.5; }
  }
  @keyframes verRedonda  { 0%,40%,100% { opacity:1; } 22%,60%,80% { opacity:0; } }
  @keyframes verCuadrada { 0%,40%,100% { opacity:0; } 22%,60%,80% { opacity:1; } }
  .forma.f2, .forma.f2 i { animation-delay:-4.7s; }
  .forma.f3, .forma.f3 i { animation-delay:-9.3s; }
  .forma.f4, .forma.f4 i { animation-delay:-12s; }

  .impulso {
    position:absolute; left:50%; top:50%;
    width:14%; height:14%; margin:-7% 0 0 -7%;
    border-radius:50%;
    background: radial-gradient(circle, rgba(255,205,120,0.55), rgba(250,110,200,0.3) 40%, transparent 70%);
    opacity:0;
    animation: impulso 8s ease-out forwards;
  }
  @keyframes impulso {
    0%   { transform:translate(0, 0) scale(0); opacity:0; }
    10%  { opacity:0.75; }
    50%  { transform:translate(var(--bx), var(--by)) scale(3); opacity:0.75; }
    100% { transform:translate(calc(var(--bx) * 1.5), calc(var(--by) * 1.5)) scale(5); opacity:0; }
  }

  .ola {
    position:absolute; left:50%; top:50%;
    width:100%; height:100%;
    border:2px solid rgba(255,255,255,0.3);
    border-radius:50%;
    opacity:0;
    pointer-events:none;
    animation: ola 7s ease-out forwards;
  }
  @keyframes ola {
    0%   { transform:translate(-50%,-50%) scale(0);   opacity:0; }
    10%  { opacity:0.75; }
    100% { transform:translate(-50%,-50%) scale(2.4); opacity:0; }
  }

  .rayo {
    position:absolute; left:50%; top:50%;
    width:3px; height:calc(var(--L) * 0.17);
    margin-left:-1.5px;
    background: linear-gradient(to bottom, rgba(255,255,255,0.95), rgba(170,120,255,0.65), transparent);
    transform-origin: top center;
    opacity:0;
    animation: rayo 6s ease-in-out forwards;
  }
  @keyframes rayo {
    0%   { transform:rotate(var(--angle)) translateY(0) scaleY(0);              opacity:0; }
    5%   { transform:rotate(var(--angle)) translateY(0) scaleY(1);              opacity:1; }
    50%  { transform:rotate(var(--angle)) translateY(var(--distance)) scaleY(0.8); opacity:0.7; }
    95%  { opacity:0.2; }
    100% { transform:rotate(var(--angle)) translateY(var(--distance)) scaleY(0.6); opacity:0; }
  }

  .flujo {
    position:absolute; left:50%; top:50%;
    width:5px; height:5px; margin:-2.5px 0 0 -2.5px;
    border-radius:50%;
    background: rgba(255,255,255,0.92);
    box-shadow: 0 0 14px rgba(255,255,255,0.75);
    opacity:0;
    animation: flujo 12s linear forwards;
  }
  @keyframes flujo {
    0%   { transform:translate(0, 0) scale(0); opacity:0; }
    5%   { opacity:1; }
    50%  { transform:translate(var(--fx), var(--fy)) scale(1); opacity:0.9; }
    100% { transform:translate(calc(var(--fx) * 1.8), calc(var(--fy) * 1.8)) scale(0.3); opacity:0; }
  }

  .texto-central {
    position:absolute; left:50%; top:50%;
    width:90%;
    font-size: clamp(15px, 4.4vw, 23px);
    letter-spacing:0.26em; padding-left:0.26em;
    line-height:1.75;
    text-align:center;
    color: rgba(255,255,255,0.92);
    text-shadow: 0 0 20px rgba(255,255,255,0.4);
    opacity:0;
    animation: central 20s ease-in-out infinite;
    animation-delay:-17s;
    pointer-events:none;
    z-index:3;
  }
  @keyframes central {
    0%,100% { transform:translate(-50%,-50%) scale(0.92); opacity:0; }
    14%,86% { transform:translate(-50%,-50%) scale(1);    opacity:0.82; }
  }

  .espontaneo {
    position:absolute;
    font-size: clamp(12px, 3.1vw, 16px);
    letter-spacing:0.2em;
    white-space:nowrap;
    color: rgba(255,255,255,0.72);
    text-shadow: 0 0 15px rgba(150,100,255,0.4);
    opacity:0;
    animation: espontaneo 12s ease-in-out infinite;
  }
  @keyframes espontaneo {
    0%,100% { transform:translateY(20px) rotate(var(--rotation)); opacity:0; }
    20%,80% { transform:translateY(0) rotate(var(--rotation));    opacity:0.8; }
  }


  /* Mientras habla la revelación, el texto central se retira */
  .centro { position:absolute; inset:0; pointer-events:none; transition: opacity 1.2s ease; z-index:3; }
  .revelando .centro { opacity:0; }

  .revelacion {
    position:absolute; left:50%; top:50%;
    width:92%;
    text-align:center;
    white-space:pre-line;
    font-size: clamp(17px, 5vw, 28px);
    line-height:1.55;
    letter-spacing:0.22em; padding-left:0.22em;
    color: rgba(255,255,255,0.96);
    text-shadow: 0 0 34px var(--sombra, rgba(150,100,255,0.85));
    pointer-events:none;
    z-index:6;
    opacity:0;
    animation: revela 7s ease-out forwards;
  }
  @keyframes revela {
    0%   { transform:translate(-50%,-50%) scale(0.9); opacity:0; }
    15%  { transform:translate(-50%,-50%) scale(1);   opacity:1; }
    75%  { transform:translate(-50%,-50%) scale(1);   opacity:1; }
    100% { transform:translate(-50%,-50%) scale(1);   opacity:0; }
  }

  /* Las frases: tres, cada una legible casi nueve segundos dentro de un ciclo de treinta */
  .frases {
    position:fixed; left:50%;
    bottom:calc(env(safe-area-inset-bottom, 0px) + 16vh);
    transform:translateX(-50%);
    width:90vw; max-width:620px; height:3.4em;
    text-align:center;
    pointer-events:none;
  }
  .frase {
    position:absolute; left:0; right:0; bottom:0;
    font-size: clamp(14px, 3.9vw, 19px);
    line-height:1.6;
    letter-spacing:0.06em;
    font-style:italic;
    color: rgba(242,238,252,0.9);
    text-shadow: 0 0 18px rgba(150,100,255,0.35);
    opacity:0;
    animation: frase 30s ease-in-out infinite;
  }
  .frase.f2 { animation-delay:10s; }
  .frase.f3 { animation-delay:20s; }
  @keyframes frase {
    0%     { opacity:0; transform:translateY(6px); }
    4.7%   { opacity:1; transform:translateY(0); }
    29.3%  { opacity:1; transform:translateY(0); }
    33.3%  { opacity:0; transform:translateY(-4px); }
    100%   { opacity:0; transform:translateY(-4px); }
  }

  .hint {
    position:fixed; left:50%;
    bottom:calc(env(safe-area-inset-bottom, 0px) + 50px);
    transform:translateX(-50%);
    width:max-content; max-width:88vw; text-align:center;
    font-size: clamp(12px, 3.2vw, 14px);
    letter-spacing:1px;
    color: rgba(242,238,252,0.88);
    animation: invita 3.4s infinite ease-in-out;
    pointer-events:none;
    transition: opacity 1.4s ease;
  }
  .hint.oculto { animation:none; opacity:0; }
  @keyframes invita { 0%,100% { opacity:0.45; } 50% { opacity:0.95; } }

  .infinito {
    position:fixed;
    bottom:calc(env(safe-area-inset-bottom, 0px) + 14px); right:22px;
    font-size:30px; text-decoration:none;
    color: rgba(205,190,240,0.4);
    transition: color 0.8s ease, text-shadow 0.8s ease;
    z-index:20;
    cursor:pointer;
  }
  .infinito:hover, .infinito:focus-visible { color: rgba(245,242,255,0.95); text-shadow:0 0 18px rgba(170,140,255,0.6); outline:none; }

  @media (max-width: 480px) {
    .frases { bottom:calc(env(safe-area-inset-bottom, 0px) + 16.5vh); height:4.9em; }
  }
  @media (orientation: landscape) and (max-height: 500px) {
    .subtitulo { display:none; }
    .cabecera { top:calc(env(safe-area-inset-top, 0px) + 10px); }
    .ahora { --L: min(56vh, 600px); margin-top:-4vh; }
    .frases { bottom:calc(env(safe-area-inset-bottom, 0px) + 30px); height:3.3em; }
    .frase { font-size:13px; line-height:1.45; }
    .hint { bottom:calc(env(safe-area-inset-bottom, 0px) + 8px); font-size:11px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation:none !important; transition:none !important; }
    .texto-central { opacity:0.85; transform:translate(-50%,-50%); }
    .espontaneo { opacity:0.65; transform:rotate(var(--rotation)); }
    .tension { opacity:0.35; }
    .salto, .forma { display:none; }
    .pulso-ahora { opacity:0.4; transform:translate(-50%,-50%); }
    .frases { height:auto; bottom:calc(env(safe-area-inset-bottom, 0px) + 9vh); }
    .frase { position:static; opacity:0.92; margin-bottom:0.35em; font-size: clamp(12px, 3.4vw, 16px); }
    .ahora { margin-top:-12vh; }
    .hint { opacity:0.8; bottom:calc(env(safe-area-inset-bottom, 0px) + 18px); }
    .revelacion { opacity:1; transform:translate(-50%,-50%); }
  }
</style>

<body>
  <div class="cabecera">
    <div class="titulo">EL ACTO ESPONTÁNEO</div>
    <div class="subtitulo">Libro 10 - Nodo 66</div>
  </div>

  <div class="ahora" id="ahora">
    <div class="acto-puro"></div>
    <div class="pulso-ahora" style="animation-delay:0s"></div>
    <div class="pulso-ahora" style="animation-delay:-2.7s; width:42%; height:42%;"></div>
    <div class="pulso-ahora" style="animation-delay:-5.3s; width:25%; height:25%;"></div>
    <div class="tension" id="tension"></div>
    <div class="destello" id="destello"></div>

    <div class="salto" style="--q1x:calc(var(--L) * -0.33); --q1y:calc(var(--L) * -0.25); --q2x:calc(var(--L) * 0.17); --q2y:calc(var(--L) * -0.33); --q3x:calc(var(--L) * 0.33); --q3y:calc(var(--L) * 0.17); --q4x:calc(var(--L) * -0.17); --q4y:calc(var(--L) * 0.33); animation-delay:0s;"></div>
    <div class="salto" style="--q1x:calc(var(--L) * 0.25); --q1y:calc(var(--L) * -0.17); --q2x:calc(var(--L) * -0.33); --q2y:calc(var(--L) * 0.25); --q3x:calc(var(--L) * -0.25); --q3y:calc(var(--L) * -0.33); --q4x:calc(var(--L) * 0.33); --q4y:calc(var(--L) * -0.25); animation-delay:-12s;"></div>

    <div class="forma f1" style="top:20%; left:20%;"><i class="redonda"></i><i class="cuadrada"></i></div>
    <div class="forma f2" style="top:66%; left:68%;"><i class="redonda"></i><i class="cuadrada"></i></div>
    <div class="forma f3" style="top:28%; left:72%;"><i class="redonda"></i><i class="cuadrada"></i></div>
    <div class="forma f4" style="top:60%; left:22%;"><i class="redonda"></i><i class="cuadrada"></i></div>

    <div class="espontaneo" style="top:22%; left:14%; --rotation:-5deg; animation-delay:-10s;">puro</div>
    <div class="espontaneo" style="top:33%; left:66%; --rotation:3deg; animation-delay:-7s;">instantáneo</div>
    <div class="espontaneo" style="top:68%; left:16%; --rotation:-2deg; animation-delay:-4s;">libre</div>
    <div class="espontaneo" style="top:76%; left:62%; --rotation:4deg; animation-delay:-1s;">natural</div>

    <div class="centro">
      <div class="texto-central">Sin pensar<br>Sin planear<br><br>El acto<br>ocurre</div>
    </div>
  </div>

  <div class="frases" aria-live="off">
    <p class="frase f1">La acción perfecta no se piensa</p>
    <p class="frase f2">Surge del momento como el relámpago</p>
    <p class="frase f3">Sin consultar al pasado<br>ni negociar con el futuro</p>
  </div>

  <div class="hint" id="hint">( toca: la tensión crece · el acto llega solo )</div>

<script>
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const ahora = document.getElementById('ahora');
  const tensionEl = document.getElementById('tension');
  const destello = document.getElementById('destello');
  const hint = document.getElementById('hint');
  let L = ahora.clientWidth;
  addEventListener('resize', () => { L = ahora.clientWidth; });
  // El sonido se declara arriba
  let ctx = null, master, seco, sala, ruidoBuf, cargaFiltro, cargaGain, chispaGain;
  const al = (r) => (Math.random() * 2 - 1) * r;

  /* ---------------- El umbral -----------------------------------------------------------------
     Schurger, Sitt y Dehaene (2012): cuando nada empuja con fuerza a moverse, el instante exacto
     del acto lo deciden en buena parte las fluctuaciones espontáneas de la actividad neuronal, que
     se acumulan y se escapan hasta cruzar un umbral. Es la misma forma que tiene el rayo: la carga
     crece y fluctúa, y la descarga llega cuando llega. Aquí la tensión sube y baja al azar; el
     acto ocurre cuando cruza el umbral, cada cuatro a quince segundos. Al tocar, la tensión crece
     durante unos segundos y el acto llega pronto, pero no en el instante del toque.
  ------------------------------------------------------------------------------------------- */
  const FUGA = 0.5, EMPUJE = 0.38, RUIDO = 0.32, PASO = 0.05;
  let x = 0, urgencia = 0, refractario = 0, toqueReciente = 0;
  function gauss() { return Math.sqrt(-2 * Math.log(1 - Math.random())) * Math.cos(2 * Math.PI * Math.random()); }

  function latido() {
    if (refractario > 0) { refractario -= PASO; }
    else {
      const I = EMPUJE + (urgencia > 0 ? 0.6 : 0);
      x += PASO * (-FUGA * x + I) + RUIDO * Math.sqrt(PASO) * gauss();
      x = Math.max(-0.2, x);
      if (x >= 1) { x = 0; refractario = 1.5; acto(); }
    }
    if (urgencia > 0) urgencia -= PASO;
    if (toqueReciente > 0) toqueReciente -= PASO;
    const v = Math.max(0, Math.min(1, x));
    if (!reduce) {
      tensionEl.style.opacity = (0.08 + 0.72 * v * v).toFixed(3);
      tensionEl.style.transform = `translate(-50%,-50%) scale(${(1.15 - 0.4 * v).toFixed(3)})`;
    }
    if (ctx) {
      const t = ctx.currentTime;
      cargaFiltro.frequency.setTargetAtTime(90 + 320 * v, t, 0.08);
      cargaGain.gain.setTargetAtTime(0.008 + 0.075 * v * v, t, 0.08);
      chispaGain.gain.setTargetAtTime(0.014 * Math.pow(v, 4), t, 0.08);
    }
  }
  if (!reduce) setInterval(latido, PASO * 1000);

  /* ---------------- El acto --------------------------------------------------------------------- */
  function acto() {
    if (ctx) relampago();
    if (reduce) return;
    destello.classList.remove('vivo'); void destello.offsetWidth; destello.classList.add('vivo');
    const giro = Math.random() * 30;
    for (let i = 0; i < 12; i++) rayo(i * 30 + giro, 0.25 * L, '2.2s');
    const o = document.createElement('div'); o.className = 'ola';
    o.style.animationDuration = '4s';
    ahora.appendChild(o); setTimeout(() => o.remove(), 4100);
    for (let i = 0; i < 3; i++) impulso();
    if (toqueReciente > 0 && !ahora.querySelector('.revelacion')) {
      toqueReciente = 0;
      revelacion('EL ACTO\nES PURA\nEXPRESIÓN', 'rgba(150,100,255,0.85)', 5000);
    }
  }

  function rayo(angulo, distancia, dur) {
    const r = document.createElement('div'); r.className = 'rayo';
    r.style.cssText = `--angle:${angulo}deg;--distance:${distancia.toFixed(1)}px;` + (dur ? `animation-duration:${dur};` : '');
    ahora.appendChild(r); setTimeout(() => r.remove(), dur ? parseFloat(dur) * 1000 + 100 : 6100);
  }
  function impulso() {
    const p = document.createElement('div'); p.className = 'impulso';
    const a = Math.random() * Math.PI * 2, d = (0.12 + Math.random() * 0.36) * L;
    p.style.cssText = `--bx:${(Math.cos(a) * d).toFixed(1)}px;--by:${(Math.sin(a) * d).toFixed(1)}px;animation-delay:${(Math.random() * 1.5).toFixed(2)}s;`;
    ahora.appendChild(p); setTimeout(() => p.remove(), 9600);
  }
  function flujos() {
    for (let i = 0; i < 10; i++) setTimeout(() => {
      const p = document.createElement('div'); p.className = 'flujo';
      const a = (i / 10) * Math.PI * 2 + Math.random() * 0.5, d = (0.17 + Math.random() * 0.33) * L;
      p.style.cssText = `--fx:${(Math.cos(a) * d).toFixed(1)}px;--fy:${(Math.sin(a) * d).toFixed(1)}px;animation-delay:${(Math.random() * 4).toFixed(2)}s;`;
      ahora.appendChild(p); setTimeout(() => p.remove(), 16200);
    }, i * 100);
  }
  function palabra() {
    const textos = ['ahora', 'fluir', 'ser', 'actuar', 'presente', 'libre', 'puro', 'directo'];
    const t = document.createElement('div'); t.className = 'espontaneo';
    t.textContent = textos[Math.floor(Math.random() * textos.length)];
    t.style.cssText = `top:${18 + Math.random() * 62}%;left:${12 + Math.random() * 62}%;--rotation:${al(5).toFixed(1)}deg;animation-iteration-count:1;`;
    ahora.appendChild(t); setTimeout(() => t.remove(), 12100);
  }
  let revelandoHasta = null;
  function revelacion(texto, sombra, ms) {
    const v = document.createElement('div'); v.className = 'revelacion';
    v.textContent = texto;
    v.style.setProperty('--sombra', sombra);
    v.style.animationDuration = (ms / 1000) + 's';
    ahora.appendChild(v); setTimeout(() => v.remove(), ms + 100);
    ahora.classList.add('revelando');
    clearTimeout(revelandoHasta); revelandoHasta = setTimeout(() => ahora.classList.remove('revelando'), Math.max(1000, ms - 900));
  }

  if (!reduce) {
    setInterval(impulso, 2200);
    setInterval(() => { const o = document.createElement('div'); o.className = 'ola'; ahora.appendChild(o); setTimeout(() => o.remove(), 7100); }, 4500);
    setInterval(() => rayo(Math.random() * 360, (0.17 + Math.random() * 0.33) * L), 2000);
    setInterval(flujos, 5000);
    setInterval(palabra, 4000);
    for (let i = 0; i < 4; i++) { setTimeout(impulso, i * 800); setTimeout(() => rayo(Math.random() * 360, (0.17 + Math.random() * 0.33) * L), i * 600); }
    flujos();
  }

  /* ---------------- Diseño sonoro --------------------------------------------------------------
     La carga: un rumor grave que se abre y crece con la tensión, y en lo alto un chisporroteo que
     solo se oye cerca del umbral. El acto: un chasquido, una nota clara (siempre distinta, de la
     pentatónica de Mi) y, un instante después, el trueno, porque la luz llega antes que el sonido.
  ------------------------------------------------------------------------------------------- */
  const CLARAS = [554.37, 659.26, 739.99, 830.61, 987.77];
  let ultimaClara = -1;

  function makeReverbIR(ac, seconds = 5, decay = 2.3) {
    const len = Math.floor(ac.sampleRate * seconds);
    const buf = ac.createBuffer(2, len, ac.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    }
    return buf;
  }
  function fuenteRuido(t, dur) {
    const n = ctx.createBufferSource(); n.buffer = ruidoBuf;
    n.start(t, Math.random() * 2); n.stop(t + dur);
    return n;
  }

  function relampago() {
    const t = ctx.currentTime + 0.02;
    const lado = al(0.5);
    // el chasquido
    const p0 = ctx.createStereoPanner(); p0.pan.value = lado; p0.connect(seco); p0.connect(sala);
    const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1500;
    const gc = ctx.createGain(); gc.gain.value = 0;
    fuenteRuido(t, 0.3).connect(hp); hp.connect(gc); gc.connect(p0);
    gc.gain.setValueAtTime(0, t); gc.gain.linearRampToValueAtTime(0.16, t + 0.004); gc.gain.exponentialRampToValueAtTime(0.0005, t + 0.18);
    // la nota clara
    let k; do { k = Math.floor(Math.random() * CLARAS.length); } while (k === ultimaClara);
    ultimaClara = k;
    const f = CLARAS[k];
    [[1, 0.07, 3.6], [2, 0.018, 1.6], [3, 0.007, 0.8]].forEach(([m, v, dec]) => {
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f * m;
      const g = ctx.createGain(); g.gain.value = 0;
      o.connect(g); g.connect(p0);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0002, t + dec);
      o.start(t); o.stop(t + dec + 0.05);
    });
    // el trueno, un poco después y más ancho
    const tt = t + 1.1 + Math.random() * 1.1;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 160; lp.Q.value = 0.6;
    const gt = ctx.createGain(); gt.gain.value = 0;
    const p1 = ctx.createStereoPanner(); p1.pan.value = -lado * 0.6;
    fuenteRuido(tt, 5.5).connect(lp); lp.connect(gt); gt.connect(p1); p1.connect(seco); p1.connect(sala);
    gt.gain.setValueAtTime(0, tt);
    gt.gain.linearRampToValueAtTime(0.32, tt + 0.35);
    gt.gain.setTargetAtTime(0.18, tt + 0.6, 0.3);
    gt.gain.linearRampToValueAtTime(0.26, tt + 1.4 + Math.random() * 0.4);   // un segundo retumbo
    gt.gain.exponentialRampToValueAtTime(0.0006, tt + 5.2);
  }

  function startAudio() {
    if (ctx) return;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
    master = ctx.createGain(); master.gain.value = 0; master.connect(ctx.destination);
    master.gain.setValueAtTime(0, ctx.currentTime);
    master.gain.linearRampToValueAtTime(1.25, ctx.currentTime + 6);
    seco = ctx.createGain(); seco.gain.value = 0.7; seco.connect(master);
    sala = ctx.createGain(); sala.gain.value = 0.45;
    const conv = ctx.createConvolver(); conv.buffer = makeReverbIR(ctx);
    sala.connect(conv); conv.connect(master);
    ruidoBuf = ctx.createBuffer(1, ctx.sampleRate * 4, ctx.sampleRate);
    const d = ruidoBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    // la carga, que suena siempre y sigue a la tensión
    const nc = ctx.createBufferSource(); nc.buffer = ruidoBuf; nc.loop = true;
    cargaFiltro = ctx.createBiquadFilter(); cargaFiltro.type = 'bandpass'; cargaFiltro.frequency.value = 100; cargaFiltro.Q.value = 1.1;
    cargaGain = ctx.createGain(); cargaGain.gain.value = 0.01;
    nc.connect(cargaFiltro); cargaFiltro.connect(cargaGain); cargaGain.connect(seco); cargaGain.connect(sala);
    const nh = ctx.createBufferSource(); nh.buffer = ruidoBuf; nh.loop = true; nh.playbackRate.value = 0.93;
    const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 5200;
    chispaGain = ctx.createGain(); chispaGain.gain.value = 0;
    nh.connect(hp); hp.connect(chispaGain); chispaGain.connect(seco);
    nc.start(); nh.start();
    if (reduce) setInterval(latido, PASO * 1000);            // sin imagen en movimiento, el umbral sigue sonando
  }

  function acordeFirma() {
    const t = ctx.currentTime + 0.02;
    [329.63, 493.88, 659.26].forEach((f, i) => {
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f;
      const g = ctx.createGain(); g.gain.value = 0;
      const p = ctx.createStereoPanner(); p.pan.value = -0.4 + i * 0.4;
      o.connect(g); g.connect(p); p.connect(seco); p.connect(sala);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.03, t + 1.2); g.gain.exponentialRampToValueAtTime(0.0003, t + 7);
      o.start(t); o.stop(t + 7.1);
    });
  }

  /* ---------------- El toque ---------------------------------------------------------------- */
  function toque(cx, cy) {
    urgencia = 4; toqueReciente = 10;
    if (reduce) return;
    const r = ahora.getBoundingClientRect();
    const px = cx - r.left, py = cy - r.top;
    const o = document.createElement('div'); o.className = 'ola';
    o.style.cssText = `left:${px}px;top:${py}px;width:12%;height:12%;animation-duration:3s;`;
    ahora.appendChild(o); setTimeout(() => o.remove(), 3100);
  }
  function revelar() {
    toqueReciente = 0;
    if (ctx) acordeFirma();
    revelacion('LA ESPONTANEIDAD\nES LA FIRMA\nDEL UNIVERSO', 'rgba(255,100,200,0.9)', reduce ? 9000 : 8000);
    if (reduce) return;
    for (let i = 0; i < 5; i++) setTimeout(() => { destello.classList.remove('vivo'); void destello.offsetWidth; destello.classList.add('vivo'); }, i * 500);
  }

  let ultimo = 0;
  window.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.infinito')) return;
    startAudio();
    hint.classList.add('oculto');
    const t = performance.now();
    if (t - ultimo < 380) { ultimo = 0; revelar(); return; }
    ultimo = t;
    toque(e.clientX, e.clientY);
  });

  /* Con el ratón, chispas de impulso por donde pasa */
  let ultimoPaso = 0;
  window.addEventListener('pointermove', (e) => {
    if (reduce || e.pointerType !== 'mouse') return;
    const t = performance.now();
    if (t - ultimoPaso < 220) return;
    ultimoPaso = t;
    const r = ahora.getBoundingClientRect();
    const px = e.clientX - r.left, py = e.clientY - r.top;
    if (px < 0 || py < 0 || px > r.width || py > r.height) return;
    const p = document.createElement('div'); p.className = 'impulso';
    p.style.cssText = `left:${px}px;top:${py}px;--bx:${al(0.05) * L}px;--by:${al(0.05) * L}px;animation-duration:3s;width:6%;height:6%;margin:-3% 0 0 -3%;`;
    ahora.appendChild(p); setTimeout(() => p.remove(), 3100);
  });
</script>
</body>
