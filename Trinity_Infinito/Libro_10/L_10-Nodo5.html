<title>Libro 10 - Nodo 68: El Universo Creándose</title>
<!-- Portal 68. Saneado en noviembre de 2026 sobre el original: la singularidad, la luz del vacío,
     las nebulosas, la espiral, las estrellas que nacen, la materia y la espuma cuántica.
     Las ondas de expansión, que engrosaban su borde al crecer, van en un lienzo y son ahora las
     ondas de sonido del plasma: a medida que el espacio se estira, llegan más espaciadas y se
     enrojecen. Sonido nuevo: la acústica del Big Bang (Mark Whittle). -->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    background: radial-gradient(ellipse at center, #0a0a16 0%, #04040a 55%, #000 80%);
    background-color:#000;
    color:#fff;
    font-family: Georgia, serif;
    overflow:hidden;
    height:100vh; height:100dvh;
    display:flex; align-items:center; justify-content:center;
    cursor:none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    -webkit-user-select:none; user-select:none;
  }

  #ondas { position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; }

  .cabecera {
    position:fixed; left:50%; top:calc(env(safe-area-inset-top, 0px) + 5.5vh);
    transform:translateX(-50%);
    width:max-content; max-width:92vw; text-align:center;
    z-index:5; pointer-events:none;
  }
  .titulo {
    font-size: clamp(17px, 5vw, 31px);
    font-weight:bold;
    letter-spacing: clamp(0.16em, 1.2vw, 0.42em);
    padding-left: clamp(0.16em, 1.2vw, 0.42em);
    line-height:1.45;
    color: rgba(250,246,255,0.92);
    text-shadow: 0 0 30px rgba(150,100,255,0.5);
  }
  .subtitulo {
    margin-top:0.6em;
    font-size: clamp(11px, 2.9vw, 15px);
    letter-spacing:0.3em; padding-left:0.3em; font-style:italic;
    color: rgba(228,222,250,0.5);
  }

  .genesis {
    --L: min(84vw, 52vh, 600px);
    position:relative; z-index:1;
    width:var(--L); height:var(--L);
    margin-top:-6vh;
  }

  .creacion-eterna {
    position:absolute; inset:0;
    background:
      radial-gradient(circle at 20% 30%, rgba(100,80,255,0.09), transparent 55%),
      radial-gradient(circle at 80% 70%, rgba(255,100,200,0.07), transparent 55%);
    animation: creacion 25s ease-in-out infinite;
  }
  @keyframes creacion { 0%,100% { opacity:0.35; } 50% { opacity:0.8; } }

  .luz-vacio {
    position:absolute; left:50%; top:50%;
    width:70%; height:70%;
    border-radius:50%;
    background: radial-gradient(circle, rgba(255,255,255,0.11), rgba(255,255,255,0.03) 40%, transparent 68%);
    animation: luzVacio 15s ease-in-out infinite;
  }
  @keyframes luzVacio {
    0%,100% { transform:translate(-50%,-50%) scale(0.5); opacity:0.25; }
    50%     { transform:translate(-50%,-50%) scale(1.8); opacity:0.5; }
  }

  .singularidad {
    position:absolute; left:50%; top:50%;
    width:20px; height:20px;
    border-radius:50%;
    background: radial-gradient(circle, rgba(255,255,255,1), rgba(150,100,255,0.85));
    box-shadow: 0 0 40px rgba(255,255,255,0.9), 0 0 80px rgba(150,100,255,0.7);
    animation: singular 6s ease-in-out infinite;
    z-index:2;
  }
  @keyframes singular {
    0%,100% { transform:translate(-50%,-50%) scale(1); }
    50%     { transform:translate(-50%,-50%) scale(1.3); }
  }
  .estallido {
    position:absolute; left:50%; top:50%;
    width:40%; height:40%;
    border-radius:50%;
    background: radial-gradient(circle, rgba(255,255,255,0.9), rgba(200,190,255,0.35) 30%, transparent 66%);
    opacity:0;
    transform:translate(-50%,-50%) scale(0);
    pointer-events:none;
    z-index:2;
  }
  .estallido.vivo { animation: estallido 2.4s ease-out forwards; }
  @keyframes estallido {
    0%   { transform:translate(-50%,-50%) scale(0.05); opacity:0; }
    8%   { transform:translate(-50%,-50%) scale(0.5);  opacity:1; }
    100% { transform:translate(-50%,-50%) scale(2.6);  opacity:0; }
  }

  .nebulosa {
    position:absolute; left:50%; top:50%;
    width:44%; height:44%;
    margin:-22% 0 0 -22%;
    border-radius:50%;
    background: radial-gradient(circle, rgba(100,80,255,0.17), rgba(100,80,255,0.05) 45%, transparent 70%);
    opacity:0;
    animation: nebulosa 40s linear infinite;
  }
  @keyframes nebulosa {
    0%   { transform:translate(var(--n1x), var(--n1y)) scale(0.5); opacity:0; }
    20%  { transform:translate(var(--n2x), var(--n2y)) scale(1.2); opacity:0.45; }
    40%  { transform:translate(var(--n3x), var(--n3y)) scale(0.8); opacity:0.32; }
    60%  { transform:translate(var(--n4x), var(--n4y)) scale(1.5); opacity:0.52; }
    80%  { transform:translate(var(--n5x), var(--n5y)) scale(0.7); opacity:0.22; }
    100% { transform:translate(var(--n6x), var(--n6y)) scale(0.5); opacity:0; }
  }

  .espiral {
    position:absolute; left:50%; top:50%;
    width:33%; height:33%;
    opacity:0.32;
    animation: espiral 30s linear infinite;
  }
  @keyframes espiral {
    from { transform:translate(-50%,-50%) rotate(0deg)   scale(0.5); }
    to   { transform:translate(-50%,-50%) rotate(360deg) scale(1.5); }
  }
  .brazo {
    position:absolute; left:50%; top:50%;
    width:50%; height:2px; margin-top:-1px;
    background: linear-gradient(90deg, transparent, rgba(150,100,255,0.6), rgba(100,150,255,0.4), transparent);
    transform-origin: 0 50%;
  }

  .estrella {
    position:absolute; left:50%; top:50%;
    width:4px; height:4px; margin:-2px 0 0 -2px;
    border-radius:50%;
    background: rgba(255,255,255,0.95);
    box-shadow: 0 0 10px rgba(255,255,255,0.8);
    opacity:0;
    animation: estrella 15s ease-out forwards;
  }
  @keyframes estrella {
    0%   { transform:translate(0, 0) scale(0); opacity:0; }
    10%  { opacity:1; }
    50%  { transform:translate(var(--sx), var(--sy)) scale(var(--scale)); opacity:0.9; }
    100% { transform:translate(calc(var(--sx) * 1.5), calc(var(--sy) * 1.5)) scale(calc(var(--scale) * 0.5)); opacity:0; }
  }

  .materia {
    position:absolute; left:50%; top:50%;
    width:6px; height:6px; margin:-3px 0 0 -3px;
    border-radius:50%;
    background: radial-gradient(circle, rgba(255,200,100,0.92), transparent 70%);
    opacity:0;
    animation: materia 20s linear forwards;
  }
  @keyframes materia {
    0%,100% { transform:translate(0, 0) rotate(0deg); opacity:0; }
    10%     { opacity:0.8; }
    50%     { transform:translate(var(--mx), var(--my)) rotate(var(--mr)); opacity:1; }
    90%     { opacity:0.5; }
  }

  .espuma {
    position:absolute;
    width:30%; height:30%; margin:-15% 0 0 -15%;
    border-radius:50%;
    background: radial-gradient(circle, rgba(100,150,255,0.22), rgba(100,150,255,0.06) 45%, transparent 70%);
    opacity:0;
    animation: espuma 10s ease-in-out forwards;
  }
  @keyframes espuma {
    0%,100% { transform:translate(0, 0) scale(0); opacity:0; }
    50%     { transform:translate(var(--fx), var(--fy)) scale(2); opacity:0.5; }
  }

  .texto-central {
    position:absolute; left:50%; top:50%;
    width:92%;
    font-size: clamp(15px, 4.4vw, 24px);
    letter-spacing:0.3em; padding-left:0.3em;
    line-height:1.8;
    text-align:center;
    color: rgba(255,255,255,0.92);
    text-shadow: 0 0 25px rgba(255,255,255,0.5);
    opacity:0;
    animation: central 20s ease-in-out infinite;
    animation-delay:-17s;
    pointer-events:none;
    z-index:3;
  }
  @keyframes central {
    0%,100% { transform:translate(-50%,-50%) scale(0.9); opacity:0; }
    14%,86% { transform:translate(-50%,-50%) scale(1);   opacity:0.8; }
  }

  .cosmica {
    position:absolute;
    font-size: clamp(12px, 3.2vw, 17px);
    letter-spacing:0.3em;
    white-space:nowrap;
    color: rgba(255,255,255,0.65);
    text-shadow: 0 0 15px rgba(150,100,255,0.4);
    opacity:0;
    animation: cosmica 18s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes cosmica {
    0%,100% { transform:translateY(26px) scale(0.85) rotate(var(--rotation)); opacity:0; }
    25%,75% { transform:translateY(0) scale(1) rotate(var(--rotation));       opacity:0.7; }
  }


  /* Mientras habla la revelación, el texto central se retira */
  .centro { position:absolute; inset:0; pointer-events:none; transition: opacity 1.2s ease; z-index:3; }
  .revelando .centro { opacity:0; }

  .revelacion {
    position:absolute; left:50%; top:50%;
    width:max-content; max-width:96%;
    text-align:center;
    white-space:pre-line;
    font-size: clamp(17px, 5vw, 30px);
    line-height:1.55;
    letter-spacing:0.22em; padding-left:0.22em;
    color: rgba(255,255,255,0.95);
    text-shadow: 0 0 34px var(--sombra, rgba(150,100,255,0.85));
    pointer-events:none;
    z-index:6;
    opacity:0;
    animation: revela 6s ease-out forwards;
  }
  @keyframes revela {
    0%   { transform:translate(-50%,-50%) scale(0.85); opacity:0; }
    18%  { transform:translate(-50%,-50%) scale(1);    opacity:1; }
    78%  { transform:translate(-50%,-50%) scale(1);    opacity:1; }
    100% { transform:translate(-50%,-50%) scale(1);    opacity:0; }
  }

  .frases {
    position:fixed; left:50%; z-index:3;
    bottom:calc(env(safe-area-inset-bottom, 0px) + 16vh);
    transform:translateX(-50%);
    width:90vw; max-width:620px; height:3.4em;
    text-align:center;
    pointer-events:none;
  }
  .frase {
    position:absolute; left:0; right:0; bottom:0;
    font-size: clamp(14px, 3.9vw, 19px);
    line-height:1.6;
    letter-spacing:0.06em;
    font-style:italic;
    color: rgba(242,238,252,0.9);
    text-shadow: 0 0 18px rgba(150,100,255,0.35);
    opacity:0;
    animation: frase 30s ease-in-out infinite;
  }
  .frase.f2 { animation-delay:10s; }
  .frase.f3 { animation-delay:20s; }
  @keyframes frase {
    0%     { opacity:0; transform:translateY(6px); }
    4.7%   { opacity:1; transform:translateY(0); }
    29.3%  { opacity:1; transform:translateY(0); }
    33.3%  { opacity:0; transform:translateY(-4px); }
    100%   { opacity:0; transform:translateY(-4px); }
  }

  .hint {
    position:fixed; left:50%; z-index:3;
    bottom:calc(env(safe-area-inset-bottom, 0px) + 50px);
    transform:translateX(-50%);
    width:max-content; max-width:88vw; text-align:center;
    font-size: clamp(12px, 3.2vw, 14px);
    letter-spacing:1px;
    color: rgba(242,238,252,0.88);
    animation: invita 3.4s infinite ease-in-out;
    pointer-events:none;
    transition: opacity 1.4s ease;
  }
  .hint.oculto { animation:none; opacity:0; }
  @keyframes invita { 0%,100% { opacity:0.45; } 50% { opacity:0.95; } }

  .infinito {
    position:fixed;
    bottom:calc(env(safe-area-inset-bottom, 0px) + 14px); right:22px;
    font-size:30px; text-decoration:none;
    color: rgba(205,190,240,0.4);
    transition: color 0.8s ease, text-shadow 0.8s ease;
    z-index:20;
    cursor:pointer;
  }
  .infinito:hover, .infinito:focus-visible { color: rgba(245,242,255,0.95); text-shadow:0 0 18px rgba(170,140,255,0.6); outline:none; }

  @media (max-width: 480px) {
    .frases { bottom:calc(env(safe-area-inset-bottom, 0px) + 16.5vh); height:4.9em; }
  }
  @media (orientation: landscape) and (max-height: 500px) {
    .subtitulo { display:none; }
    .cabecera { top:calc(env(safe-area-inset-top, 0px) + 10px); }
    .genesis { --L: min(56vh, 600px); margin-top:-4vh; }
    .frases { bottom:calc(env(safe-area-inset-bottom, 0px) + 30px); height:3.3em; }
    .frase { font-size:13px; line-height:1.45; }
    .hint { bottom:calc(env(safe-area-inset-bottom, 0px) + 8px); font-size:11px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation:none !important; }
    .texto-central { opacity:0.85; transform:translate(-50%,-50%); }
    .cosmica { opacity:0.6; transform:rotate(var(--rotation)); }
    .singularidad { transform:translate(-50%,-50%); }
    .luz-vacio { opacity:0.35; transform:translate(-50%,-50%); }
    .espiral { transform:translate(-50%,-50%); }
    .nebulosa { display:none; }
    .frases { height:auto; bottom:calc(env(safe-area-inset-bottom, 0px) + 9vh); }
    .frase { position:static; opacity:0.92; margin-bottom:0.35em; font-size: clamp(12px, 3.4vw, 16px); }
    .genesis { margin-top:-12vh; }
    .hint { opacity:0.8; bottom:calc(env(safe-area-inset-bottom, 0px) + 18px); }
    .revelacion { opacity:1; transform:translate(-50%,-50%); }
  }
</style>

<body>
  <canvas id="ondas" aria-hidden="true"></canvas>

    <div class="nebulosa" style="--n1x:calc(var(--L) * 0.25); --n1y:calc(var(--L) * -0.2); --n2x:calc(var(--L) * 0.333); --n2y:calc(var(--L) * -0.083); --n3x:calc(var(--L) * 0.3); --n3y:calc(var(--L) * 0.167); --n4x:calc(var(--L) * 0.083); --n4y:calc(var(--L) * 0.3); --n5x:calc(var(--L) * -0.167); --n5y:calc(var(--L) * 0.25); --n6x:calc(var(--L) * -0.25); --n6y:calc(var(--L) * 0.083); animation-delay:-20s;"></div>

<script>
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const genesis = document.getElementById('genesis');
  const estallido = document.getElementById('estallido');
  const hint = document.getElementById('hint');
  const lienzo = document.getElementById('ondas');
  const g2d = lienzo.getContext('2d');
  let L = genesis.clientWidth, dpr = 1;
  function medir() {
    L = genesis.clientWidth;
    dpr = Math.min(2, window.devicePixelRatio || 1);
    lienzo.width = Math.round(innerWidth * dpr); lienzo.height = Math.round(innerHeight * dpr);
  }
  medir(); addEventListener('resize', medir);
  // El sonido se declara arriba
  let ctx = null, master, seco, sala, ruidoBuf;
  const al = (r) => (Math.random() * 2 - 1) * r;

  /* ---------------- La acústica del Big Bang ---------------------------------------------------
     El Big Bang fue silencioso: no había aire alrededor. Pero durante sus primeros cientos de
     miles de años el universo estuvo lleno de un gas caliente por el que viajaban ondas de
     presión, cuyas huellas quedaron en la radiación de fondo. Mark Whittle las llevó al rango del
     oído: desde el silencio, un grito que desciende y crece hasta un rugido grave y áspero, con
     notas de picos anchos que forman un acorde de tercera mayor y van derivando hacia una menor,
     y al final un siseo. El tono baja porque el espacio se estira, y por la misma razón la luz se
     enrojece. Un ciclo de sesenta segundos: el estallido, el grito, el rugido, el siseo de las
     primeras estrellas y otra vez el silencio. Al tocar, una onda nueva recorre el plasma.
  ------------------------------------------------------------------------------------------- */
  const CICLO = 60;
  const T_VIS = performance.now() / 1000;
  const fase = () => ((performance.now() / 1000 - T_VIS) % CICLO + CICLO) % CICLO;

  function f1(t) {                                   // la fundamental del plasma, que cae al estirarse el espacio
    if (t < 4) return 1760;
    if (t < 30) return 1760 * Math.pow(110 / 1760, (t - 4) / 26);
    if (t < 50) return 110 * Math.pow(82.41 / 110, (t - 30) / 20);
    return 82.41;
  }
  function tercera(t) { return t < 30 ? 1.25 : t < 46 ? 1.25 - 0.05 * (t - 30) / 16 : 1.2; }
  function rugidoAmp(t) {
    if (t < 4) return 0;
    if (t < 30) return Math.pow((t - 4) / 26, 1.5);
    if (t < 44) return 1;
    if (t < 54) return 1 - (t - 44) / 10;
    return 0;
  }
  function sisoAmp(t) { return t < 44 ? 0 : t < 52 ? (t - 44) / 8 : t < 57 ? 1 - (t - 52) / 5 : 0; }
  function asperezaAmp(t) { return t < 28 ? 0 : t < 34 ? (t - 28) / 6 : t < 46 ? 1 : t < 50 ? 1 - (t - 46) / 4 : 0; }

  // El color de la onda según cuándo nace: blanca, azulada, ámbar, roja
  function colorOnda(t) {
    const P = [[0, [255, 255, 255]], [4, [205, 220, 255]], [30, [255, 205, 150]], [50, [240, 130, 110]], [60, [200, 110, 120]]];
    for (let i = 1; i < P.length; i++) if (t <= P[i][0]) {
      const [ta, ca] = P[i - 1], [tb, cb] = P[i], u = (t - ta) / (tb - ta);
      return ca.map((v, k) => Math.round(v + (cb[k] - v) * u));
    }
    return P[P.length - 1][1];
  }

  /* ---------------- Las ondas, en el lienzo ------------------------------------------------- */
  const ondas = [];
  const VIDA = 12;
  function onda(ox, oy, color, fuerza) { ondas.push({ t0: performance.now() / 1000, ox, oy, color, fuerza }); }
  function centro() { const r = genesis.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; }

  let ultimaFase = fase(), proximaOnda = 0;
  function dibujar() {
    const ahora = performance.now() / 1000, t = fase();
    if (t < ultimaFase) genesisVisible();                    // empieza un ciclo
    ultimaFase = t;
    if (t >= 2 && t < 54 && ahora >= proximaOnda) {
      const [cx, cy] = centro();
      onda(cx, cy, colorOnda(t), t > 44 ? 0.5 : 1);
      proximaOnda = ahora + Math.max(1.1, Math.min(3.8, 1.1 * Math.sqrt(1760 / f1(t))));
    }
    g2d.clearRect(0, 0, lienzo.width, lienzo.height);
    for (let i = ondas.length - 1; i >= 0; i--) {
      const o = ondas[i], edad = ahora - o.t0;
      if (edad > VIDA) { ondas.splice(i, 1); continue; }
      const u = edad / VIDA;
      const r = 0.68 * L * (1 - Math.pow(1 - u, 2.2));
      const a = (edad < 1.2 ? edad / 1.2 : 1) * 0.75 * Math.pow(1 - u, 1.3) * o.fuerza;
      g2d.beginPath();
      g2d.arc(o.ox * dpr, o.oy * dpr, Math.max(0.5, r) * dpr, 0, Math.PI * 2);
      g2d.strokeStyle = `rgba(${o.color[0]},${o.color[1]},${o.color[2]},${a.toFixed(3)})`;
      g2d.lineWidth = (1.5 + 3.5 * u) * dpr;
      g2d.stroke();
    }
    requestAnimationFrame(dibujar);
  }

  function genesisVisible() {
    estallido.classList.remove('vivo'); void estallido.offsetWidth; estallido.classList.add('vivo');
    const [cx, cy] = centro();
    for (let i = 0; i < 3; i++) setTimeout(() => onda(cx, cy, [255, 255, 255], 1), i * 260);
  }

  /* ---------------- Las estrellas, la materia, la espuma ----------------------------------------- */
  function estrella(x, y, d, esc, dur, retraso) {
    const s = document.createElement('div'); s.className = 'estrella';
    const a = Math.random() * Math.PI * 2;
    s.style.cssText = `left:${x};top:${y};--sx:${(Math.cos(a) * d).toFixed(1)}px;--sy:${(Math.sin(a) * d).toFixed(1)}px;--scale:${esc.toFixed(2)};animation-duration:${dur}s;animation-delay:${retraso.toFixed(2)}s;`;
    genesis.appendChild(s); setTimeout(() => s.remove(), (dur + retraso) * 1000 + 100);
  }
  function materia(x, y, n, rango, dur) {
    for (let i = 0; i < n; i++) setTimeout(() => {
      const m = document.createElement('div'); m.className = 'materia';
      const a = Math.random() * Math.PI * 2, d = (rango[0] + Math.random() * rango[1]) * L;
      m.style.cssText = `left:${x};top:${y};--mx:${(Math.cos(a) * d).toFixed(1)}px;--my:${(Math.sin(a) * d).toFixed(1)}px;--mr:${al(360).toFixed(0)}deg;animation-duration:${dur}s;animation-delay:${dur > 12 ? (Math.random() * 8).toFixed(2) : 0}s;`;
      genesis.appendChild(m); setTimeout(() => m.remove(), dur * 1000 + 8200);
    }, i * 120);
  }
  function espuma() {
    const f = document.createElement('div'); f.className = 'espuma';
    f.style.cssText = `left:${40 + Math.random() * 20}%;top:${40 + Math.random() * 20}%;--fx:${(al(0.17) * L).toFixed(1)}px;--fy:${(al(0.17) * L).toFixed(1)}px;animation-delay:${(Math.random() * 5).toFixed(2)}s;`;
    genesis.appendChild(f); setTimeout(() => f.remove(), 15100);
  }
  function cosmica() {
    const textos = ['origen', 'big bang', 'inflación', 'evolución', 'galaxia', 'estrella', 'vida', 'consciencia'];
    const c = document.createElement('div'); c.className = 'cosmica';
    c.textContent = textos[Math.floor(Math.random() * textos.length)];
    const dur = 15 + Math.random() * 10;
    c.style.cssText = `top:${18 + Math.random() * 62}%;left:${10 + Math.random() * 62}%;--rotation:${al(5).toFixed(1)}deg;animation-duration:${dur.toFixed(1)}s;animation-iteration-count:1;`;
    genesis.appendChild(c); setTimeout(() => c.remove(), dur * 1000);
  }
  const nacer = () => estrella('50%', '50%', (0.13 + Math.random() * 0.42) * L, 0.5 + Math.random() * 1.5, 15, Math.random() * 3);

  if (!reduce) {
    requestAnimationFrame(dibujar);
    genesisVisible();
    setInterval(() => { nacer(); if (fase() > 44 && fase() < 56) nacer(); }, 800);   // en el siseo, las primeras estrellas
    setInterval(() => materia('50%', '50%', 15, [0.08, 0.33], 20), 6000);
    setInterval(espuma, 3000);
    setInterval(cosmica, 5000);
    for (let i = 0; i < 24; i++) setTimeout(nacer, i * 300);
    materia('50%', '50%', 15, [0.08, 0.33], 20);
    for (let i = 0; i < 5; i++) setTimeout(espuma, i * 800);
  } else {
    // Unas ondas quietas, del blanco al rojo, para leer la imagen sin movimiento
    const [cx, cy] = centro();
    [0.16, 0.28, 0.4, 0.52, 0.64].forEach((r, i) => {
      const c = colorOnda(4 + i * 11);
      g2d.beginPath(); g2d.arc(cx * dpr, cy * dpr, r * L * dpr, 0, Math.PI * 2);
      g2d.strokeStyle = `rgba(${c[0]},${c[1]},${c[2]},0.35)`; g2d.lineWidth = 1.5 * dpr; g2d.stroke();
    });
  }

  /* ---------------- Diseño sonoro ----------------------------------------------------------------
     Ruido que pasa por cuatro filtros de banda ancha, la fundamental, su tercera, su octava y su
     duodécima, con un seno suave en cada una para que se oiga la nota. Las frecuencias, el
     volumen, la aspereza y el siseo se dibujan como curvas para todo el ciclo.
  ------------------------------------------------------------------------------------------- */
  const RAZONES = [t => 1, tercera, t => 2, t => 3];
  const PESOS = [1, 0.7, 0.5, 0.28];
  let picos = [], senos = [], rugido, aspereza, siseo;

  function makeReverbIR(ac, seconds = 6, decay = 2.2) {
    const len = Math.floor(ac.sampleRate * seconds);
    const buf = ac.createBuffer(2, len, ac.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    }
    return buf;
  }

  function curva(fn, desde) {
    const paso = 0.25, n = Math.max(2, Math.ceil((CICLO - desde) / paso));
    const a = new Float32Array(n);
    for (let i = 0; i < n; i++) a[i] = fn(Math.min(CICLO, desde + i * paso));
    return a;
  }
  function programarCiclo(t0, desde) {
    const dur = CICLO - desde - 0.05;
    picos.forEach((bp, k) => {
      const fk = t => f1(t) * RAZONES[k](t);
      bp.frequency.setValueCurveAtTime(curva(fk, desde), t0, dur);
      senos[k].frequency.setValueCurveAtTime(curva(fk, desde), t0, dur);
    });
    rugido.gain.setValueCurveAtTime(curva(rugidoAmp, desde), t0, dur);
    aspereza.gain.setValueCurveAtTime(curva(asperezaAmp, desde), t0, dur);
    siseo.gain.setValueCurveAtTime(curva(t => 0.05 * sisoAmp(t), desde), t0, dur);
  }

  function startAudio() {
    if (ctx) return;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
    master = ctx.createGain(); master.gain.value = 0; master.connect(ctx.destination);
    master.gain.setValueAtTime(0, ctx.currentTime);
    master.gain.linearRampToValueAtTime(0.65, ctx.currentTime + 6);
    seco = ctx.createGain(); seco.gain.value = 0.6; seco.connect(master);
    sala = ctx.createGain(); sala.gain.value = 0.6;
    const conv = ctx.createConvolver(); conv.buffer = makeReverbIR(ctx);
    sala.connect(conv); conv.connect(master);
    ruidoBuf = ctx.createBuffer(2, ctx.sampleRate * 4, ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++) { const d = ruidoBuf.getChannelData(ch); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }

    // El rugido: ruido en cuatro picos, con su aspereza (un temblor rápido e irregular)
    rugido = ctx.createGain(); rugido.gain.value = 0;
    const temblor = ctx.createGain(); temblor.gain.value = 1;
    aspereza = ctx.createGain(); aspereza.gain.value = 0;
    [23, 31.7, 17.3].forEach((f, i) => {
      const o = ctx.createOscillator(); o.frequency.value = f;
      const g = ctx.createGain(); g.gain.value = [0.18, 0.12, 0.1][i];
      o.connect(g); g.connect(aspereza); o.start();
    });
    aspereza.connect(temblor.gain);
    rugido.connect(temblor); temblor.connect(seco); temblor.connect(sala);
    const fuente = ctx.createBufferSource(); fuente.buffer = ruidoBuf; fuente.loop = true;
    PESOS.forEach((w, k) => {
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 7; bp.frequency.value = 1760;
      const g = ctx.createGain(); g.gain.value = 0.9 * w;
      fuente.connect(bp); bp.connect(g); g.connect(rugido);
      const s = ctx.createOscillator(); s.type = 'sine'; s.frequency.value = 1760;
      const gs = ctx.createGain(); gs.gain.value = 0.022 * w;
      s.connect(gs); gs.connect(rugido); s.start();
      picos.push(bp); senos.push(s);
    });
    // El siseo de las primeras estrellas
    const fs = ctx.createBufferSource(); fs.buffer = ruidoBuf; fs.loop = true; fs.playbackRate.value = 0.97;
    const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 3500;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 9000;
    siseo = ctx.createGain(); siseo.gain.value = 0;
    fs.connect(hp); hp.connect(lp); lp.connect(siseo); siseo.connect(seco); siseo.connect(sala);
    fuente.start(); fs.start();

    // El ciclo del sonido es el mismo que el de la imagen
    const desde = fase();
    let t0 = ctx.currentTime + 0.05;
    programarCiclo(t0, desde);
    t0 += CICLO - desde;
    const siguiente = () => { programarCiclo(t0, 0); const espera = (t0 - ctx.currentTime + CICLO - 2) * 1000; t0 += CICLO; setTimeout(siguiente, espera); };
    setTimeout(siguiente, Math.max(0, (t0 - ctx.currentTime - 2) * 1000));
  }

  function ondaSonora() {                             // una compresión que recorre el plasma
    const t = ctx.currentTime + 0.02, f = f1(fase()) * 2;
    const n = ctx.createBufferSource(); n.buffer = ruidoBuf;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 6;
    bp.frequency.setValueAtTime(f * 1.4, t); bp.frequency.exponentialRampToValueAtTime(f * 0.8, t + 2.2);
    const g = ctx.createGain(); g.gain.value = 0;
    n.connect(bp); bp.connect(g); g.connect(seco); g.connect(sala);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.5, t + 0.25); g.gain.exponentialRampToValueAtTime(0.001, t + 2.4);
    n.start(t, Math.random() * 2); n.stop(t + 2.5);
    const o = ctx.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f * 0.7, t + 2.2);
    const go = ctx.createGain(); go.gain.value = 0;
    o.connect(go); go.connect(seco); go.connect(sala);
    go.gain.setValueAtTime(0, t); go.gain.linearRampToValueAtTime(0.03, t + 0.2); go.gain.exponentialRampToValueAtTime(0.0003, t + 2.4);
    o.start(t); o.stop(t + 2.5);
  }
  function acordeEterno() {
    const t = ctx.currentTime + 0.02;
    [110, 137.5, 165, 220].forEach((f, i) => {
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f;
      const g = ctx.createGain(); g.gain.value = 0;
      o.connect(g); g.connect(seco); g.connect(sala);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.035, t + 2); g.gain.exponentialRampToValueAtTime(0.0003, t + 10);
      o.start(t); o.stop(t + 10.1);
    });
  }

  /* ---------------- El toque ---------------------------------------------------------------- */
  let pendiente = null;
  let revelandoHasta = null;
  function revelacion(texto, sombra, x, y, ms) {
    const v = document.createElement('div'); v.className = 'revelacion';
    v.textContent = texto;
    v.style.left = x; v.style.top = y;
    v.style.setProperty('--sombra', sombra);
    v.style.animationDuration = (ms / 1000) + 's';
    genesis.appendChild(v); setTimeout(() => v.remove(), ms + 100);
    genesis.classList.add('revelando');
    clearTimeout(revelandoHasta); revelandoHasta = setTimeout(() => genesis.classList.remove('revelando'), Math.max(1000, ms - 900));
  }
  function toque(cx, cy) {
    if (ctx) ondaSonora();
    if (reduce) return;
    onda(cx, cy, colorOnda(fase()), 1);
    setTimeout(() => onda(cx, cy, colorOnda(fase()), 0.6), 400);
    const r = genesis.getBoundingClientRect();
    const px = ((cx - r.left) / r.width) * 100, py = ((cy - r.top) / r.height) * 100;
    for (let i = 0; i < 30; i++) setTimeout(() => estrella(`${px}%`, `${py}%`, (0.1 + Math.random() * 0.25) * L, 0.8 + Math.random() * 0.8, 8, 0), i * 40);
    materia(`${px}%`, `${py}%`, 15, [0.08, 0.2], 10);
    pendiente = setTimeout(() => revelacion('EL UNIVERSO\nES AUTOPOIESIS', 'rgba(150,100,255,0.85)', `${Math.max(32, Math.min(68, px))}%`, `${Math.max(15, Math.min(85, py))}%`, 6000), 400);
  }
  function revelar() {
    clearTimeout(pendiente);
    if (ctx) acordeEterno();
    revelacion('LA CREACIÓN\nES ETERNA', 'rgba(255,100,200,0.9)', '50%', '50%', reduce ? 9000 : 12000);
    if (reduce) return;
    const [cx, cy] = centro();
    for (let i = 0; i < 8; i++) setTimeout(() => onda(cx, cy, [255, 255, 255], 1), i * 600);
    for (let i = 0; i < 60; i++) setTimeout(() => estrella('50%', '50%', (0.17 + Math.random() * 0.42) * L, 1 + Math.random() * 1.5, 15, 0), i * 50);
  }

  let ultimo = 0;
  window.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.infinito')) return;
    startAudio();
    hint.classList.add('oculto');
    const t = performance.now();
    if (t - ultimo < 380) { ultimo = 0; revelar(); return; }
    ultimo = t;
    toque(e.clientX, e.clientY);
  });
</script>
