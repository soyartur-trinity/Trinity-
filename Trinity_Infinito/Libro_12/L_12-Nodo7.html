<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
<title>Portal 84 · La Comunicación Sin Emisor — Trinity Infinito</title>
<!-- Portal 84. Saneado en noviembre de 2026 con imagen y sonido propios:
     ondas que llegan desde más allá de los bordes, se cruzan en un centro vacío y siguen de largo;
     de la estática surgen tonos que nadie envía. Frases y paradoja del original;
     paleta elevada a blanco azulado sobre índigo. El ∞ lleva al Libro 13. -->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  html, body { height:100%; }
  body {
    background: radial-gradient(ellipse at 50% 45%, #121232 0%, #08081c 55%, #02020a 85%);
    background-color:#02020a;
    color:#fff;
    font-family:'Georgia', serif;
    overflow:hidden;
    height:100vh; height:100dvh;
    cursor:none;
    -webkit-tap-highlight-color: transparent;
  }

  #lienzo { position:fixed; inset:0; display:block; }

  .cabecera {
    position:fixed; left:50%; top:calc(env(safe-area-inset-top, 0px) + 6vh);
    transform:translateX(-50%);
    width:max-content; max-width:90vw; text-align:center;
    z-index:5; pointer-events:none;
  }
  .titulo {
    font-size: clamp(15px, 4.2vw, 22px);
    letter-spacing:0.32em;
    line-height:1.5;
    color: rgba(232,234,255,0.92);
    text-shadow: 0 0 26px rgba(150,150,230,0.5);
  }
  .subtitulo {
    margin-top:0.7em;
    font-size: clamp(11px, 2.8vw, 13px);
    letter-spacing:0.28em; font-style:italic;
    color: rgba(200,202,240,0.5);
  }

  .frases {
    position:fixed; left:50%;
    bottom:calc(env(safe-area-inset-bottom, 0px) + 19vh);
    transform:translateX(-50%);
    width:88vw; max-width:560px; height:4.4em;
    text-align:center;
    pointer-events:none;
  }
  .frase {
    position:absolute; left:0; right:0; top:0;
    font-size: clamp(15px, 4.1vw, 20px);
    line-height:1.55;
    font-style:italic;
    color: rgba(240,242,255,0.93);
    text-shadow: 0 0 18px rgba(150,150,230,0.45);
    opacity:0;
    animation: frase 40s ease-in-out infinite;
    will-change: opacity, transform;
  }
  .frase.f2 { animation-delay:10s; }
  .frase.f3 { animation-delay:20s; }
  .frase.f4 { animation-delay:30s; }
  @keyframes frase {
    0%    { opacity:0; transform:translateY(6px); }
    3.5%  { opacity:1; transform:translateY(0); }
    22%   { opacity:1; transform:translateY(0); }
    25%   { opacity:0; transform:translateY(-4px); }
    100%  { opacity:0; transform:translateY(-4px); }
  }

  .hint {
    position:fixed; left:50%;
    bottom:calc(env(safe-area-inset-bottom, 0px) + 50px);
    transform:translateX(-50%);
    width:max-content; max-width:88vw; text-align:center;
    font-size: clamp(12px, 3.2vw, 14px);
    letter-spacing:1px;
    color: rgba(240,242,255,0.88);
    animation: invita 3.4s infinite ease-in-out;
    pointer-events:none;
    transition: opacity 1.4s ease;
  }
  .hint.oculto { animation:none; opacity:0; }
  @keyframes invita { 0%,100% { opacity:0.45; } 50% { opacity:0.95; } }

  .infinito {
    position:fixed;
    bottom:calc(env(safe-area-inset-bottom, 0px) + 14px); right:22px;
    font-size:30px; text-decoration:none;
    color: rgba(200,202,245,0.42);
    transition: color 0.8s ease, text-shadow 0.8s ease;
    z-index:20;
    cursor:pointer;
  }
  .infinito:hover, .infinito:focus-visible { color: rgba(240,242,255,0.95); text-shadow:0 0 18px rgba(160,160,240,0.65); outline:none; }

  @media (max-width: 480px) {
    .titulo { letter-spacing:0.2em; }
    .frases { bottom:calc(env(safe-area-inset-bottom, 0px) + 15vh); }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation:none !important; }
    .frases { height:auto; bottom:calc(env(safe-area-inset-bottom, 0px) + 11vh); }
    .frase { position:static; opacity:0.92; margin-bottom:0.45em; font-size: clamp(13px, 3.6vw, 18px); }
    .hint { opacity:0.8; bottom:calc(env(safe-area-inset-bottom, 0px) + 24px); }
  }
</style>
</head>
<body>
  <canvas id="lienzo" aria-hidden="true"></canvas>

  <div class="cabecera">
    <div class="titulo">LA COMUNICACIÓN SIN EMISOR</div>
    <div class="subtitulo">Libro 12 - Nodo 7</div>
  </div>

  <div class="frases" aria-live="off">
    <p class="frase f1">El mensaje existe · Nadie lo envía · Pura transmisión</p>
    <p class="frase f2">La información sin fuente · El conocimiento que nadie pronunció</p>
    <p class="frase f3">Comunicación pura sin comunicante</p>
    <p class="frase f4">El universo hablándose a sí mismo</p>
  </div>

  <div class="hint" id="hint">( toca: el mensaje llega a ti )</div>

  <a class="infinito" href="../Libro_13/Libro_13.html" aria-label="Siguiente portal">∞</a>

<script>
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const lienzo = document.getElementById('lienzo');
  const g = lienzo.getContext('2d');
  let W, H, dpr, CX, CY, RMAX;

  /* ---------------- Ondas sin fuente ------------------------------------------------------------
     Las ondas no salen de un centro: llegan desde más allá de los bordes, de todas partes a la vez,
     y se cierran sobre un punto donde no hay nadie. Allí el mensaje existe un instante, como un
     destello, y las ondas siguen de largo hacia afuera. El centro queda vacío.
     Detrás, una nieve de luz muy tenue que titila: la radiación de fondo, el eco más antiguo del
     universo, que llega por igual desde todas las direcciones.
  ------------------------------------------------------------------------------------------- */
  const P = 15, K = 3;                       // cada onda tarda 15 s en llegar y alejarse; tres a la vez
  let nieve = [], llegadas = [];             // llegadas: ondas que convergen hacia donde tocaste

  function medir() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    lienzo.width = Math.round(W * dpr); lienzo.height = Math.round(H * dpr);
    lienzo.style.width = W + 'px'; lienzo.style.height = H + 'px';
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    CX = W / 2; CY = H * 0.45;
    RMAX = Math.hypot(Math.max(CX, W - CX), Math.max(CY, H - CY)) * 1.08;   // más allá de los bordes
    const n = Math.round(Math.min(700, W * H / 900));
    nieve = Array.from({ length: n }, () => ({
      x: Math.random() * W, y: Math.random() * H,
      f: 0.15 + Math.random() * 0.6, ph: Math.random() * Math.PI * 2,
      r: 0.5 + Math.random() * 0.8, a: 0.16 + Math.random() * 0.4,
      c: Math.random() < 0.7 ? '210,214,255' : '170,170,235'
    }));
  }

  // Un frente de onda: no es un círculo perfecto; el espacio lo ondula, y la ondulación se
  // aquieta a medida que la onda se cierra sobre el centro
  function frente(x, y, r, rugo, sem) {
    g.beginPath();
    for (let i = 0; i <= 140; i++) {
      const a = (i / 140) * Math.PI * 2;
      const d = 1 + rugo * (0.5 * Math.sin(3 * a + sem + T * 0.21) + 0.3 * Math.sin(5 * a - sem * 1.7 - T * 0.13) + 0.2 * Math.sin(8 * a + sem * 2.3 + T * 0.31));
      const px = x + Math.cos(a) * r * d, py = y + Math.sin(a) * r * d;
      if (i) g.lineTo(px, py); else g.moveTo(px, py);
    }
  }
  function anillo(x, y, r, alfa, rugo = 0, sem = 0) {
    if (r < 0.5 || alfa < 0.005) return;
    frente(x, y, r, rugo, sem);
    g.strokeStyle = `rgba(140,140,232,${(alfa * 0.2).toFixed(3)})`; g.lineWidth = 8; g.stroke();
    g.strokeStyle = `rgba(228,230,255,${alfa.toFixed(3)})`; g.lineWidth = 1.1; g.stroke();
    // una estela tenue, un poco por detrás del frente
    frente(x, y, r * 1.035 + 3, rugo * 1.1, sem + 0.4);
    g.strokeStyle = `rgba(190,192,250,${(alfa * 0.28).toFixed(3)})`; g.lineWidth = 0.7; g.stroke();
  }

  function destello(x, y, k) {               // el instante en que el mensaje existe, sin nadie que lo emita
    if (k < 0.01) return;
    const rr = 26 + 30 * k;
    const h = g.createRadialGradient(x, y, 0, x, y, rr);
    h.addColorStop(0, `rgba(240,242,255,${(0.55 * k).toFixed(3)})`);
    h.addColorStop(1, 'rgba(200,200,255,0)');
    g.fillStyle = h; g.beginPath(); g.arc(x, y, rr, 0, Math.PI * 2); g.fill();
  }

  // Una onda: u de 0 a 1. En la primera mitad llega y se cierra; en la segunda, sigue de largo.
  function onda(x, y, u, rmax, sem) {
    const lejos = Math.abs(1 - 2 * u);
    const r = rmax * lejos;
    const alfa = u < 0.5 ? 0.08 + 0.62 * Math.pow(u / 0.5, 2.2) : 0.7 * Math.pow(1 - (u - 0.5) / 0.5, 1.6);
    anillo(x, y, r, alfa, 0.07 * lejos, sem);
    destello(x, y, Math.max(0, 1 - Math.abs(u - 0.5) / 0.045));
  }

  let T = 0, ultimo = 0;
  const AFINAR = 0.5 - 6 / P, previa = new Array(K).fill(0);
  function cuadro(ms) {
    const dt = Math.min(0.05, (ms - ultimo) / 1000 || 0.016); ultimo = ms; T += dt;
    g.clearRect(0, 0, W, H);
    // los frentes de este instante: la nieve se enciende a su paso, como un medio que el mensaje atraviesa
    const frentes = [];
    for (let i = 0; i < K; i++) {
      const u = ((T + i * P / K) % P) / P;
      frentes.push([CX, CY, RMAX * Math.abs(1 - 2 * u), u < 0.5 ? Math.pow(u / 0.5, 1.5) : Math.pow(1 - (u - 0.5) / 0.5, 1.6)]);
    }
    for (const l of llegadas) { const u = (T - l.t) / l.dur; if (u < 1) frentes.push([l.x, l.y, l.rmax * Math.abs(1 - 2 * u), 0.8]); }
    for (const s of nieve) {
      const k = 0.5 + 0.5 * Math.sin(T * s.f * 2 * Math.PI + s.ph);
      let paso = 0;
      for (const [fx, fy, fr, fa] of frentes) {
        const d = Math.hypot(s.x - fx, s.y - fy) - fr;
        if (d > -26 && d < 26) paso = Math.max(paso, fa * Math.exp(-(d * d) / 140));
      }
      g.fillStyle = `rgba(${s.c},${Math.min(1, s.a * k * k * k + 0.75 * paso).toFixed(3)})`;
      const t = s.r * (1.6 + paso);
      g.fillRect(s.x, s.y, t, t);
    }
    g.globalCompositeOperation = 'lighter';
    for (let i = 0; i < K; i++) {
      const u = ((T + i * P / K) % P) / P;
      onda(CX, CY, u, RMAX, i * 2.1 + Math.floor((T + i * P / K) / P) * 1.3);
      // seis segundos antes de que la onda se cierre, la estática empieza a afinarse
      if (started && previa[i] < AFINAR && u >= AFINAR) emerger((0.5 - u) * P, 0);
      previa[i] = u;
    }
    for (let j = llegadas.length - 1; j >= 0; j--) {
      const l = llegadas[j], u = (T - l.t) / l.dur;
      if (u >= 1) { llegadas.splice(j, 1); continue; }
      onda(l.x, l.y, u, l.rmax, l.t);
    }
    g.globalCompositeOperation = 'source-over';
    requestAnimationFrame(cuadro);
  }

  function quieto() {
    g.clearRect(0, 0, W, H);
    for (const s of nieve) { g.fillStyle = `rgba(${s.c},${(s.a * 0.6).toFixed(3)})`; g.fillRect(s.x, s.y, s.r * 1.6, s.r * 1.6); }
    [0.2, 0.36, 0.52].forEach((r, i) => anillo(CX, CY, RMAX * r, 0.5 - i * 0.12));
  }

  medir();
  window.addEventListener('resize', () => { medir(); if (reduce) quieto(); });
  if (reduce) quieto();
  else requestAnimationFrame((t) => { ultimo = t; requestAnimationFrame(cuadro); });

  /* ---------------- Diseño sonoro: la estática y lo que emerge de ella -------------------------
     Un siseo suave, como el de los viejos televisores sin señal: una pequeña parte de esa nieve
     era la radiación de fondo cósmico, el eco más antiguo del universo, que nadie envió.
     Mientras cada onda se cierra, una franja de ese mismo ruido se va afinando, cada vez más
     estrecha, hasta volverse un tono; el tono llega cuando la onda alcanza el centro vacío,
     y se disuelve mientras la onda se aleja. Nadie lo emite: sale de la estática.
  ------------------------------------------------------------------------------------------- */
  let started = false, ctx, master, verb, ruidoBuf, nTono = 0;
  const TONOS = [392.0, 523.25, 440.0, 587.33, 349.23, 659.25, 493.88];

  function makeReverbIR(ac, seconds = 5, decay = 2.2) {
    const len = Math.floor(ac.sampleRate * seconds);
    const buf = ac.createBuffer(2, len, ac.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    }
    return buf;
  }

  function startAudio() {
    if (started) return; started = true;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain(); master.gain.value = 0; master.connect(ctx.destination);
    master.gain.linearRampToValueAtTime(0.42, ctx.currentTime + 6);
    const conv = ctx.createConvolver(); conv.buffer = makeReverbIR(ctx);
    verb = ctx.createGain(); verb.gain.value = 0.55; verb.connect(conv); conv.connect(master);

    // la estática: ruido en estéreo, suavizado, con un vaivén lento como el de una señal lejana
    ruidoBuf = ctx.createBuffer(2, ctx.sampleRate * 4, ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++) { const d = ruidoBuf.getChannelData(ch); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    const src = ctx.createBufferSource(); src.buffer = ruidoBuf; src.loop = true;
    const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 900;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 5200;
    const gs = ctx.createGain(); gs.gain.value = 0;
    const lfo = ctx.createOscillator(); lfo.frequency.value = 0.07;
    const prof = ctx.createGain(); prof.gain.value = 0.006; lfo.connect(prof); prof.connect(gs.gain); lfo.start();
    src.connect(hp); hp.connect(lp); lp.connect(gs); gs.connect(master); src.start();
    gs.gain.linearRampToValueAtTime(0.016, ctx.currentTime + 5);

    // los tonos de las ondas que ya están en camino
    if (!reduce) for (let i = 0; i < K; i++) {
      const u = ((T + i * P / K) % P) / P;
      if (u >= AFINAR && u < 0.48) emerger((0.5 - u) * P, 0);
    }
  }

  // Un tono que emerge de la estática y llega a su punto más claro dentro de «falta» segundos
  function emerger(falta, pan) {
    const f = TONOS[nTono++ % TONOS.length];
    const t = ctx.currentTime, pico = t + Math.max(0.3, falta), afina = Math.min(6, Math.max(0.3, falta));
    // la franja de ruido que se afina
    const src = ctx.createBufferSource(); src.buffer = ruidoBuf; src.loop = true;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f;
    bp.Q.setValueAtTime(2, pico - afina); bp.Q.exponentialRampToValueAtTime(90, pico);
    const gb = ctx.createGain(); gb.gain.value = 0;
    gb.gain.setValueAtTime(0, pico - afina); gb.gain.linearRampToValueAtTime(0.16, pico); gb.gain.exponentialRampToValueAtTime(0.001, pico + 3);
    const p = ctx.createStereoPanner(); p.pan.value = pan;
    src.connect(bp); bp.connect(gb); gb.connect(p);
    // el tono mismo
    const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f;
    const o2 = ctx.createOscillator(); o2.type = 'sine'; o2.frequency.value = f * 2.002;
    const go = ctx.createGain(); go.gain.value = 0;
    const go2 = ctx.createGain(); go2.gain.value = 0.18;
    o.connect(go); o2.connect(go2); go2.connect(go); go.connect(p);
    go.gain.setValueAtTime(0, pico - Math.min(1.6, afina)); go.gain.linearRampToValueAtTime(0.06, pico);
    go.gain.exponentialRampToValueAtTime(0.0005, pico + 6.5);
    p.connect(master); p.connect(verb);
    src.start(t); src.stop(pico + 3.2);
    o.start(t); o2.start(t); o.stop(pico + 6.6); o2.stop(pico + 6.6);
  }

  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend(); else ctx.resume();
  });

  const hint = document.getElementById('hint');
  window.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.infinito')) return;
    startAudio();
    if (hint) hint.classList.add('oculto');
    // una onda llega desde todas partes hasta donde tocaste, y sigue de largo
    const dur = 6;
    if (!reduce) llegadas.push({ x: e.clientX, y: e.clientY, t: T, dur, rmax: RMAX * 0.7 });
    emerger(reduce ? 0.6 : dur / 2, Math.max(-0.7, Math.min(0.7, (e.clientX - CX) / W * 1.4)));
  });
</script>
</body>
</html>
