<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Libro 12 - Nodo 6: El Signo Invisible</title>
<!-- Portal 83. Saneado en noviembre de 2026 con imagen y sonido propios:
     un campo de puntos donde, en cualquier instante quieto, no hay nada; una espiral aparece solo
     porque sus puntos se mueven juntos. Entre notas al azar, un motivo escondido que se repite.
     Frases y paradoja del original; paleta elevada a amatista. -->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  html, body { height:100%; }
  body {
    background: radial-gradient(ellipse at 50% 45%, #120c1a 0%, #07050c 55%, #000 82%);
    background-color:#000;
    color:#fff;
    font-family:'Georgia', serif;
    overflow:hidden;
    height:100vh; height:100dvh;
    cursor:none;
    -webkit-tap-highlight-color: transparent;
  }

  #lienzo { position:fixed; inset:0; display:block; }

  .resplandor {
    position:fixed; left:50%; top:45%;
    width:min(96vw, 62vh); height:min(96vw, 62vh);
    margin-left:calc(min(96vw, 62vh) / -2); margin-top:calc(min(96vw, 62vh) / -2);
    border-radius:50%;
    background: radial-gradient(circle, rgba(170,120,230,0.10), transparent 64%);
    animation: respira 20s ease-in-out infinite;
    will-change: transform, opacity;
    pointer-events:none;
  }
  @keyframes respira {
    0%,100% { transform:scale(0.9);  opacity:0.5; }
    50%     { transform:scale(1.1);  opacity:0.95; }
  }

  .cabecera {
    position:fixed; left:50%; top:calc(env(safe-area-inset-top, 0px) + 6vh);
    transform:translateX(-50%);
    width:max-content; max-width:90vw; text-align:center;
    z-index:5; pointer-events:none;
  }
  .titulo {
    font-size: clamp(15px, 4.2vw, 22px);
    letter-spacing:0.32em;
    line-height:1.5;
    color: rgba(240,230,252,0.9);
    text-shadow: 0 0 26px rgba(170,120,230,0.45);
  }
  .subtitulo {
    margin-top:0.7em;
    font-size: clamp(11px, 2.8vw, 13px);
    letter-spacing:0.28em; font-style:italic;
    color: rgba(212,196,236,0.5);
  }

  .frases {
    position:fixed; left:50%;
    bottom:calc(env(safe-area-inset-bottom, 0px) + 19vh);
    transform:translateX(-50%);
    width:88vw; max-width:560px; height:4.4em;
    text-align:center;
    pointer-events:none;
  }
  .frase {
    position:absolute; left:0; right:0; top:0;
    font-size: clamp(15px, 4.1vw, 20px);
    line-height:1.55;
    font-style:italic;
    color: rgba(246,240,254,0.93);
    text-shadow: 0 0 18px rgba(170,120,230,0.42);
    opacity:0;
    animation: frase 40s ease-in-out infinite;
    will-change: opacity, transform;
  }
  .frase.f2 { animation-delay:10s; }
  .frase.f3 { animation-delay:20s; }
  .frase.f4 { animation-delay:30s; }
  @keyframes frase {
    0%    { opacity:0; transform:translateY(6px); }
    3.5%  { opacity:1; transform:translateY(0); }
    22%   { opacity:1; transform:translateY(0); }
    25%   { opacity:0; transform:translateY(-4px); }
    100%  { opacity:0; transform:translateY(-4px); }
  }

  .hint {
    position:fixed; left:50%;
    bottom:calc(env(safe-area-inset-bottom, 0px) + 50px);
    transform:translateX(-50%);
    width:max-content; max-width:88vw; text-align:center;
    font-size: clamp(12px, 3.2vw, 14px);
    letter-spacing:1px;
    color: rgba(246,240,254,0.88);
    animation: invita 3.4s infinite ease-in-out;
    pointer-events:none;
    transition: opacity 1.4s ease;
  }
  .hint.oculto { animation:none; opacity:0; }
  @keyframes invita { 0%,100% { opacity:0.45; } 50% { opacity:0.95; } }

  .infinito {
    position:fixed;
    bottom:calc(env(safe-area-inset-bottom, 0px) + 14px); right:22px;
    font-size:30px; text-decoration:none;
    color: rgba(200,175,240,0.4);
    transition: color 0.8s ease, text-shadow 0.8s ease;
    z-index:20;
    cursor:pointer;
  }
  .infinito:hover, .infinito:focus-visible { color: rgba(245,236,255,0.95); text-shadow:0 0 18px rgba(170,120,230,0.6); outline:none; }

  @media (max-width: 480px) {
    .titulo { letter-spacing:0.22em; }
    .frases { bottom:calc(env(safe-area-inset-bottom, 0px) + 15vh); }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation:none !important; }
    .resplandor { opacity:0.7; }
    .frases { height:auto; bottom:calc(env(safe-area-inset-bottom, 0px) + 11vh); }
    .frase { position:static; opacity:0.92; margin-bottom:0.45em; font-size: clamp(13px, 3.6vw, 18px); }
    .hint { opacity:0.8; bottom:calc(env(safe-area-inset-bottom, 0px) + 24px); }
  }
</style>
</head>
<body>
  <div class="resplandor"></div>
  <canvas id="lienzo" aria-hidden="true"></canvas>

  <div class="cabecera">
    <div class="titulo">EL SIGNO INVISIBLE</div>
    <div class="subtitulo">Libro 12 - Nodo 6</div>
  </div>

  <div class="frases" aria-live="off">
    <p class="frase f1">Lo que apunta sin mostrarse · El significado más allá del símbolo</p>
    <p class="frase f2">Las señales que no se ven pero se sienten</p>
    <p class="frase f3">El código oculto del universo · Los símbolos que comunican sin forma visible</p>
    <p class="frase f4">Signos en el aire</p>
  </div>

  <div class="hint" id="hint">( toca: el signo se revela )</div>

  <a class="infinito" href="L_12-Nodo7.html" aria-label="Siguiente portal">∞</a>

<script>
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const lienzo = document.getElementById('lienzo');
  const g = lienzo.getContext('2d');
  let W, H, dpr, CX, CY, R;

  /* ---------------- El signo que solo existe en movimiento ------------------------------------
     Un campo de puntos de igual brillo, igual tamaño, igual densidad. Detenido en cualquier
     instante, no muestra nada. Pero los puntos que caen dentro de una espiral (la de las
     galaxias y los caracoles) se mueven juntos, girando hacia su centro, mientras los demás
     van cada uno por su lado. El ojo agrupa lo que se mueve en común, y el signo aparece.
     Cada punto vive poco y renace en otro lugar, para que la densidad nunca lo delate.
     La espiral emerge y vuelve a disolverse, como una señal que no se ve pero se siente.
  ------------------------------------------------------------------------------------------- */
  const CRECE = Math.log(3.2) / (2 * Math.PI);      // espiral logarítmica: crece 3,2 veces por vuelta
  const ANCHO = 0.22;                                 // media banda, en escala logarítmica
  const COLORES = ['200,160,240', '176,130,226', '222,196,250', '156,112,212', '236,214,255'];
  let puntos = [];

  function medir() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    lienzo.width = Math.round(W * dpr); lienzo.height = Math.round(H * dpr);
    lienzo.style.width = W + 'px'; lienzo.style.height = H + 'px';
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    CX = W / 2; CY = H * 0.45; R = Math.min(W * 0.45, H * 0.25);
    const n = Math.round(Math.min(1500, Math.max(650, R * R * Math.PI / 125)));
    puntos = Array.from({ length: n }, () => nacer({}, true));
  }

  function nacer(p, inicial) {
    const a = Math.random() * Math.PI * 2, r = R * Math.sqrt(Math.random());
    p.x = CX + Math.cos(a) * r; p.y = CY + Math.sin(a) * r;
    const d = Math.random() * Math.PI * 2;
    p.ux = Math.cos(d); p.uy = Math.sin(d);            // su rumbo propio, si no pertenece al signo
    p.vida = 1.3 + Math.random() * 1.3;
    p.edad = inicial ? Math.random() * p.vida : 0;
    p.c = Math.floor(Math.random() * COLORES.length);
    p.r = 0.8 + Math.random() * 0.9;
    return p;
  }

  // ¿Está el punto dentro de la banda de la espiral? Si está, devuelve la dirección del giro hacia el centro.
  const R0 = () => R * 0.05;
  function enEspiral(x, y, giro) {
    const dx = x - CX, dy = y - CY, r = Math.hypot(dx, dy);
    if (r < R0() * 1.4 || r > R * 0.98) return null;
    const th = Math.atan2(dy, dx) - giro;
    const per = 2 * Math.PI * CRECE;
    let u = (Math.log(r / R0()) - CRECE * th) % per;
    if (u < 0) u += per;
    const d = Math.min(u, per - u);
    if (d > ANCHO) return null;
    // tangente de la espiral, en sentido hacia adentro
    const c = Math.cos(th + giro), s = Math.sin(th + giro);
    let tx = -(CRECE * c - s), ty = -(CRECE * s + c);
    const n = Math.hypot(tx, ty); tx /= n; ty /= n;
    return { tx, ty, borde: 1 - d / ANCHO };
  }

  /* La coherencia: cuánto del signo se mueve en común. Sube, se sostiene y se disuelve. */
  const CICLO = 22;
  let T = 0, ultimo = 0, toque = -99;
  function coherencia(t) {
    const u = ((t % CICLO) + CICLO) % CICLO;
    let c;
    if (u < 4) c = 0;
    else if (u < 9) c = (u - 4) / 5;
    else if (u < 16) c = 1;
    else if (u < 21) c = 1 - (u - 16) / 5;
    else c = 0;
    c = c * c * (3 - 2 * c);
    const tq = Math.max(0, 1 - (t - toque) / 7) * (t > toque ? 1 : 0);
    return Math.max(c, Math.min(1, tq * 1.4));
  }

  function cuadro(ms) {
    const dt = Math.min(0.05, (ms - ultimo) / 1000 || 0.016); ultimo = ms; T += dt;
    const c = coherencia(T);
    const vel = Math.max(16, R * 0.13);
    const giro = 0;
    g.clearRect(0, 0, W, H);
    const lotes = COLORES.map(() => []);
    for (const p of puntos) {
      p.edad += dt;
      if (p.edad > p.vida || Math.hypot(p.x - CX, p.y - CY) > R * 1.02) { nacer(p, false); }
      const e = enEspiral(p.x, p.y, giro);
      let vx = p.ux, vy = p.uy;
      if (e && Math.random() < 1) {
        const k = c;                                  // cuánto sigue al signo
        vx = p.ux * (1 - k) + e.tx * k; vy = p.uy * (1 - k) + e.ty * k;
        const n = Math.hypot(vx, vy) || 1; vx /= n; vy /= n;
      }
      p.x += vx * vel * dt; p.y += vy * vel * dt;
      const f = Math.min(1, p.edad / 0.25, (p.vida - p.edad) / 0.25);
      const borde = Math.min(1, (R * 1.02 - Math.hypot(p.x - CX, p.y - CY)) / (R * 0.12));
      lotes[p.c].push(p.x, p.y, p.r, Math.max(0, f * borde));
    }
    // todos los puntos con el mismo brillo: nada los distingue, salvo su movimiento
    lotes.forEach((l, i) => {
      for (let j = 0; j < l.length; j += 4) {
        g.fillStyle = `rgba(${COLORES[i]},${(0.85 * l[j + 3]).toFixed(3)})`;
        g.beginPath(); g.arc(l[j], l[j + 1], l[j + 2], 0, Math.PI * 2); g.fill();
      }
    });
    sonar(T, c);
    requestAnimationFrame(cuadro);
  }

  function quietoDibujo() {                  // movimiento reducido: el signo, quieto y apenas más claro
    g.clearRect(0, 0, W, H);
    for (const p of puntos) {
      const e = enEspiral(p.x, p.y, 0);
      g.fillStyle = `rgba(${COLORES[p.c]},${e ? 0.95 : 0.32})`;
      g.beginPath(); g.arc(p.x, p.y, p.r * (e ? 1.15 : 1), 0, Math.PI * 2); g.fill();
    }
  }

  medir();
  window.addEventListener('resize', () => { medir(); if (reduce) quietoDibujo(); });
  if (reduce) quietoDibujo();
  else requestAnimationFrame((t) => { ultimo = t; requestAnimationFrame(cuadro); });

  /* ---------------- Diseño sonoro: el motivo escondido ----------------------------------------
     Notas sueltas de vidrio, una por pulso, que parecen elegidas al azar. Escondido entre ellas
     hay un motivo de ocho pulsos con el mismo timbre, el mismo volumen y el mismo lugar incierto
     en el espacio. Cuando la espiral se forma, el motivo ocupa cada vez más pulsos, y el oído,
     que detecta lo que se repite, termina por oírlo. Cuando la espiral se disuelve, el motivo se
     pierde otra vez entre el azar. Al tocar, el signo se revela: el motivo suena completo.
  ------------------------------------------------------------------------------------------- */
  let started = false, ctx, master, verb, pulso = 0, proxima = 0;
  const NOTAS = [293.66, 349.23, 392.0, 440.0, 523.25, 587.33, 698.46, 783.99];
  const MOTIVO = [587.33, 440.0, 523.25, 0, 392.0, 440.0, 293.66, 0];   // 0 = silencio
  const PULSO = 0.36;

  function makeReverbIR(ac, seconds = 4, decay = 2.4) {
    const len = Math.floor(ac.sampleRate * seconds);
    const buf = ac.createBuffer(2, len, ac.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    }
    return buf;
  }

  function vidrio(f, t) {
    const p = ctx.createStereoPanner(); p.pan.value = Math.random() * 1.4 - 0.7;
    p.connect(master); p.connect(verb);
    [[1, 0.05, 1.3], [2.76, 0.016, 0.5], [5.4, 0.006, 0.25]].forEach(([m, a, d]) => {
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f * m;
      const gg = ctx.createGain(); gg.gain.value = 0; o.connect(gg); gg.connect(p);
      gg.gain.setValueAtTime(0, t); gg.gain.linearRampToValueAtTime(a, t + 0.006);
      gg.gain.exponentialRampToValueAtTime(0.0004, t + d);
      o.start(t); o.stop(t + d + 0.05);
    });
  }

  function sonar(t, c) {
    if (!started) return;
    // se programa un poco por delante del reloj de audio
    while (proxima < ctx.currentTime + 0.12) {
      const i = pulso % MOTIVO.length;
      let f;
      if (Math.random() < c) f = MOTIVO[i];                       // el motivo, en su lugar
      else f = Math.random() < 0.3 ? 0 : NOTAS[Math.floor(Math.random() * NOTAS.length)];
      if (f) vidrio(f, proxima);
      proxima += PULSO; pulso++;
    }
  }

  function startAudio() {
    if (started) return; started = true;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain(); master.gain.value = 0; master.connect(ctx.destination);
    master.gain.linearRampToValueAtTime(0.55, ctx.currentTime + 6);
    const conv = ctx.createConvolver(); conv.buffer = makeReverbIR(ctx);
    verb = ctx.createGain(); verb.gain.value = 0.5; verb.connect(conv); conv.connect(master);
    // un fondo de aire amatista, casi inaudible
    [[146.83, 0.01], [220.0, 0.006]].forEach(([f, v]) => {
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f;
      const gg = ctx.createGain(); gg.gain.value = 0; o.connect(gg); gg.connect(master); gg.connect(verb); o.start();
      gg.gain.linearRampToValueAtTime(v, ctx.currentTime + 7);
    });
    proxima = ctx.currentTime + 0.2;
    if (reduce) setInterval(() => sonar(0, 0.25), 100);
  }

  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend(); else { ctx.resume(); proxima = Math.max(proxima, ctx.currentTime + 0.1); }
  });

  const hint = document.getElementById('hint');
  window.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.infinito')) return;
    startAudio();
    if (hint) hint.classList.add('oculto');
    toque = T;
    if (reduce) MOTIVO.forEach((f, i) => { if (f) vidrio(f, ctx.currentTime + 0.05 + i * PULSO); });
  });
</script>
</body>
</html>
