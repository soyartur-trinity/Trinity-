<!-- Portal 82. «Para ver» de Arquitectura del Destino, Libro 4: la ruta no cambia.
     Adaptado al teléfono en octubre de 2026; saneado en noviembre de 2026 con imagen y sonido propios:
     imagen rehecha el 17 de noviembre, sin figura humana: dos triángulos y un círculo que se mueven
     como en la película de Heider y Simmel (1944), donde nadie vio formas y todos vieron intenciones.
     Recorren un alfabeto de gestos: acercarse, acompañar, irrumpir, proteger, retirarse, reunirse,
     descansar, despedirse. Pasos (cada arranque) y respiración.
     Frases, paradoja y paleta (durazno cálido) del original; también su invitación a tocar. -->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  html, body { height:100%; }
  body {
    background: radial-gradient(ellipse at 50% 45%, #140c09 0%, #080505 55%, #000 82%);
    background-color:#000;
    color:#fff;
    font-family:'Georgia', serif;
    overflow:hidden;
    height:100vh; height:100dvh;
    cursor:none;
    -webkit-tap-highlight-color: transparent;
  }

  #lienzo { position:fixed; inset:0; display:block; }

  .resplandor {
    position:fixed; left:50%; top:45%;
    width:min(80vw, 56vh); height:min(80vw, 56vh);
    margin-left:calc(min(80vw, 56vh) / -2); margin-top:calc(min(80vw, 56vh) / -2);
    border-radius:50%;
    background: radial-gradient(circle, rgba(240,190,160,0.10), transparent 66%);
    animation: respira 16s ease-in-out infinite;
    will-change: transform, opacity;
    pointer-events:none;
  }
  @keyframes respira {
    0%,100% { transform:scale(0.9);  opacity:0.55; }
    50%     { transform:scale(1.12); opacity:0.95; }
  }

  .cabecera {
    position:fixed; left:50%; top:calc(env(safe-area-inset-top, 0px) + 6vh);
    transform:translateX(-50%);
    width:max-content; max-width:90vw; text-align:center;
    z-index:5; pointer-events:none;
  }
  .titulo {
    font-size: clamp(15px, 4.2vw, 22px);
    letter-spacing:0.32em;
    line-height:1.5;
    color: rgba(250,234,224,0.9);
    text-shadow: 0 0 26px rgba(240,180,150,0.42);
  }
  .subtitulo {
    margin-top:0.7em;
    font-size: clamp(11px, 2.8vw, 13px);
    letter-spacing:0.28em; font-style:italic;
    color: rgba(232,204,188,0.5);
  }

  .frases {
    position:fixed; left:50%;
    bottom:calc(env(safe-area-inset-bottom, 0px) + 19vh);
    transform:translateX(-50%);
    width:88vw; max-width:560px; height:4.4em;
    text-align:center;
    pointer-events:none;
  }
  .frase {
    position:absolute; left:0; right:0; top:0;
    font-size: clamp(15px, 4.1vw, 20px);
    line-height:1.55;
    font-style:italic;
    color: rgba(252,240,232,0.93);
    text-shadow: 0 0 18px rgba(240,180,150,0.4);
    opacity:0;
    animation: frase 40s ease-in-out infinite;
    will-change: opacity, transform;
  }
  .frase.f2 { animation-delay:10s; }
  .frase.f3 { animation-delay:20s; }
  .frase.f4 { animation-delay:30s; }
  @keyframes frase {
    0%    { opacity:0; transform:translateY(6px); }
    3.5%  { opacity:1; transform:translateY(0); }
    22%   { opacity:1; transform:translateY(0); }
    25%   { opacity:0; transform:translateY(-4px); }
    100%  { opacity:0; transform:translateY(-4px); }
  }

  .hint {
    position:fixed; left:50%;
    bottom:calc(env(safe-area-inset-bottom, 0px) + 50px);
    transform:translateX(-50%);
    width:max-content; max-width:88vw; text-align:center;
    font-size: clamp(12px, 3.2vw, 14px);
    letter-spacing:1px;
    color: rgba(252,240,232,0.88);
    animation: invita 3.4s infinite ease-in-out;
    pointer-events:none;
    transition: opacity 1.4s ease;
  }
  .hint.oculto { animation:none; opacity:0; }
  @keyframes invita { 0%,100% { opacity:0.45; } 50% { opacity:0.95; } }

  .infinito {
    position:fixed;
    bottom:calc(env(safe-area-inset-bottom, 0px) + 14px); right:22px;
    font-size:30px; text-decoration:none;
    color: rgba(235,200,180,0.4);
    transition: color 0.8s ease, text-shadow 0.8s ease;
    z-index:20;
    cursor:pointer;
  }
  .infinito:hover, .infinito:focus-visible { color: rgba(255,240,230,0.95); text-shadow:0 0 18px rgba(240,180,150,0.6); outline:none; }

  @media (max-width: 480px) {
    .titulo { letter-spacing:0.22em; }
    .frases { bottom:calc(env(safe-area-inset-bottom, 0px) + 15vh); }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation:none !important; }
    .resplandor { opacity:0.7; }
    .frases { height:auto; bottom:calc(env(safe-area-inset-bottom, 0px) + 11vh); }
    .frase { position:static; opacity:0.92; margin-bottom:0.45em; font-size: clamp(13px, 3.6vw, 18px); }
    .hint { opacity:0.8; bottom:calc(env(safe-area-inset-bottom, 0px) + 24px); }

<body>
  <div class="resplandor"></div>
  <canvas id="lienzo" aria-hidden="true"></canvas>

  <div class="cabecera">
    <div class="titulo">EL LENGUAJE DEL CUERPO</div>
    <div class="subtitulo">Libro 12 - Nodo 5</div>
  </div>

  <div class="frases" aria-live="off">
    <p class="frase f1">Cada postura es un verbo · Cada gesto una frase</p>
    <p class="frase f2">El cuerpo dice verdades</p>
    <p class="frase f3">La gramática corporal · El alfabeto de posturas y movimientos</p>
    <p class="frase f4">Lo que el cuerpo sabe decir sin recurrir a las palabras</p>
  </div>

  <div class="hint" id="hint">( toca: el cuerpo responde )</div>

  <a class="infinito" href="L_12-Nodo6.html" title="Siguiente portal" aria-label="Siguiente portal">∞</a>

<script>
  const quieto = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const lienzo = document.getElementById('lienzo');
  const g = lienzo.getContext('2d');
  let W, H, dpr, CX, CY, S;

  /* ---------------- Tres figuras que hablan con el cuerpo -------------------------------------
     En 1944, Fritz Heider y Marianne Simmel mostraron una película breve: dos triángulos y un
     círculo que se mueven alrededor de un rectángulo. Casi nadie describió figuras geométricas;
     contaron una historia, con miedo, persecución, protección y afecto. El sentido no estaba en la
     forma sino en el movimiento: cuándo una figura arranca sola, cuándo duda, cuándo se acerca o
     huye, cuándo se queda. El cuerpo dice verdades aunque no tenga forma de cuerpo.
     Aquí, un triángulo grande, uno pequeño y un círculo recorren un alfabeto de gestos, y cada uno
     es un verbo: acercarse, acompañar, irrumpir, proteger, retirarse, reunirse, descansar,
     despedirse. Cada arranque es un paso; la respiración se hace honda cuando están juntos.
  ------------------------------------------------------------------------------------------- */
  const COLOR = { A: [232, 150, 112], B: [250, 198, 168], C: [255, 228, 212] };
  const INICIO = { A: [0.3, 0.26], B: [-0.25, 0.1], C: [0.18, -0.22] };
  const AX = 0.45, AY = 0.4;                     // el escenario, en proporción a la escena

  function figura(nombre, tam, giro) {
    return { nombre, tam, giro, x: INICIO[nombre][0], y: INICIO[nombre][1], vx: 0, vy: 0,
             rumbo: nombre === 'A' ? 0.6 : 0, quieta: true, golpe: -9 };
  }
  const F = { A: figura('A', 0.17, 2.4), B: figura('B', 0.105, 3.4), C: figura('C', 0.045, 0) };
  const RADIO = { A: 0.085, B: 0.048, C: 0.045 };   // nadie atraviesa a nadie
  const pos = (f) => [f.x, f.y];
  const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
  const hacia = (de, a, d) => { const l = dist(de, a) || 1; return [de[0] + (a[0] - de[0]) / l * d, de[1] + (a[1] - de[1]) / l * d]; };
  const medio = () => [(F.B.x + F.C.x) / 2, (F.B.y + F.C.y) / 2];
  const suave = (a, b, u) => { const k = Math.max(0, Math.min(1, (u - a) / (b - a))); return k * k * (3 - 2 * k); };
  const LEJOS = [0.62, 0.52];                    // hacia donde mira el grande cuando se aparta

  // Cada escena da a cada figura un destino, una rapidez y, si hace falta, hacia dónde mirar.
  const ESCENAS = [
    { dur: 9, verbo: 'acercarse', orden(t, e) {
        const b = t > 5.5 ? hacia(INICIO.B, pos(F.C), 0.03) : INICIO.B;
        return {
          C: { p: hacia(pos(F.B), pos(F.C), 0.09), v: 0.11, duda: true },
          B: { p: b, v: 0.05, mira: pos(F.C) },
          A: { p: INICIO.A, v: 0.05, mira: LEJOS } };
    } },
    { dur: 9, verbo: 'acompañar', ritmo: 1.15, orden(t, e) {
        if (e.th0 === undefined) e.th0 = Math.atan2(F.B.y, F.B.x);
        const th = e.th0 + 0.33 * t + 0.28, R = 0.2;
        const v = 0.1 * (0.8 + 0.2 * Math.sin(2 * Math.PI * t / 1.15));
        return {
          B: { p: [R * Math.cos(th), R * Math.sin(th)], v },
          C: { p: [(R + 0.07) * Math.cos(th - 0.12), (R + 0.07) * Math.sin(th - 0.12)], v },
          A: { p: INICIO.A, v: 0.04, mira: t > 5 ? medio() : LEJOS } };
    } },
    { dur: 6, verbo: 'irrumpir', orden(t, e) {
        const m = medio();
        const a = t < 0.8 ? { p: hacia(pos(F.A), m, -0.03), v: 0.05, mira: m }
                : t < 2.6 ? { p: m, v: 0.42 }
                : { p: pos(F.C), v: 0.3 };
        return {
          A: a,
          B: t > 0.9 ? { p: [-0.38, -0.3], v: 0.32 } : { p: pos(F.B), v: 0, mira: pos(F.A) },
          C: t > 1.05 ? { p: [-0.36, 0.3], v: 0.33 } : { p: pos(F.C), v: 0 } };
    } },
    { dur: 8, verbo: 'proteger', orden(t, e) {
        const c = [-0.36 + 0.004 * Math.sin(t * 41), 0.3 + 0.003 * Math.sin(t * 37)];   // tiembla
        return {
          C: { p: c, v: 0.06 },
          B: { p: hacia(c, pos(F.A), 0.13), v: 0.26, mira: pos(F.A) },
          A: { p: hacia(c, pos(F.A), 0.3 + 0.05 * Math.sin(2 * Math.PI * t / 1.7)), v: 0.2, mira: pos(F.B) } };
    } },
    { dur: 6, verbo: 'retirarse', orden(t, e) {
        return {
          A: { p: INICIO.A, v: 0.06, mira: dist(pos(F.A), INICIO.A) < 0.03 ? LEJOS : null },
          B: { p: pos(F.B), v: 0, mira: t < 3 ? pos(F.A) : pos(F.C) },
          C: { p: [-0.36, 0.3], v: 0.04 } };
    } },
    { dur: 8, verbo: 'reunirse', orden(t, e) {
        if (t < 4) return {
          B: { p: hacia(pos(F.C), pos(F.B), 0.095), v: 0.12, mira: pos(F.C) },
          C: { p: hacia(pos(F.C), pos(F.B), 0.012), v: 0.04 },
          A: { p: INICIO.A, v: 0.03, mira: LEJOS } };
        if (!e.m) { e.m = medio(); e.f0 = Math.atan2(F.B.y - e.m[1], F.B.x - e.m[0]); }
        const f = e.f0 + 0.7 * (t - 4), r = 0.048;
        return {
          B: { p: [e.m[0] + r * Math.cos(f), e.m[1] + r * Math.sin(f)], v: 0.15, mira: pos(F.C) },
          C: { p: [e.m[0] - r * Math.cos(f), e.m[1] - r * Math.sin(f)], v: 0.15 },
          A: { p: INICIO.A, v: 0.03, mira: LEJOS } };
    } },
    { dur: 9, verbo: 'descansar', respira: 1, orden(t, e) {
        return {
          B: { p: [-0.07, 0.06], v: 0.04, mira: pos(F.C) },
          C: { p: [-0.165, 0.07], v: 0.04 },
          A: { p: INICIO.A, v: 0.03, mira: LEJOS } };
    } },
    { dur: 8, verbo: 'despedirse', orden(t, e) {
        return {
          C: t > 1 ? { p: INICIO.C, v: 0.085, duda: t < 3 } : { p: pos(F.C), v: 0 },
          B: { p: t > 3 ? INICIO.B : pos(F.B), v: 0.05, mira: pos(F.C) },
          A: { p: INICIO.A, v: 0.03, mira: LEJOS } };
    } }
  ];
  const CICLO = ESCENAS.reduce((a, e) => a + e.dur, 0);

  function medir() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    lienzo.width = Math.round(W * dpr); lienzo.height = Math.round(H * dpr);
    lienzo.style.width = W + 'px'; lienzo.style.height = H + 'px';
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    S = Math.min(W * 0.86, H * 0.46, 560);
    CX = W / 2; CY = H * 0.45;
  }

  // la duda: avanza un poco, se detiene, vuelve a avanzar
  const duda = (t) => { const u = t % 1.8; return suave(0, 0.15, u) * (1 - suave(0.95, 1.1, u)); };

  function mover(f, o, dt) {
    const v = o.v * (o.duda ? duda(T) : 1);
    const dx = o.p[0] - f.x, dy = o.p[1] - f.y, d = Math.hypot(dx, dy);
    const rap = d > 1e-4 ? v * Math.min(1, d / 0.07) : 0;
    const qx = (d > 1e-4 ? dx / d * rap : 0) - f.vx, qy = (d > 1e-4 ? dy / d * rap : 0) - f.vy;
    const q = Math.hypot(qx, qy), lim = (f.nombre === 'A' ? 1.5 : 1.9) * dt, k = q > lim ? lim / q : 1;
    f.vx += qx * k; f.vy += qy * k;
    f.x = Math.max(-AX, Math.min(AX, f.x + f.vx * dt));
    f.y = Math.max(-AY, Math.min(AY, f.y + f.vy * dt));
    const r = Math.hypot(f.vx, f.vy);
    const mira = o.mira ? Math.atan2(o.mira[1] - f.y, o.mira[0] - f.x) : r > 0.012 ? Math.atan2(f.vy, f.vx) : null;
    if (mira !== null && f.giro) {
      const da = Math.atan2(Math.sin(mira - f.rumbo), Math.cos(mira - f.rumbo));
      f.rumbo += Math.max(-f.giro * dt, Math.min(f.giro * dt, da));
    }
    // un arranque propio, sin que nada lo empuje, se ve vivo: es un paso
    if (f.quieta && r > 0.035) { f.quieta = false; if (T - f.golpe > 0.35) { f.golpe = T; paso(f, Math.min(1, 0.35 + rap * 2)); } }
    else if (!f.quieta && r < 0.012) f.quieta = true;
  }

  function separar() {
    const L = [F.A, F.B, F.C];
    for (let i = 0; i < 3; i++) for (let j = i + 1; j < 3; j++) {
      const a = L[i], b = L[j], dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1e-6;
      const m = RADIO[a.nombre] + RADIO[b.nombre];
      if (d < m) { const k = (m - d) / d / 2; a.x -= dx * k; a.y -= dy * k; b.x += dx * k; b.y += dy * k; }
    }
  }

  function dibujar(escala) {
    g.clearRect(0, 0, W, H);
    g.globalCompositeOperation = 'lighter';
    for (const f of [F.A, F.B, F.C]) {
      const X = CX + f.x * S, Y = CY + f.y * S, col = COLOR[f.nombre];
      const L = f.tam * S * (f.nombre === 'A' ? 1 : escala);
      const h = g.createRadialGradient(X, Y, 0, X, Y, L * 1.6);
      h.addColorStop(0, `rgba(${col},0.16)`); h.addColorStop(1, `rgba(${col},0)`);
      g.fillStyle = h; g.beginPath(); g.arc(X, Y, L * 1.6, 0, Math.PI * 2); g.fill();
      g.beginPath();
      if (f.nombre === 'C') g.arc(X, Y, L, 0, Math.PI * 2);
      else {
        const c = Math.cos(f.rumbo), s = Math.sin(f.rumbo), b = 0.36 * L;
        g.moveTo(X + c * L * 0.62, Y + s * L * 0.62);
        g.lineTo(X - c * L * 0.38 - s * b, Y - s * L * 0.38 + c * b);
        g.lineTo(X - c * L * 0.38 + s * b, Y - s * L * 0.38 - c * b);
        g.closePath();
      }
      g.fillStyle = `rgba(${col},0.1)`; g.fill();
      g.strokeStyle = `rgba(${col},0.92)`; g.lineWidth = Math.max(1.2, S / 300); g.lineJoin = 'round'; g.stroke();
    }
    g.globalCompositeOperation = 'source-over';
  }

  /* ---------------- El tiempo: escenas, respiración y la respuesta al toque ------------------ */
  let T = 0, ultimo = 0, n = 0, tEsc = 0, estado = {}, ritmoPrev = 0, alterna = 0;
  let resp = 0, tension = 0, respira = 0, toque = null;

  function cuadro(ms) {
    const dt = Math.min(0.05, (ms - ultimo) / 1000 || 0.016); ultimo = ms; T += dt; tEsc += dt;
    if (tEsc >= ESCENAS[n].dur) { tEsc -= ESCENAS[n].dur; n = (n + 1) % ESCENAS.length; estado = {}; ritmoPrev = 0; }
    const esc = ESCENAS[n], ord = esc.orden(tEsc, estado);
    if (toque && T < toque.hasta) ord[toque.f.nombre] = { p: toque.p, v: 0.25, mira: toque.mira };
    for (const k of ['A', 'B', 'C']) mover(F[k], ord[k], dt);
    separar();
    // caminar juntos: pasos alternados, uno de cada uno
    if (esc.ritmo) { const r = Math.floor(tEsc / esc.ritmo); if (r !== ritmoPrev) { ritmoPrev = r; paso(alterna++ % 2 ? F.B : F.C, 0.45); } }
    // la respiración: honda cuando los pequeños están juntos y en calma; corta cuando el grande irrumpe
    const m = medio();
    tension += (Math.max(0, Math.min(1, 1 - dist(pos(F.A), m) / 0.35)) - tension) * Math.min(1, dt * 1.5);
    respira += ((esc.respira || (esc.verbo === 'reunirse' && tEsc > 4 ? 0.5 : 0)) - respira) * Math.min(1, dt * 0.8);
    resp += 2 * Math.PI * dt / (5.2 - 2.4 * tension);
    const ciclo = 0.5 - 0.5 * Math.cos(resp);
    dibujar(1 + 0.07 * (ciclo - 0.5) * 2 * respira);
    sonar(ciclo, dist(pos(F.B), pos(F.C)));
    requestAnimationFrame(cuadro);
  }

  function quieta() {                            // los dos pequeños juntos, el grande aparte y de espaldas
    F.B.x = -0.06; F.B.y = 0.04; F.B.rumbo = Math.atan2(0.01, -0.1);
    F.C.x = -0.16; F.C.y = 0.05;
    F.A.x = 0.3; F.A.y = 0.24; F.A.rumbo = 0.6;
    dibujar(1);
  }

  medir();
  window.addEventListener('resize', () => { medir(); if (quieto) quieta(); });
  if (quieto) quieta();
  else requestAnimationFrame((t) => { ultimo = t; requestAnimationFrame(cuadro); });

  /* ---------------- Diseño sonoro: pasos y respiración ----------------------------------------
     Cada vez que una figura arranca sola, suena un paso: un golpe suave y grave, del lado donde
     está (más hondo el del grande, más claro el del círculo); cuando los pequeños caminan juntos,
     sus pasos se alternan. La respiración es un aire filtrado que sube y baja: se hace honda
     cuando los pequeños están juntos y en calma, y corta y rápida cuando el grande irrumpe.
     Debajo, un murmullo tibio. Al tocar, la figura más cercana responde con un sonido cálido.
  ------------------------------------------------------------------------------------------- */
  let started = false, ctx, master, verb, aire, aireF;

  function makeReverbIR(ac, seconds = 2.8, decay = 2.8) {
    const len = Math.floor(ac.sampleRate * seconds);
    const buf = ac.createBuffer(2, len, ac.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    }
    return buf;
  }
  function ruido(ac, seg) {
    const b = ac.createBuffer(1, Math.floor(ac.sampleRate * seg), ac.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return b;
  }

  function startAudio() {
    if (started) return; started = true;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain(); master.gain.value = 0; master.connect(ctx.destination);
    master.gain.linearRampToValueAtTime(0.55, ctx.currentTime + 6);
    const conv = ctx.createConvolver(); conv.buffer = makeReverbIR(ctx);
    verb = ctx.createGain(); verb.gain.value = 0.35; verb.connect(conv); conv.connect(master);

    // respiración
    const src = ctx.createBufferSource(); src.buffer = ruido(ctx, 3); src.loop = true;
    aireF = ctx.createBiquadFilter(); aireF.type = 'bandpass'; aireF.frequency.value = 700; aireF.Q.value = 0.9;
    aire = ctx.createGain(); aire.gain.value = 0;
    src.connect(aireF); aireF.connect(aire); aire.connect(master); aire.connect(verb); src.start();

    // el murmullo tibio del cuerpo
    [[98.0, 0.014], [146.83, 0.009], [196.0, 0.004]].forEach(([f, v]) => {
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f;
      const gg = ctx.createGain(); gg.gain.value = 0; o.connect(gg); gg.connect(master); gg.connect(verb); o.start();
      gg.gain.linearRampToValueAtTime(v, ctx.currentTime + 7);
    });
  }

  function paso(f, fuerza) {
    if (!started) return;
    const t = ctx.currentTime + 0.01;
    const pan = Math.max(-0.7, Math.min(0.7, f.x / AX * 0.7));
    const tono = f.nombre === 'A' ? 0.8 : f.nombre === 'C' ? 1.3 : 1;
    const n = ctx.createBufferSource(); n.buffer = ruido(ctx, 0.12);
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 340;
    const gn = ctx.createGain(); gn.gain.value = 0;
    const p = ctx.createStereoPanner(); p.pan.value = pan;
    n.connect(lp); lp.connect(gn); gn.connect(p);
    gn.gain.setValueAtTime(0, t); gn.gain.linearRampToValueAtTime(0.28 * fuerza, t + 0.008); gn.gain.exponentialRampToValueAtTime(0.001, t + 0.11);
    const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(92 * tono, t); o.frequency.exponentialRampToValueAtTime(52 * tono, t + 0.12);
    const go = ctx.createGain(); go.gain.value = 0; o.connect(go); go.connect(p);
    go.gain.setValueAtTime(0, t); go.gain.linearRampToValueAtTime(0.16 * fuerza, t + 0.006); go.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
    p.connect(master); p.connect(verb);
    n.start(t); n.stop(t + 0.13); o.start(t); o.stop(t + 0.18);
  }

  function sonar(ciclo, separacion) {
    if (!started) return;
    // más honda cuanto más juntos y en calma están los pequeños
    const juntos = Math.max(0, Math.min(1, 1 - separacion / 0.4));
    const hondura = 0.3 + 0.7 * juntos * (1 - tension);
    const now = ctx.currentTime;
    aire.gain.setTargetAtTime(0.012 + 0.05 * ciclo * hondura, now, 0.25);
    aireF.frequency.setTargetAtTime(500 + 700 * ciclo, now, 0.3);
  }

  function responde(pan) {
    const t = ctx.currentTime + 0.01;
    [[196.0, 0.05], [293.66, 0.03], [392.0, 0.012]].forEach(([f, v]) => {
      const o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = f;
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900;
      const gg = ctx.createGain(); gg.gain.value = 0;
      const pp = ctx.createStereoPanner(); pp.pan.value = pan;
      o.connect(lp); lp.connect(gg); gg.connect(pp); pp.connect(master); pp.connect(verb);
      gg.gain.setValueAtTime(0, t); gg.gain.linearRampToValueAtTime(v, t + 0.25); gg.gain.exponentialRampToValueAtTime(0.0006, t + 2.4);
      o.start(t); o.stop(t + 2.5);
    });
  }

  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend(); else ctx.resume();
  });

  const hint = document.getElementById('hint');
  window.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.infinito')) return;
    startAudio();
    if (hint) hint.classList.add('oculto');
    // la figura más cercana se vuelve hacia ti y da un paso
    const p = [(e.clientX - CX) / S, (e.clientY - CY) / S];
    if (!quieto) {
      const f = [F.A, F.B, F.C].reduce((a, b) => dist(pos(a), p) < dist(pos(b), p) ? a : b);
      toque = { f, p: hacia(pos(f), p, 0.07), mira: p, hasta: T + 1.8 };
    }
    responde(Math.max(-0.6, Math.min(0.6, (e.clientX - CX) / W)));
  });
</script>
</body>
</html>
