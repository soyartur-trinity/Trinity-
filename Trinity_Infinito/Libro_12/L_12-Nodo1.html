<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Libro 12 - Nodo 1: El Silencio Elocuente</title>
<!-- Portal 78. Saneado en noviembre de 2026 con imagen y sonido propios:
     dos perfiles enfrentados y, entre ellos, la copa que forma el silencio (figura y fondo de Rubin).
     Frases, paradoja, paleta (elevada a plata) y símbolo (· · ·) del original. -->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  html, body { height:100%; }
  body {
    background: radial-gradient(ellipse at center, #0d0e15 0%, #050508 55%, #000 82%);
    background-color:#000;
    color:#fff;
    font-family:'Georgia', serif;
    overflow:hidden;
    height:100vh; height:100dvh;
    display:flex; align-items:center; justify-content:center;
    cursor:none;
    -webkit-tap-highlight-color: transparent;
  }

  /* Título y subtítulo en un mismo bloque: si el título ocupa dos líneas, nada se pisa */
  .cabecera {
    position:fixed; left:50%; top:calc(env(safe-area-inset-top, 0px) + 6vh);
    transform:translateX(-50%);
    width:max-content; max-width:90vw; text-align:center;
    z-index:5; pointer-events:none;
  }
  .titulo {
    font-size: clamp(15px, 4.2vw, 22px);
    letter-spacing:0.32em;
    line-height:1.5;
    color: rgba(228,231,242,0.9);
    text-shadow: 0 0 26px rgba(190,195,230,0.42);
  }
  .subtitulo {
    margin-top:0.7em;
    font-size: clamp(11px, 2.8vw, 13px);
    letter-spacing:0.28em; font-style:italic;
    color: rgba(200,203,226,0.5);
  }

  /* El campo: la copa y los dos rostros, en proporción a la pantalla */
  .campo {
    position:relative;
    height:min(52vh, 560px);
    aspect-ratio:3 / 4;
    max-width:86vw;
    margin-top:-5vh;
  }
  .campo svg { display:block; width:100%; height:100%; overflow:visible; }

  .resplandor {
    position:absolute; inset:6%;
    border-radius:50%;
    background: radial-gradient(circle, rgba(200,205,235,0.10), transparent 66%);
    animation: respira 19s ease-in-out infinite;
    will-change: transform, opacity;
  }
  @keyframes respira {
    0%,100% { transform:scale(0.9);  opacity:0.5; }
    50%     { transform:scale(1.14); opacity:0.9; }
  }

  /* La conversación dura 24 s: hablan los rostros, después habla el silencio */
  .rostros { animation: rostros 24s ease-in-out infinite; }
  @keyframes rostros {
    0%,30%  { opacity:0.95; }
    46%,84% { opacity:0.2; }
    100%    { opacity:0.95; }
  }
  .copa { animation: copa 24s ease-in-out infinite; }
  @keyframes copa {
    0%,30%  { opacity:0.16; }
    50%,82% { opacity:1; }
    100%    { opacity:0.16; }
  }

  .alma {
    transform-box: fill-box; transform-origin: center;
    animation: alma 11s ease-in-out infinite;
  }
  @keyframes alma {
    0%,100% { transform:scale(0.82); opacity:0.55; }
    50%     { transform:scale(1.1);  opacity:1; }
  }

  /* El eco de la sala: anillos muy tenues que se abren desde la copa cuando las voces callan */
  .eco {
    fill:none; stroke:rgba(196,200,236,0.5); stroke-width:0.8;
    transform-box: fill-box; transform-origin: center;
    opacity:0;
    animation: eco 24s ease-out infinite;
  }
  @keyframes eco {
    0%, 22% { transform:scale(0.45); opacity:0; }
    30%     { opacity:0.38; }
    62%     { transform:scale(1.35); opacity:0; }
    100%    { transform:scale(1.35); opacity:0; }
  }

  /* El borde es uno solo: pertenece a la vez a los rostros y a la copa */
  .halo  { fill:none; stroke:rgba(200,204,236,0.12); stroke-width:6; }
  .linea { fill:none; stroke:rgba(230,233,246,0.8); stroke-width:1.15; }
  .bordes { animation: bordes 13s ease-in-out infinite; }
  @keyframes bordes {
    0%,100% { opacity:0.7; }
    50%     { opacity:1; }
  }

  /* Lo que se eleva en la copa mientras nadie habla */
  .mota {
    fill: rgba(240,242,252,0.95);
    opacity:0;
    animation: mota 17s linear infinite;
  }
  @keyframes mota {
    0%   { transform:translate(0, 0);         opacity:0; }
    12%  {                                   opacity:0.9; }
    30%  { transform:translate(4px, -96px); }
    55%  { transform:translate(-4px, -180px); opacity:0.75; }
    80%  { transform:translate(3px, -262px); }
    100% { transform:translate(0, -330px);    opacity:0; }
  }

  /* Las voces: unos arcos salen de los labios y se apagan antes de llegar al centro */
  .arco {
    fill:none; stroke:rgba(232,235,248,0.85); stroke-width:1.1; stroke-linecap:round;
    transform-box: fill-box; transform-origin: center;
    opacity:0;
    animation: habla 24s ease-out infinite;
  }
  @keyframes habla {
    0%       { transform:translateX(0) scale(0.6);    opacity:0; }
    1.5%     { opacity:0.9; }
    9%, 100% { transform:translateX(13px) scale(1.15); opacity:0; }
  }

  .destello { opacity:0; }
  .destello.vivo { animation: destello 3.6s ease-out; }
  @keyframes destello {
    0%   { opacity:0; }
    14%  { opacity:0.85; }
    100% { opacity:0; }
  }

  /* El símbolo del portal: los puntos suspensivos */
  .puntos {
    position:fixed; left:50%;
    bottom:calc(env(safe-area-inset-bottom, 0px) + 19vh + 5em);
    transform:translateX(-50%);
    font-size: clamp(14px, 3.6vw, 18px);
    letter-spacing:0.6em; padding-left:0.6em;
    color: rgba(220,224,242,0.7);
    animation: puntos 8s ease-in-out infinite;
  }
  @keyframes puntos { 0%,100% { opacity:0.35; } 50% { opacity:0.8; } }

  /* Las frases: cuatro, cada una legible casi diez segundos dentro de un ciclo de cuarenta */
  .frases {
    position:fixed; left:50%;
    bottom:calc(env(safe-area-inset-bottom, 0px) + 19vh);
    transform:translateX(-50%);
    width:88vw; max-width:560px; height:4.4em;
    text-align:center;
  }
  .frase {
    position:absolute; left:0; right:0; top:0;
    font-size: clamp(15px, 4.1vw, 20px);
    line-height:1.55;
    font-style:italic;
    color: rgba(236,238,248,0.93);
    text-shadow: 0 0 18px rgba(190,195,232,0.38);
    opacity:0;
    animation: frase 40s ease-in-out infinite;
    will-change: opacity, transform;
  }
  .frase.f2 { animation-delay:10s; }
  .frase.f3 { animation-delay:20s; }
  .frase.f4 { animation-delay:30s; }
  @keyframes frase {
    0%    { opacity:0; transform:translateY(6px); }
    3.5%  { opacity:1; transform:translateY(0); }
    22%   { opacity:1; transform:translateY(0); }
    25%   { opacity:0; transform:translateY(-4px); }
    100%  { opacity:0; transform:translateY(-4px); }
  }

  .punto-toque {
    position:fixed;
    width:9px; height:9px; margin:-4.5px 0 0 -4.5px;
    border-radius:50%;
    background: rgba(240,242,252,1);
    box-shadow: 0 0 18px rgba(200,205,240,0.9);
    pointer-events:none;
    animation: punto 3.4s ease-out forwards;
    will-change: transform, opacity;
  }
  @keyframes punto {
    0%   { transform:scale(0.2); opacity:0; }
    10%  { transform:scale(1.3); opacity:1; }
    100% { transform:scale(0.5); opacity:0; }
  }

  .hint {
    position:fixed; left:50%;
    bottom:calc(env(safe-area-inset-bottom, 0px) + 50px);
    transform:translateX(-50%);
    width:max-content; max-width:88vw; text-align:center;
    font-size: clamp(12px, 3.2vw, 14px);
    letter-spacing:1px;
    color: rgba(240,242,252,0.88);
    animation: invita 3.4s infinite ease-in-out;
    pointer-events:none;
    transition: opacity 1.4s ease;
  }
  .hint.oculto { animation:none; opacity:0; }
  @keyframes invita { 0%,100% { opacity:0.45; } 50% { opacity:0.95; } }

  .infinito {
    position:fixed;
    bottom:calc(env(safe-area-inset-bottom, 0px) + 14px); right:22px;
    font-size:30px; text-decoration:none;
    color: rgba(205,208,235,0.4);
    transition: color 0.8s ease, text-shadow 0.8s ease;
    z-index:20;
    cursor:pointer;
  }
  .infinito:hover, .infinito:focus-visible { color: rgba(240,242,252,0.95); text-shadow:0 0 18px rgba(200,205,240,0.6); outline:none; }

  @media (max-width: 480px) {
    .titulo { letter-spacing:0.22em; }
    .frases { bottom:calc(env(safe-area-inset-bottom, 0px) + 15vh); }
    .puntos { bottom:calc(env(safe-area-inset-bottom, 0px) + 15vh + 5em); }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation:none !important; }
    .rostros { opacity:0.7; }
    .copa { opacity:0.75; }
    .motas, .voces, .ecos { display:none; }
    .puntos { opacity:0.6; }
    .frases { height:auto; bottom:calc(env(safe-area-inset-bottom, 0px) + 11vh); }
    .frase { position:static; opacity:0.92; margin-bottom:0.45em; font-size: clamp(13px, 3.6vw, 18px); }
    .puntos { bottom:auto; top:calc(50% - 5vh + min(26vh, 280px) + 0.5em); }
    .hint { opacity:0.8; bottom:calc(env(safe-area-inset-bottom, 0px) + 24px); }
  }
</style>
</head>

<script>
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const CONV = 24;                          // segundos de una conversación: dos voces y su silencio
  const inicio = performance.now();
  const SVG = 'http://www.w3.org/2000/svg';

  /* Las motas que suben por la copa, escalonadas para que siempre haya alguna en camino */
  if (!reduce) {
    const motas = document.getElementById('motas');
    for (let i = 0; i < 9; i++) {
      const c = document.createElementNS(SVG, 'circle');
      c.setAttribute('class', 'mota');
      c.setAttribute('cx', (200 + (Math.random() * 8 - 4)).toFixed(1));
      c.setAttribute('cy', '372');
      c.setAttribute('r', (1.1 + Math.random() * 0.9).toFixed(2));
      c.style.animationDelay = (-i * 17 / 9).toFixed(2) + 's';
      c.style.animationDuration = (15 + Math.random() * 5).toFixed(1) + 's';
      motas.appendChild(c);
    }
  }

  /* ---------------- Diseño sonoro: lo que queda cuando las voces callan ---------------------
     Dos voces breves, una a cada lado, como los dos rostros: tres notas a la izquierda, tres
     a la derecha. Suenan casi secas; lo que perdura es el eco de la sala, que se recoge en el
     centro y dura más que lo dicho. Durante el silencio, la copa tiene su propio tono: una
     quinta grave y abierta que sube desde la nada y vuelve a ella.
     Al tocar, una nota suelta del lado donde tocaste; también ella se queda en el espacio.
  ------------------------------------------------------------------------------------------- */
  let started = false, ctx, master, seco, sala;
  const IZQ = [329.63, 392.0, 293.66];      // una pregunta
  const DER = [246.94, 220.0, 293.66];      // una respuesta que vuelve al mismo lugar
  const TOQUE = [293.66, 329.63, 440.0, 493.88, 587.33];

  function makeReverbIR(ac, seconds = 6, decay = 2.3) {
    const len = Math.floor(ac.sampleRate * seconds);
    const buf = ac.createBuffer(2, len, ac.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    }
    return buf;
  }

  function voz(notas, pan, t0) {
    notas.forEach((f, i) => {
      const t = t0 + i * 0.42;
      const o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = f;
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1500; lp.Q.value = 0.6;
      const g = ctx.createGain(); g.gain.value = 0;
      const p = ctx.createStereoPanner(); p.pan.value = pan;
      o.connect(lp); lp.connect(g); g.connect(p); p.connect(seco); p.connect(sala);
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.07, t + 0.04);
      g.gain.exponentialRampToValueAtTime(0.0008, t + 0.5);
      o.start(t); o.stop(t + 0.6);
    });
  }

  function copa(desde, hasta) {               // la quinta del silencio, entre dos instantes
    const ahora = ctx.currentTime;
    if (hasta <= ahora + 1) return;
    const t0 = Math.max(desde, ahora);
    [[146.83, 0.020], [220.0, 0.014], [293.66, 0.007]].forEach(([f, v]) => {
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f * (1 + (Math.random() - 0.5) * 0.002);
      const g = ctx.createGain(); g.gain.value = 0;
      o.connect(g); g.connect(master); g.connect(sala);
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(v, Math.min(t0 + 4, hasta - 4));
      g.gain.setValueAtTime(v, hasta - 4);
      g.gain.linearRampToValueAtTime(0, hasta);
      o.start(t0); o.stop(hasta + 0.1);
    });
  }

  function conversacion(c0) {                // c0: instante (en el reloj de audio) en que empieza
    const ahora = ctx.currentTime;
    if (c0 + 0.2 >= ahora) voz(IZQ, -0.75, c0 + 0.2);
    if (c0 + 4.2 >= ahora) voz(DER, 0.75, c0 + 4.2);
    copa(c0 + 9, c0 + 23);
  }

  function startAudio() {
    if (started) return; started = true;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain(); master.gain.value = 0; master.connect(ctx.destination);
    master.gain.linearRampToValueAtTime(0.5, ctx.currentTime + 6);

    seco = ctx.createGain(); seco.gain.value = 0.45; seco.connect(master);
    // La sala escucha en mono y responde en estéreo: el eco se recoge en el centro, entre los dos
    sala = ctx.createGain(); sala.gain.value = 1.0;
    sala.channelCount = 1; sala.channelCountMode = 'explicit'; sala.channelInterpretation = 'speakers';
    const conv = ctx.createConvolver(); conv.buffer = makeReverbIR(ctx);
    const vuelta = ctx.createGain(); vuelta.gain.value = 0.85;
    sala.connect(conv); conv.connect(vuelta); vuelta.connect(master);

    // Sincronizar con la conversación visible
    const fase = ((performance.now() - inicio) / 1000) % CONV;
    let c0 = ctx.currentTime - fase;
    conversacion(c0);
    // La siguiente se programa un segundo antes de que empiece, y desde ahí cada 24 s
    const siguiente = () => { c0 += CONV; conversacion(c0); };
    setTimeout(() => { siguiente(); setInterval(siguiente, CONV * 1000); }, Math.max(0, CONV - fase - 1) * 1000);
  }

  function notaSuelta(x) {
    const t = ctx.currentTime + 0.01;
    const f = TOQUE[Math.floor(Math.random() * TOQUE.length)];
    const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f;
    const g = ctx.createGain(); g.gain.value = 0;
    const p = ctx.createStereoPanner(); p.pan.value = Math.max(-0.8, Math.min(0.8, (x / innerWidth) * 1.6 - 0.8));
    o.connect(g); g.connect(p); p.connect(seco); p.connect(sala);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.08, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0008, t + 1.2);
    o.start(t); o.stop(t + 1.3);
  }

  const destello = document.getElementById('destello');
  function avivarCopa() {
    destello.classList.remove('vivo'); void destello.getBoundingClientRect(); destello.classList.add('vivo');
  }
  function punto(x, y) {
    const p = document.createElement('div'); p.className = 'punto-toque';
    p.style.left = x + 'px'; p.style.top = y + 'px';
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 3500);
  }

  const hint = document.getElementById('hint');
  window.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.infinito')) return;
    startAudio();
    if (hint) hint.classList.add('oculto');
    notaSuelta(e.clientX);
    if (!reduce) { punto(e.clientX, e.clientY); avivarCopa(); }
  });
</script>
