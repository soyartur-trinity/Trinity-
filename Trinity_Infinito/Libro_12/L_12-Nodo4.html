<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
<title>Libro 12 - Nodo 4: El Susurro Sin Sonido</title>
<!-- Portal 81. Saneado en noviembre de 2026 con imagen y sonido propios:
     una cuerda de luz en onda estacionaria; vibran los armónicos y los nodos, que nunca se mueven,
     quedan encendidos. Suena el fundamental ausente: una nota que nadie toca y todos oyen.
     Frases, paradoja y paleta (plata azulada) del original. -->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  html, body { height:100%; }
  body {
    background: radial-gradient(ellipse at 50% 45%, #0b0f16 0%, #05070b 55%, #000 82%);
    background-color:#000;
    color:#fff;
    font-family:'Georgia', serif;
    overflow:hidden;
    height:100vh; height:100dvh;
    display:flex; align-items:center; justify-content:center;
    cursor:none;
    -webkit-tap-highlight-color: transparent;
  }

  .cabecera {
    position:fixed; left:50%; top:calc(env(safe-area-inset-top, 0px) + 6vh);
    transform:translateX(-50%);
    width:max-content; max-width:90vw; text-align:center;
    z-index:5; pointer-events:none;
  }
  .titulo {
    font-size: clamp(15px, 4.2vw, 22px);
    letter-spacing:0.32em;
    line-height:1.5;
    color: rgba(230,238,246,0.9);
    text-shadow: 0 0 26px rgba(170,200,232,0.42);
  }
  .subtitulo {
    margin-top:0.7em;
    font-size: clamp(11px, 2.8vw, 13px);
    letter-spacing:0.28em; font-style:italic;
    color: rgba(196,212,230,0.5);
  }

  /* La cuerda: proporcional al ancho, con espacio arriba y abajo para su vaivén */
  .campo {
    position:relative;
    width:min(620px, 90vw);
    aspect-ratio:400 / 260;
    margin-top:-6vh;
  }
  /* En vertical, la cuerda también se pone de pie, como la de un arpa */
  @media (orientation: portrait) {
    .campo { width:auto; height:min(56vh, 620px); aspect-ratio:260 / 400; max-width:88vw; }
    .resplandor { inset:0 -10%; }
  }
  .campo svg { display:block; width:100%; height:100%; overflow:visible; }

  .resplandor {
    position:absolute; inset:-8% 0;
    border-radius:50%;
    background: radial-gradient(ellipse, rgba(180,205,235,0.09), transparent 64%);
    animation: respira 18s ease-in-out infinite;
    will-change: transform, opacity;
  }
  @keyframes respira {
    0%,100% { transform:scale(0.92); opacity:0.55; }
    50%     { transform:scale(1.1);  opacity:0.95; }
  }

  /* Cada armónico va y vuelve: la onda estacionaria es un mismo dibujo que se invierte */
  .armonico { fill:none; stroke-linecap:round; animation: vibra var(--p) ease-in-out infinite alternate; }
  @keyframes vibra {
    from { transform:scaleY(1); }
    to   { transform:scaleY(-1); }
  }
  .halo-arm { stroke-width:4; opacity:0.16; }

  /* El fundamental: no vibra, no suena; solo se presiente */
  .fundamental { fill:none; stroke:rgba(210,226,244,0.9); stroke-width:0.8; stroke-dasharray:1.5 5; animation: presiente 14s ease-in-out infinite; }
  .fundamental-luz { animation: presiente 14s ease-in-out infinite; }
  @keyframes presiente {
    0%,100% { opacity:0.06; }
    50%     { opacity:0.32; }
  }

  .reposo { fill:none; stroke:rgba(200,218,240,0.16); stroke-width:0.6; }
  .nodo { fill:rgba(244,249,255,0.95); }
  .nodo-halo { fill:url(#luzNodo); animation: quieto 9s ease-in-out infinite; }
  @keyframes quieto { 0%,100% { opacity:0.55; } 50% { opacity:1; } }
  .puente { fill:rgba(220,232,246,0.85); }

  /* Lo que se eleva desde los puntos que no se mueven */
  .susurro {
    fill: rgba(232,242,255,0.95);
    opacity:0;
    animation: susurro 8s ease-out infinite;
  }
  @keyframes susurro {
    0%   { transform:translate(0, 0);              opacity:0; }
    15%  {                                          opacity:0.85; }
    100% { transform:translate(var(--dx), var(--dy));   opacity:0; }
  }

  .pulso { animation:none; }
  .pulso.vivo { animation: pulso 3.2s ease-out; }
  @keyframes pulso {
    0%   { transform:scaleY(1); }
    12%  { transform:scaleY(1.7); }
    100% { transform:scaleY(1); }
  }

  .frases {
    position:fixed; left:50%;
    bottom:calc(env(safe-area-inset-bottom, 0px) + 19vh);
    transform:translateX(-50%);
    width:88vw; max-width:560px; height:4.4em;
    text-align:center;
    pointer-events:none;
  }
  .frase {
    position:absolute; left:0; right:0; top:0;
    font-size: clamp(15px, 4.1vw, 20px);
    line-height:1.55;
    font-style:italic;
    color: rgba(238,244,252,0.93);
    text-shadow: 0 0 18px rgba(170,200,232,0.4);
    opacity:0;
    animation: frase 40s ease-in-out infinite;
    will-change: opacity, transform;
  }
  .frase.f2 { animation-delay:10s; }
  .frase.f3 { animation-delay:20s; }
  .frase.f4 { animation-delay:30s; }
  @keyframes frase {
    0%    { opacity:0; transform:translateY(6px); }
    3.5%  { opacity:1; transform:translateY(0); }
    22%   { opacity:1; transform:translateY(0); }
    25%   { opacity:0; transform:translateY(-4px); }
    100%  { opacity:0; transform:translateY(-4px); }
  }

  .hint {
    position:fixed; left:50%;
    bottom:calc(env(safe-area-inset-bottom, 0px) + 50px);
    transform:translateX(-50%);
    width:max-content; max-width:88vw; text-align:center;
    font-size: clamp(12px, 3.2vw, 14px);
    letter-spacing:1px;
    color: rgba(238,244,252,0.88);
    animation: invita 3.4s infinite ease-in-out;
    pointer-events:none;
    transition: opacity 1.4s ease;
  }
  .hint.oculto { animation:none; opacity:0; }
  @keyframes invita { 0%,100% { opacity:0.45; } 50% { opacity:0.95; } }

  .infinito {
    position:fixed;
    bottom:calc(env(safe-area-inset-bottom, 0px) + 14px); right:22px;
    font-size:30px; text-decoration:none;
    color: rgba(190,210,235,0.4);
    transition: color 0.8s ease, text-shadow 0.8s ease;
    z-index:20;
    cursor:pointer;
  }
  .infinito:hover, .infinito:focus-visible { color: rgba(240,246,255,0.95); text-shadow:0 0 18px rgba(170,200,232,0.6); outline:none; }

  @media (max-width: 480px) {
    .titulo { letter-spacing:0.22em; }
    .frases { bottom:calc(env(safe-area-inset-bottom, 0px) + 15vh); }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation:none !important; }
    .fundamental, .fundamental-luz { opacity:0.25; }
    .armonico { transform:scaleY(0.75); }
    .susurros { display:none; }
    .frases { height:auto; bottom:calc(env(safe-area-inset-bottom, 0px) + 11vh); }
    .frase { position:static; opacity:0.92; margin-bottom:0.45em; font-size: clamp(13px, 3.6vw, 18px); }
    .hint { opacity:0.8; bottom:calc(env(safe-area-inset-bottom, 0px) + 24px); }
  }
</style>
</head>
<body>
  <div class="cabecera">
    <div class="titulo">EL SUSURRO SIN SONIDO</div>
    <div class="subtitulo">Libro 12 - Nodo 4</div>
  </div>

  <div class="campo">
    <div class="resplandor"></div>
    <svg id="cuerda" viewBox="0 0 400 260" aria-hidden="true">
      <defs>
        <radialGradient id="luzNodo">
          <stop offset="0" stop-color="rgb(235,244,255)" stop-opacity="0.75"/>
          <stop offset="1" stop-color="rgb(170,200,240)" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="luzFund" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="rgb(200,220,245)" stop-opacity="0"/>
          <stop offset="1" stop-color="rgb(200,220,245)" stop-opacity="0.22"/>
        </linearGradient>
      </defs>
      <g id="eje" transform="translate(0,130)">
        <g id="fundamental"></g>
        <line class="reposo" x1="20" y1="0" x2="380" y2="0"/>
        <g id="armonicos"></g>
        <g id="nodos"></g>
        <g class="susurros" id="susurros"></g>
        <circle class="puente" cx="20" cy="0" r="2.6"/>
        <circle class="puente" cx="380" cy="0" r="2.6"/>
      </g>
    </svg>
  </div>

  <div class="frases" aria-live="off">
    <p class="frase f1">La voz sin vibración · Escuchada con el alma</p>
    <p class="frase f2">El murmullo que no necesita aire</p>
    <p class="frase f3">La palabra telepática · Comunicación más allá del oído</p>
    <p class="frase f4">El susurro del espíritu al espíritu</p>
  </div>

  <div class="hint" id="hint">( toca: escucha la nota que nadie toca )</div>

  <a class="infinito" href="L_12-Nodo5.html" aria-label="Siguiente portal">∞</a>

<script>
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const SVG = 'http://www.w3.org/2000/svg';
  const X0 = 20, L = 360;

  /* ---------------- La cuerda -------------------------------------------------------------
     Cuatro armónicos, del segundo al quinto, vibran a la vez sobre la misma cuerda. Cada uno
     tiene sus nodos: puntos donde la cuerda nunca se mueve. Donde coinciden los nodos de dos
     armónicos, la luz es mayor. El primero, el fundamental, no vibra: queda como un arco
     punteado que aparece y se borra, presentido.
  ------------------------------------------------------------------------------------------- */
  const ARM = [
    { n: 2, a: 34, p: 5.2, col: '214,230,248', o: 0.62, w: 1.3 },
    { n: 3, a: 26, p: 3.5, col: '180,206,238', o: 0.5,  w: 1.1 },
    { n: 4, a: 20, p: 2.6, col: '196,214,244', o: 0.42, w: 1.0 },
    { n: 5, a: 15, p: 2.1, col: '226,236,250', o: 0.36, w: 0.9 }
  ];

  function onda(n, a) {
    let d = '';
    for (let i = 0; i <= 180; i++) {
      const x = X0 + L * i / 180, y = -a * Math.sin(Math.PI * n * i / 180);
      d += (i ? ' L' : 'M') + x.toFixed(1) + ',' + y.toFixed(2);
    }
    return d;
  }
  function el(tag, attrs, padre) {
    const e = document.createElementNS(SVG, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    padre.appendChild(e); return e;
  }

  // El fundamental presentido: arco arriba y su reflejo abajo, con una luz suave debajo del arco
  const fund = document.getElementById('fundamental');
  el('path', { d: onda(1, 92) + ` L${X0 + L},0 L${X0},0 Z`, fill: 'url(#luzFund)', class: 'fundamental-luz' }, fund);
  el('path', { d: onda(1, 92), class: 'fundamental' }, fund);
  el('path', { d: onda(1, -92), class: 'fundamental', style: 'animation-delay:-7s' }, fund);

  // Los armónicos
  const armonicos = document.getElementById('armonicos');
  const pulsos = [];
  ARM.forEach((h, i) => {
    const pulso = el('g', { class: 'pulso' }, armonicos);
    pulsos.push(pulso);
    const halo = el('path', { d: onda(h.n, h.a), class: 'armonico halo-arm', stroke: `rgb(${h.col})` }, pulso);
    const linea = el('path', { d: onda(h.n, h.a), class: 'armonico', stroke: `rgba(${h.col},${h.o})`, 'stroke-width': h.w }, pulso);
    [halo, linea].forEach((p) => { p.style.setProperty('--p', (h.p / 2) + 's'); p.style.animationDelay = (-i * 0.7) + 's'; });
  });

  // Los nodos: los puntos que no vibran
  const cuenta = new Map();
  ARM.forEach((h) => { for (let k = 1; k < h.n; k++) { const f = +(k / h.n).toFixed(4); cuenta.set(f, (cuenta.get(f) || 0) + 1); } });
  const nodos = document.getElementById('nodos');
  const susurros = document.getElementById('susurros');
  let s = 0;
  [...cuenta.entries()].sort((a, b) => a[0] - b[0]).forEach(([f, c]) => {
    const x = X0 + L * f;
    const halo = el('circle', { cx: x, cy: 0, r: 7 + 5 * c, class: 'nodo-halo' }, nodos);
    halo.style.animationDelay = (-f * 9).toFixed(2) + 's';
    el('circle', { cx: x, cy: 0, r: 1.5 + 0.8 * c, class: 'nodo' }, nodos);
    if (!reduce) {
      for (let k = 0; k < 1 + c; k++) {
        const m = el('circle', { cx: x, cy: 0, r: (0.7 + Math.random() * 0.8).toFixed(2), class: 'susurro' }, susurros);
        m.style.setProperty('--dx', ((Math.random() - 0.5) * 16).toFixed(1) + 'px');
        m.style.setProperty('--dy', ((k % 2 ? 1 : -1) * (48 + Math.random() * 18)).toFixed(1) + 'px');
        m.style.animationDelay = (-(s++ * 1.37) % 8).toFixed(2) + 's';
        m.style.animationDuration = (7 + Math.random() * 3).toFixed(1) + 's';
      }
    }
  });

  // Horizontal en pantallas anchas; de pie en pantallas altas
  function orientar() {
    const vertical = innerHeight > innerWidth;
    document.getElementById('cuerda').setAttribute('viewBox', vertical ? '0 0 260 400' : '0 0 400 260');
    document.getElementById('eje').setAttribute('transform', vertical ? 'translate(130,0) rotate(90)' : 'translate(0,130)');
  }
  orientar();
  window.addEventListener('resize', orientar);

  /* ---------------- Diseño sonoro: el fundamental ausente ---------------------------------
     Suenan solo los armónicos, del segundo al sexto, cada uno respirando a su ritmo. La nota
     fundamental no la toca nadie, y sin embargo es la que se oye: el oído la reconstruye a
     partir de sus armónicos. Por eso un parlante pequeño, que no puede dar graves, igual deja
     oír una línea de bajo. Cada tanto, todos los armónicos se deslizan juntos y la nota que
     nadie toca cambia: una melodía hecha de notas que no suenan.
     Al tocar, los armónicos se avivan un instante.
  ------------------------------------------------------------------------------------------- */
  let started = false, ctx, master, verb, parciales = [];
  const MELODIA = [110.0, 98.0, 123.47, 110.0, 82.41, 92.5];   // fundamentales que nunca suenan
  let paso = 0;

  function makeReverbIR(ac, seconds = 4.5, decay = 2.4) {
    const len = Math.floor(ac.sampleRate * seconds);
    const buf = ac.createBuffer(2, len, ac.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    }
    return buf;
  }

  function startAudio() {
    if (started) return; started = true;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain(); master.gain.value = 0; master.connect(ctx.destination);
    master.gain.linearRampToValueAtTime(0.36, ctx.currentTime + 7);
    const conv = ctx.createConvolver(); conv.buffer = makeReverbIR(ctx);
    verb = ctx.createGain(); verb.gain.value = 0.5; verb.connect(conv); conv.connect(master);

    const f0 = MELODIA[0];
    [2, 3, 4, 5, 6].forEach((n, i) => {
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f0 * n;
      const g = ctx.createGain(); g.gain.value = 0;
      const base = 0.028 / Math.pow(i + 1, 0.55);
      // cada armónico respira con el ritmo de su dibujo en la cuerda
      const lfo = ctx.createOscillator(); lfo.frequency.value = 1 / (ARM[Math.min(i, 3)].p * (i === 4 ? 0.8 : 1));
      const prof = ctx.createGain(); prof.gain.value = base * 0.35;
      lfo.connect(prof); prof.connect(g.gain);
      const p = ctx.createStereoPanner(); p.pan.value = [-0.35, 0.3, -0.15, 0.4, -0.4][i];
      o.connect(g); g.connect(p); p.connect(master); p.connect(verb);
      g.gain.setValueAtTime(0, ctx.currentTime);
      g.gain.linearRampToValueAtTime(base, ctx.currentTime + 5 + i * 0.6);
      o.start(); lfo.start();
      parciales.push({ o, g, n, base });
    });
    setInterval(cambiar, 13000);
  }

  function cambiar() {                       // la nota que nadie toca se desliza a la siguiente
    paso = (paso + 1) % MELODIA.length;
    const f0 = MELODIA[paso], t = ctx.currentTime;
    parciales.forEach(({ o, n }) => {
      o.frequency.cancelScheduledValues(t);
      o.frequency.setValueAtTime(o.frequency.value, t);
      o.frequency.exponentialRampToValueAtTime(f0 * n, t + 2.4);
    });
  }

  function avivar() {
    const t = ctx.currentTime;
    parciales.forEach(({ g, base }, i) => {
      g.gain.cancelScheduledValues(t);
      g.gain.setValueAtTime(g.gain.value, t);
      g.gain.linearRampToValueAtTime(base * 2.2, t + 0.25 + i * 0.05);
      g.gain.linearRampToValueAtTime(base, t + 3.2);
    });
    pulsos.forEach((p) => { p.classList.remove('vivo'); void p.getBoundingClientRect(); p.classList.add('vivo'); });
  }

  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend(); else ctx.resume();
  });

  const hint = document.getElementById('hint');
  window.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.infinito')) return;
    const primero = !started;
    startAudio();
    if (hint) hint.classList.add('oculto');
    if (!primero) avivar();
    else if (!reduce) pulsos.forEach((p) => p.classList.add('vivo'));
  });
</script>
</body>
</html>
