<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
<title>Portal 80 · La Mirada Que Comprende — Trinity Infinito</title>
<link rel="icon" href="../../assets/icono/favicon.svg" type="image/svg+xml">
<link rel="icon" href="../../assets/icono/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="../../assets/icono/icono-180.png">
<!-- Portal 80. Saneado en noviembre de 2026 con imagen y sonido propios; imagen rehecha el 17 de
     noviembre, sin ojo: la simpatía de los relojes (Huygens, 1665). Dos péndulos cuelgan de una misma
     viga; empiezan desencontrados y, sin tocarse, por lo poco que la viga lleva de uno al otro, terminan
     moviéndose en espejo. Una línea de luz los une: se aquieta y se nivela cuando se comprenden.
     Resonancia por simpatía en el sonido. Frases, paradoja y paleta (azul, elevada a zafiro) del original. -->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  html, body { height:100%; }
  body {
    background: radial-gradient(ellipse at 50% 45%, #0a0e1c 0%, #04060e 55%, #000 82%);
    background-color:#000;
    color:#fff;
    font-family:'Georgia', serif;
    overflow:hidden;
    height:100vh; height:100dvh;
    cursor:none;
    -webkit-tap-highlight-color: transparent;
  }

  #lienzo { position:fixed; inset:0; display:block; }

  .cabecera {
    position:fixed; left:50%; top:calc(env(safe-area-inset-top, 0px) + 6vh);
    transform:translateX(-50%);
    width:max-content; max-width:90vw; text-align:center;
    z-index:5; pointer-events:none;
  }
  .titulo {
    font-size: clamp(15px, 4.2vw, 22px);
    letter-spacing:0.32em;
    line-height:1.5;
    color: rgba(226,234,252,0.9);
    text-shadow: 0 0 26px rgba(120,160,240,0.45);
  }
  .subtitulo {
    margin-top:0.7em;
    font-size: clamp(11px, 2.8vw, 13px);
    letter-spacing:0.28em; font-style:italic;
    color: rgba(180,200,240,0.5);
  }

  .frases {
    position:fixed; left:50%;
    bottom:calc(env(safe-area-inset-bottom, 0px) + 19vh);
    transform:translateX(-50%);
    width:88vw; max-width:560px; height:4.4em;
    text-align:center;
    pointer-events:none;
  }
  .frase {
    position:absolute; left:0; right:0; top:0;
    font-size: clamp(15px, 4.1vw, 20px);
    line-height:1.55;
    font-style:italic;
    color: rgba(234,240,254,0.93);
    text-shadow: 0 0 18px rgba(120,160,240,0.4);
    opacity:0;
    animation: frase 40s ease-in-out infinite;
    will-change: opacity, transform;
  }
  .frase.f2 { animation-delay:10s; }
  .frase.f3 { animation-delay:20s; }
  .frase.f4 { animation-delay:30s; }
  @keyframes frase {
    0%    { opacity:0; transform:translateY(6px); }
    3.5%  { opacity:1; transform:translateY(0); }
    22%   { opacity:1; transform:translateY(0); }
    25%   { opacity:0; transform:translateY(-4px); }
    100%  { opacity:0; transform:translateY(-4px); }
  }

  .hint {
    position:fixed; left:50%;
    bottom:calc(env(safe-area-inset-bottom, 0px) + 50px);
    transform:translateX(-50%);
    width:max-content; max-width:88vw; text-align:center;
    font-size: clamp(12px, 3.2vw, 14px);
    letter-spacing:1px;
    color: rgba(234,240,254,0.88);
    animation: invita 3.4s infinite ease-in-out;
    pointer-events:none;
    transition: opacity 1.4s ease;
  }
  .hint.oculto { animation:none; opacity:0; }
  @keyframes invita { 0%,100% { opacity:0.45; } 50% { opacity:0.95; } }

  .infinito {
    position:fixed;
    bottom:calc(env(safe-area-inset-bottom, 0px) + 14px); right:22px;
    font-size:30px; text-decoration:none;
    color: rgba(170,195,240,0.4);
    transition: color 0.8s ease, text-shadow 0.8s ease;
    z-index:20;
    cursor:pointer;
  }
  .infinito:hover, .infinito:focus-visible { color: rgba(230,238,255,0.95); text-shadow:0 0 18px rgba(120,160,240,0.6); outline:none; }

  @media (max-width: 480px) {
    .titulo { letter-spacing:0.22em; }
    .frases { bottom:calc(env(safe-area-inset-bottom, 0px) + 15vh); }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation:none !important; }
    .frases { height:auto; bottom:calc(env(safe-area-inset-bottom, 0px) + 11vh); }
    .frase { position:static; opacity:0.92; margin-bottom:0.45em; font-size: clamp(13px, 3.6vw, 18px); }
    .hint { opacity:0.8; bottom:calc(env(safe-area-inset-bottom, 0px) + 24px); }
  }
</style>
</head>
<body>
  <canvas id="lienzo" aria-hidden="true"></canvas>

  <div class="cabecera">
    <div class="titulo">LA MIRADA QUE COMPRENDE</div>
    <div class="subtitulo">Libro 12 - Nodo 3</div>
  </div>

  <div class="frases" aria-live="off">
    <p class="frase f1">Un vistazo basta · Los ojos entienden sin palabras</p>
    <p class="frase f2">La mirada que dice todo</p>
    <p class="frase f3">El intercambio silencioso entre pupilas</p>
    <p class="frase f4">Comprender sin necesidad de explicación · La visión como diálogo</p>
  </div>

  <div class="hint" id="hint">( toca: cruza una mirada )</div>

  <a class="infinito" href="L_12-Nodo4.html" aria-label="Siguiente portal">∞</a>

<script>
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const lienzo = document.getElementById('lienzo');
  const g = lienzo.getContext('2d');
  let W, H, dpr, CX, CY, S0;

  /* ---------------- La imagen: la simpatía de los relojes -----------------------------------
     En 1665, enfermo en cama, Christiaan Huygens vio que dos relojes de péndulo colgados de una misma
     viga terminaban oscilando en espejo, y que si los desencontraba volvían a encontrarse en media hora.
     Lo llamó «una especie de simpatía». Nada pasa de uno al otro salvo el temblor mínimo de lo que los
     sostiene. Cuando se mueven en espejo, sus empujes se anulan y la viga queda quieta.
     Aquí: dos péndulos que empiezan desencontrados y se encuentran en menos de medio minuto. Una línea
     de luz va de uno al otro: inclinada y tenue mientras no se entienden, horizontal y clara cuando sí.
  ------------------------------------------------------------------------------------------- */
  const PERIODO = 6.4;                         // segundos de una oscilación completa
  const A = 0.28;                              // amplitud, en radianes
  const K = 0.07;                              // lo que la viga lleva de uno al otro
  const W0 = 2 * Math.PI / PERIODO;
  const OMEGA = [W0 * 1.003, W0 * 0.997];      // dos relojes nunca son idénticos
  const TONOS = [                              // los dos azules del original: zafiro y agua
    { luz: [150, 185, 245], halo: [70, 110, 210] },
    { luz: [190, 214, 250], halo: [110, 150, 225] }
  ];
  let fase = [0.2, 0.2 + 2.3];                 // empiezan desencontrados
  let destello = [-9, -9], llega = [-9, -9];   // el que toca y el que responde por simpatía
  let turno = 0, nota = 0, encontrados = 0;

  function medir() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    lienzo.width = Math.round(W * dpr); lienzo.height = Math.round(H * dpr);
    lienzo.style.width = W + 'px'; lienzo.style.height = H + 'px';
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    CX = W / 2; CY = H * 0.45; S0 = Math.min(W * 0.86, H * 0.46, 560);
  }

  const angulo = (i, f) => (i === 0 ? -A : A) * Math.sin(f);   // hacia afuera, los dos a la vez: espejo

  function dibujar(T, th0, th1) {
    g.clearRect(0, 0, W, H);
    const L = 0.56 * S0, yv = CY - 0.32 * S0, sep = 0.21 * S0;
    const empuje = (Math.sin(th0) + Math.sin(th1)) / (2 * Math.sin(A));   // 0 cuando van en espejo
    const dx = -0.006 * S0 * empuje;
    const piv = [[CX - sep + dx, yv], [CX + sep + dx, yv]];
    const bob = [0, 1].map(i => { const th = i ? th1 : th0; return [piv[i][0] + L * Math.sin(th), piv[i][1] + L * Math.cos(th)]; });

    // la viga: tiembla y brilla mientras los dos se empujan; quieta cuando se entienden
    const ag = Math.min(1, Math.abs(empuje));
    const vx0 = CX - 0.42 * S0 + dx, vx1 = CX + 0.42 * S0 + dx;
    const lv = g.createLinearGradient(vx0, 0, vx1, 0);
    lv.addColorStop(0, 'rgba(170,195,245,0)'); lv.addColorStop(0.18, `rgba(170,195,245,${0.32 + 0.4 * ag})`);
    lv.addColorStop(0.82, `rgba(170,195,245,${0.32 + 0.4 * ag})`); lv.addColorStop(1, 'rgba(170,195,245,0)');
    g.strokeStyle = `rgba(110,150,230,${0.05 + 0.12 * ag})`; g.lineWidth = Math.max(3, S0 / 90);
    g.beginPath(); g.moveTo(vx0, yv); g.lineTo(vx1, yv); g.stroke();
    g.strokeStyle = lv; g.lineWidth = Math.max(0.8, S0 / 380);
    g.beginPath(); g.moveTo(vx0, yv); g.lineTo(vx1, yv); g.stroke();

    for (let i = 0; i < 2; i++) {
      const t = TONOS[i], [px, py] = piv[i], [bx, by] = bob[i];
      // el arco de su recorrido, como en una foto de exposición larga
      g.strokeStyle = `rgba(${t.halo},0.10)`; g.lineWidth = Math.max(0.6, S0 / 500);
      g.beginPath(); g.arc(px, py, L, Math.PI / 2 - A, Math.PI / 2 + A); g.stroke();
      // el hilo
      const lh = g.createLinearGradient(px, py, bx, by);
      lh.addColorStop(0, `rgba(${t.luz},0.12)`); lh.addColorStop(1, `rgba(${t.luz},0.5)`);
      g.strokeStyle = lh; g.lineWidth = Math.max(0.6, S0 / 420);
      g.beginPath(); g.moveTo(px, py); g.lineTo(bx, by); g.stroke();
      g.fillStyle = `rgba(${t.luz},0.7)`; g.beginPath(); g.arc(px, py, Math.max(1.5, S0 / 260), 0, Math.PI * 2); g.fill();
    }

    // la línea de la mirada: de uno al otro
    const dif = Math.atan2(Math.sin(fase[1] - fase[0]), Math.cos(fase[1] - fase[0]));
    const sinto = Math.pow((1 + Math.cos(dif)) / 2, 3);
    const lm = g.createLinearGradient(bob[0][0], bob[0][1], bob[1][0], bob[1][1]);
    lm.addColorStop(0, `rgba(${TONOS[0].luz},${0.08 + 0.55 * sinto})`);
    lm.addColorStop(0.5, `rgba(225,235,255,${0.04 + 0.4 * sinto})`);
    lm.addColorStop(1, `rgba(${TONOS[1].luz},${0.08 + 0.55 * sinto})`);
    g.strokeStyle = lm; g.lineWidth = Math.max(0.7, S0 / 360);
    g.beginPath(); g.moveTo(bob[0][0], bob[0][1]); g.lineTo(bob[1][0], bob[1][1]); g.stroke();

    // las dos esferas: la que toca brilla de golpe; la que responde se enciende despacio
    for (let i = 0; i < 2; i++) {
      const t = TONOS[i], [bx, by] = bob[i];
      const u = T - destello[i], v = T - llega[i];
      const golpe = u >= 0 ? Math.exp(-u / 0.5) : 0;
      const simp = v >= 0 ? Math.min(1, v / 1.6) * Math.exp(-Math.max(0, v - 1.6) / 2.6) : 0;
      const viva = Math.max(golpe, 0.8 * simp);
      const rb = Math.max(4.5, 0.03 * S0), rh = rb * (4 + 3 * viva);
      const h = g.createRadialGradient(bx, by, 0, bx, by, rh);
      h.addColorStop(0, `rgba(${t.halo},${0.32 + 0.4 * viva})`); h.addColorStop(1, `rgba(${t.halo},0)`);
      g.fillStyle = h; g.beginPath(); g.arc(bx, by, rh, 0, Math.PI * 2); g.fill();
      const c = g.createRadialGradient(bx - rb * 0.3, by - rb * 0.3, 0, bx, by, rb);
      c.addColorStop(0, `rgba(245,249,255,${0.85 + 0.15 * viva})`); c.addColorStop(1, `rgba(${t.luz},0.75)`);
      g.fillStyle = c; g.beginPath(); g.arc(bx, by, rb, 0, Math.PI * 2); g.fill();
    }
  }

  let T = 0, ultimo = 0;
  function cuadro(ms) {
    const dt = Math.min(0.05, (ms - ultimo) / 1000 || 0.016); ultimo = ms; T += dt;
    const antes = fase.slice();
    const d = Math.sin(fase[1] - fase[0]);
    fase[0] += (OMEGA[0] + K * d) * dt;
    fase[1] += (OMEGA[1] - K * d) * dt;
    // cada uno llega a su extremo de afuera: si es su turno, toca, y el otro responde por simpatía
    for (let i = 0; i < 2; i++) {
      const cruza = Math.floor((antes[i] - Math.PI / 2) / (2 * Math.PI)) !== Math.floor((fase[i] - Math.PI / 2) / (2 * Math.PI));
      if (cruza && turno === i) { intercambio(i); turno = 1 - i; }
    }
    // cuando llevan un rato en espejo, un encuentro nuevo: uno se adelanta
    const dif = Math.abs(Math.atan2(Math.sin(fase[1] - fase[0]), Math.cos(fase[1] - fase[0])));
    encontrados = dif < 0.08 ? encontrados + dt : 0;
    if (encontrados > 48) { fase[Math.random() < 0.5 ? 0 : 1] += 1.7; encontrados = 0; }
    dibujar(T, angulo(0, fase[0]), angulo(1, fase[1]));
    requestAnimationFrame(cuadro);
  }

  function intercambio(i) {
    destello[i] = T; llega[1 - i] = T + 0.15;
    reconocer(i);
  }

  function quieto() {                            // en espejo, los dos afuera; la línea horizontal
    fase = [Math.PI / 2, Math.PI / 2];
    dibujar(-99, angulo(0, fase[0]), angulo(1, fase[1]));
  }

  medir();
  window.addEventListener('resize', () => { medir(); if (reduce) quieto(); });
  if (reduce) quieto();
  else requestAnimationFrame((t) => { ultimo = t; requestAnimationFrame(cuadro); });

  /* ---------------- Diseño sonoro: la resonancia por simpatía --------------------------------
     Cuando un péndulo llega a su extremo de afuera y es su turno, suena una cuerda pulsada de su
     lado. Del otro lado, una cuerda que nadie tocó empieza a vibrar en la misma nota: llega
     despacio, sin golpe, y dura más. Así responden las cuerdas por simpatía, y así se entiende una
     mirada sin explicación. Los lados se alternan; cada intercambio dice una nota distinta.
     Mientras los péndulos están desencontrados, los intercambios llegan a destiempo; cuando se
     mueven en espejo, llegan cada 6,4 s, y el que responde está en su extremo al mismo tiempo.
  ------------------------------------------------------------------------------------------- */
  let started = false, ctx, master, verb;
  const NOTAS = [293.66, 220.0, 329.63, 246.94, 196.0, 261.63];

  function makeReverbIR(ac, seconds = 4.5, decay = 2.6) {
    const len = Math.floor(ac.sampleRate * seconds);
    const buf = ac.createBuffer(2, len, ac.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    }
    return buf;
  }

  function pulsar(f, pan, t) {                 // la cuerda tocada: armónicos que se apagan
    const p = ctx.createStereoPanner(); p.pan.value = pan; p.connect(master); p.connect(verb);
    for (let n = 1; n <= 7; n++) {
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f * n * (1 + 0.0007 * n * n);
      const gg = ctx.createGain(); gg.gain.value = 0;
      o.connect(gg); gg.connect(p);
      const a = 0.07 / Math.pow(n, 1.25), dur = 3.2 / Math.sqrt(n);
      gg.gain.setValueAtTime(0, t); gg.gain.linearRampToValueAtTime(a, t + 0.004);
      gg.gain.exponentialRampToValueAtTime(0.0004, t + dur);
      o.start(t); o.stop(t + dur + 0.1);
    }
  }

  function simpatia(f, pan, t) {               // la cuerda que nadie tocó: llega sin golpe
    const p = ctx.createStereoPanner(); p.pan.value = pan; p.connect(master); p.connect(verb);
    [[1, 0.035], [2, 0.012], [3, 0.004]].forEach(([n, a]) => {
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f * n;
      const gg = ctx.createGain(); gg.gain.value = 0;
      o.connect(gg); gg.connect(p);
      gg.gain.setValueAtTime(0, t);
      gg.gain.linearRampToValueAtTime(a, t + 1.6);
      gg.gain.exponentialRampToValueAtTime(0.0003, t + 9);
      o.start(t); o.stop(t + 9.2);
    });
  }

  function reconocer(i) {
    if (!started) return;
    const t = ctx.currentTime + 0.01;
    const lado = i === 0 ? -0.6 : 0.6;
    const f = NOTAS[nota++ % NOTAS.length];
    pulsar(f, lado, t);
    simpatia(f, -lado, t + 0.15);
  }

  function startAudio() {
    if (started) return; started = true;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain(); master.gain.value = 0; master.connect(ctx.destination);
    master.gain.linearRampToValueAtTime(0.55, ctx.currentTime + 6);
    const conv = ctx.createConvolver(); conv.buffer = makeReverbIR(ctx);
    verb = ctx.createGain(); verb.gain.value = 0.45; verb.connect(conv); conv.connect(master);
    // Un fondo muy quieto: el espacio entre las dos miradas
    [[110, 0.012], [164.81, 0.008]].forEach(([f, v]) => {
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f;
      const gg = ctx.createGain(); gg.gain.value = 0; o.connect(gg); gg.connect(master); gg.connect(verb); o.start();
      gg.gain.linearRampToValueAtTime(v, ctx.currentTime + 7);
    });
  }

  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend(); else ctx.resume();
  });

  const hint = document.getElementById('hint');
  window.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.infinito')) return;
    startAudio();
    if (hint) hint.classList.add('oculto');
    // cruzar una mirada: el péndulo de ese lado se adelanta, y los dos vuelven a buscarse
    const i = e.clientX < CX ? 0 : 1;
    if (!reduce) { fase[i] += 1.9; encontrados = 0; destello[i] = T; llega[1 - i] = T + 0.12; }
    const f = NOTAS[Math.floor(Math.random() * NOTAS.length)] * 2;
    const lado = Math.max(-0.7, Math.min(0.7, (e.clientX / W) * 1.4 - 0.7));
    pulsar(f, lado, ctx.currentTime + 0.01);
    simpatia(f, -lado, ctx.currentTime + 0.12);
  });
</script>
</body>
</html>
