<style>/* Fondo de la raíz: el color del borde inferior del portal, para la franja de botones del navegador */ html{background-color:#050515}</style>
<style>
  * { margin:0; padding:0; box-sizing:border-box;
      -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; }

  html, body { height:100%; }
  body {
    background: linear-gradient(to bottom, #000, #0a0a1a, #000, #050515);
    overflow:hidden;
    display:flex; justify-content:center; align-items:center;
    height:100vh; height:100dvh;
    font-family:'Georgia', serif;
    cursor:none;
    -webkit-tap-highlight-color: transparent;
  }

  .monad-universe {
    position:relative;
    width:min(800px, 95vw);
    height:min(800px, 86vh);
  }

  /* Resonancia Trinity */
  .trinity-resonance {
    position:absolute; top:50%; left:50%;
    width:130%; height:130%;
    background:
      radial-gradient(circle at 30% 30%, rgba(160,110,230,0.045) 0%, transparent 50%),
      radial-gradient(circle at 70% 70%, rgba(90,130,220,0.045) 0%, transparent 50%),
      radial-gradient(circle at 50% 50%, rgba(80,190,140,0.025) 0%, transparent 50%);
    transform: translate(-50%,-50%);
    animation: resonancePulse 25s infinite alternate ease-in-out;
    pointer-events:none;
  }
  @keyframes resonancePulse {
    0%   { opacity:0.2; transform: translate(-50%,-50%) scale(1); }
    100% { opacity:0.6; transform: translate(-50%,-50%) scale(1.1); }
  }

  /* Armonía preestablecida: un aura redonda donde giran los seis colores */
  .pre-established {
    position:absolute; top:50%; left:50%;
    width:min(920px,118vmin); height:min(920px,118vmin);
    border-radius:50%;
    background:
      conic-gradient(from 0deg at center,
        transparent, rgba(160,110,230,0.2), transparent, rgba(90,130,220,0.2),
        transparent, rgba(70,180,200,0.2), transparent),
      conic-gradient(from 180deg at center,
        transparent, rgba(80,190,140,0.16), transparent, rgba(225,150,80,0.15),
        transparent, rgba(215,90,110,0.15), transparent);
    -webkit-mask: radial-gradient(circle closest-side, #000 40%, rgba(0,0,0,0.65) 70%, transparent 100%);
            mask: radial-gradient(circle closest-side, #000 40%, rgba(0,0,0,0.65) 70%, transparent 100%);
    transform: translate(-50%,-50%);
    animation: harmonyRotate 60s infinite linear;
    will-change: transform;
    pointer-events:none;
  }
  @keyframes harmonyRotate {
    from { transform: translate(-50%,-50%) rotate(0deg)   scale(1); }
    50%  { transform: translate(-50%,-50%) rotate(180deg) scale(1.05); }
    to   { transform: translate(-50%,-50%) rotate(360deg) scale(1); }
  }

  /* Reflejos que nacen de la mónada (lienzo) */
  canvas.reflejos { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }

  .infinite-reflection {
    position:absolute; top:50%; left:50%;
    width:min(200px,32vmin); height:min(200px,32vmin);
    border-radius:50%;
    background: repeating-radial-gradient(circle at center,
      transparent 0, transparent min(10px,1.6vmin),
      rgba(160,110,230,0.17) min(10px,1.6vmin), rgba(160,110,230,0.17) min(11px,1.75vmin));
    transform: translate(-50%,-50%);
    animation: infiniteScale 12s infinite alternate ease-in-out;
    will-change: transform, opacity;
    pointer-events:none;
  }
  @keyframes infiniteScale {
    0%   { transform: translate(-50%,-50%) scale(1);   opacity:0.8; }
    100% { transform: translate(-50%,-50%) scale(0.4); opacity:0.3; }
  }

  /* Sin ventanas */
  .windowless {
    position:absolute; top:50%; left:50%;
    width:min(100px,16vmin); height:min(100px,16vmin);
    border:2px solid rgba(160,110,230,0.45);
    transform: translate(-50%,-50%);
    animation: windowlessRotate 15s infinite linear;
    will-change: transform;
    pointer-events:none;
  }
  .windowless::before, .windowless::after {
    content:''; position:absolute; inset:0;
    border:1px solid rgba(90,130,220,0.35);
  }
  .windowless::before { animation: innerRotate 8s infinite linear reverse; }
  .windowless::after  { animation: innerRotate 12s infinite linear; }
  @keyframes windowlessRotate {
    from { transform: translate(-50%,-50%) rotate(0deg)   scale(1); }
    50%  { transform: translate(-50%,-50%) rotate(180deg) scale(1.1); }
    to   { transform: translate(-50%,-50%) rotate(360deg) scale(1); }
  }
  @keyframes innerRotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  /* La mónada */
  .leibniz-monad {
    position:absolute; top:50%; left:50%;
    width:min(20px,3.2vmin); height:min(20px,3.2vmin);
    border-radius:50%;
    background: radial-gradient(circle,
      rgba(255,255,255,1) 0%, rgba(255,245,235,0.95) 10%, rgba(160,110,230,0.9) 30%,
      rgba(90,130,220,0.7) 50%, rgba(70,180,200,0.4) 70%, transparent 100%);
    box-shadow:
      0 0 30px rgba(160,110,230,0.9), 0 0 60px rgba(90,130,220,0.7),
      0 0 120px rgba(70,180,200,0.45), 0 0 240px rgba(80,190,140,0.25);
    transform: translate(-50%,-50%) scale(1);
    animation: monadPulse 6s infinite alternate ease-in-out;
    will-change: transform;
    z-index:20;
  }
  @keyframes monadPulse {
    0%   { transform: translate(-50%,-50%) scale(1); }
    50%  { transform: translate(-50%,-50%) scale(1.8); }
    100% { transform: translate(-50%,-50%) scale(1.3); }
  }
  .monad-flash {
    position:absolute; top:50%; left:50%;
    width:min(20px,3.2vmin); height:min(20px,3.2vmin);
    border-radius:50%;
    background: radial-gradient(circle, rgba(255,250,240,1) 0%, rgba(210,180,255,0.7) 35%, transparent 70%);
    box-shadow: 0 0 40px rgba(230,210,255,0.9), 0 0 110px rgba(160,110,230,0.6);
    transform: translate(-50%,-50%) scale(1);
    opacity:0;
    pointer-events:none;
    z-index:21;
  }
  .monad-flash.encendido { animation: destello 3.2s ease-out; }
  @keyframes destello {
    0%   { opacity:0;    transform: translate(-50%,-50%) scale(1); }
    12%  { opacity:1;    transform: translate(-50%,-50%) scale(4); }
    100% { opacity:0;    transform: translate(-50%,-50%) scale(9); }
  }

  /* Micro-universos: dieciséis órbitas afinadas entre sí (las mueve el guion) */
  .micro-universe {
    position:absolute; top:0; left:0;
    width:clamp(3px,0.6vmin,4px); height:clamp(3px,0.6vmin,4px);
    margin:calc(clamp(3px,0.6vmin,4px) / -2) 0 0 calc(clamp(3px,0.6vmin,4px) / -2);
    background: rgba(160,110,230,0.95);
    border-radius:50%;
    box-shadow: 0 0 6px rgba(160,110,230,0.6);
    will-change: transform;
    pointer-events:none;
    z-index:15;
  }

  /* Ecos de percepción */
  .perception-echo {
    position:absolute;
    width:min(6px,1vmin); height:min(6px,1vmin);
    background: rgba(255,255,255,0.3);
    border-radius:50%;
    animation: echoExpand 6s ease-out forwards;
    pointer-events:none;
  }
  @keyframes echoExpand {
    0%   { transform: scale(0); opacity:0.8; }
    100% { transform: scale(8); opacity:0; }
  }

  /* Textos de percepción: se leen en ronda, cada uno unos nueve segundos y medio */
  .perception-text {
    position:absolute;
    width:max-content;
    color: rgba(190,160,235,0.85);
    font-size: clamp(13px,3.5vw,15px);
    font-style:italic;
    text-shadow: 0 0 12px rgba(160,110,230,0.45);
    opacity:0;
    transform: scale(0.88);
    animation: perceptionFade 16s infinite ease-in-out;
    will-change: opacity, transform;
    pointer-events:none;
    z-index:22;
  }
  .p1 { top:24%;    left:7%;   animation-delay:0s; }
  .p2 { top:24%;    right:7%;  animation-delay:2s; }
  .p3 { bottom:27%; right:7%;  animation-delay:4s; }
  .p4 { bottom:27%; left:7%;   animation-delay:6s; }
  @keyframes perceptionFade {
    0%       { opacity:0;    transform: scale(0.88); }
    12%      { opacity:0.92; transform: scale(1); }
    72%      { opacity:0.92; transform: scale(1); }
    84%,100% { opacity:0;    transform: scale(0.88); }
  }

  .monad-equation {
    position:absolute; top:7%; left:50%;
    color: rgba(195,160,245,0.95);
    font-size: clamp(17px,4.6vw,21px);
    text-align:center; line-height:1.45;
    text-shadow: 0 0 20px rgba(160,110,230,0.55);
    transform: translateX(-50%);
    animation: equationFloat 8s infinite ease-in-out;
    will-change: transform, opacity;
    z-index:22;
  }
  .monad-equation span { display:block; font-size: clamp(12px,3.2vw,14px); letter-spacing:1px; }
  @keyframes equationFloat {
    0%,100% { opacity:0.65; transform: translateX(-50%) translateY(0)     scale(0.96); }
    50%     { opacity:1;    transform: translateX(-50%) translateY(-10px) scale(1.04); }
  }

  .leibniz-text {
    position:absolute; bottom:7%; left:50%;
    width:88%;
    color: rgba(130,170,240,0.92);
    font-size: clamp(15px,4.2vw,19px);
    text-align:center; line-height:1.5;
    font-style:italic;
    text-shadow: 0 0 15px rgba(90,130,220,0.4);
    opacity:0;
    transform: translateX(-50%) scale(0.94);
    animation: cita 16s infinite ease-in-out;
    animation-delay:1s;
    will-change: opacity, transform;
    z-index:22;
  }
  @keyframes cita {
    0%       { opacity:0;    transform: translateX(-50%) scale(0.94); }
    12%      { opacity:0.95; transform: translateX(-50%) scale(1); }
    80%      { opacity:0.95; transform: translateX(-50%) scale(1); }
    92%,100% { opacity:0;    transform: translateX(-50%) scale(0.94); }
  }

  .transmission-code {
    position:fixed; left:50%;
    bottom:calc(env(safe-area-inset-bottom, 0px) + 18px);
    transform: translateX(-50%);
    color: rgba(160,110,230,0.42);
    font-family:'Courier New', monospace;
    font-size:10px; letter-spacing:2px;
    white-space:nowrap;
    animation: codeFlicker 5s infinite ease-in-out;
  }
  @keyframes codeFlicker { 0%,100% { opacity:0.3; } 50% { opacity:0.7; } }

  .hint {
    position:fixed; left:50%;
    bottom:calc(env(safe-area-inset-bottom, 0px) + 50px);
    transform: translateX(-50%);
    width:max-content; max-width:88vw; text-align:center;
    font-size: clamp(12px,3.2vw,14px);
    letter-spacing:1px;
    color: rgba(245,240,255,0.88);
    animation: invita 3.4s infinite ease-in-out;
    pointer-events:none;
    transition: opacity 1.4s ease;
    z-index:30;
  }
  .hint.oculto { animation:none; opacity:0; }
  @keyframes invita { 0%,100% { opacity:0.45; } 50% { opacity:0.95; } }

  .infinito {
    position:fixed;
    bottom:calc(env(safe-area-inset-bottom, 0px) + 14px); right:22px;
    font-size:30px; text-decoration:none;
    color: rgba(200,180,240,0.4);
    transition: color 0.8s ease, text-shadow 0.8s ease;
    z-index:31;
    cursor:pointer;
  }
  .infinito:hover, .infinito:focus-visible { color: rgba(230,200,255,0.95); text-shadow: 0 0 18px rgba(160,110,230,0.6); outline:none; }

  @media (max-width: 480px) {
    .transmission-code { font-size:7px; letter-spacing:0.3px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation:none !important; }
    .perception-text { opacity:0.9; transform:none; }
    .leibniz-text { opacity:0.92; transform: translateX(-50%); }
    .monad-equation { opacity:0.95; }
    .hint { opacity:0.85; }
    .hint.oculto { opacity:0; }
  }
</style>
</head>
<body>
  <div class="monad-universe" id="campo">
    <div class="trinity-resonance"></div>
    <div class="pre-established"></div>
    <canvas class="reflejos" id="reflejos"></canvas>
    <div class="infinite-reflection"></div>
    <div class="windowless"></div>
    <div class="leibniz-monad"></div>
    <div class="monad-flash" id="destello"></div>

    <div class="perception-text p1">Sin ventanas</div>
    <div class="perception-text p2">Sin puertas</div>
    <div class="perception-text p3">Todo reflejado</div>
    <div class="perception-text p4">Todo contenido</div>

    <div class="monad-equation">1 = ∞<span>La mónada contiene el universo</span></div>

    <div class="leibniz-text" id="cita">"Cada mónada es un espejo viviente<br>del universo entero"</div>
  </div>

  <div class="transmission-code">TRINITY::NODO_56::MÓNADA_UNIVERSAL::LIBRO_8_COMPLETO::RESONANDO</div>
  <div class="hint">( toca — muchas voces, un solo tono )</div>

  <a class="infinito" href="../Libro9/L9-Nodo1.html" aria-label="Siguiente portal">∞</a>

<script>
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const campo = document.getElementById('campo');
  const lienzo = document.getElementById('reflejos');
  const g = lienzo.getContext('2d');
  const destello = document.getElementById('destello');
  let W = 0, H = 0;

  function medir() {
    const r = campo.getBoundingClientRect(); W = r.width; H = r.height;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    lienzo.width = Math.round(W * dpr); lienzo.height = Math.round(H * dpr);
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  medir(); addEventListener('resize', medir);

  /* ---------------- Reflejos que se expanden desde la mónada ---------------- */
  const TONOS = ['160,110,230', '90,130,220', '70,180,200', '80,190,140'];
  const reflejos = [];
  function reflejo(fuerte) {
    reflejos.push({ nace: performance.now() + (fuerte ? 0 : Math.random() * 1500), dura: fuerte ? 9000 : 8000 + Math.random() * 4000,
                    c: fuerte ? '225,205,255' : TONOS[Math.floor(Math.random() * TONOS.length)], k: fuerte ? 2.2 : 1 });
  }
  function dibujar(ahora) {
    g.clearRect(0, 0, W, H);
    const m = Math.min(W, H), r0 = 0.019 * m, r1 = 0.55 * Math.max(W, H);
    for (let i = reflejos.length - 1; i >= 0; i--) {
      const o = reflejos[i], v = (ahora - o.nace) / o.dura;
      if (v >= 1) { reflejos.splice(i, 1); continue; }
      if (v < 0) continue;
      const e = 1 - Math.pow(1 - v, 2.4);
      const al = v < 0.8 ? 0.9 - 0.7 * (v / 0.8) : 0.2 * (1 - (v - 0.8) / 0.2);
      g.beginPath(); g.arc(W / 2, H / 2, r0 + (r1 - r0) * e, 0, Math.PI * 2);
      g.strokeStyle = 'rgba(' + o.c + ',' + Math.min(1, al * 0.33 * o.k).toFixed(3) + ')';
      g.lineWidth = (v < 0.8 ? 1 - 0.5 * (v / 0.8) : 0.5 - 0.3 * ((v - 0.8) / 0.2)) * o.k;
      g.stroke();
    }
  }

  /* ---------------- Las dieciséis órbitas: un péndulo de ondas ----------------
     Ninguna órbita toca a otra. La i-ésima da n = 23 − i vueltas cada 360 s: la de
     adentro, 23 (una cada 15,7 s); la de afuera, 8 (una cada 45 s). Por eso se dispersan
     en espirales, se agrupan en cuatro, tres y dos brazos, y cada 360 s vuelven a quedar
     todas en una sola línea, sobre la mónada. La primera vez, a los 30 s de abrir. */
  const N = 16, CICLO = 360, ALINEA = 30;
  const COLORES = ['90,130,220', '70,180,200', '80,190,140', '160,110,230'];
  const orbitas = [];
  for (let i = 0; i < N; i++) {
    const el = document.createElement('div');
    el.className = 'micro-universe';
    const c = COLORES[i % 4];
    el.style.background = 'rgba(' + c + ',0.95)';
    el.style.boxShadow = '0 0 6px rgba(' + c + ',0.6)';
    campo.appendChild(el);
    orbitas.push({ el, n: 23 - i, h: 16 - i, vueltas: null, brillo: 0,
                   pan: (i % 2 ? 1 : -1) * (0.08 + 0.035 * i) });
  }
  const t0 = performance.now();
  let ultimaAlineacion = -1;

  function mover(ahora) {
    const t = (ahora - t0) / 1000;
    const m = Math.min(W, H);
    orbitas.forEach((o, i) => {
      const fr = o.n * (t - ALINEA) / CICLO;                // vueltas desde la alineación
      const ang = -Math.PI / 2 + 2 * Math.PI * fr;
      const r = m * (0.05 + 0.025 * i);
      const x = W / 2 + Math.cos(ang) * r, y = H / 2 + Math.sin(ang) * r;
      const vuelta = Math.floor(fr + 1e-6);
      if (o.vueltas !== null && vuelta !== o.vueltas) { o.brillo = 1; sonar(o); }
      o.vueltas = vuelta;
      o.brillo *= 0.94;
      const fase = fr - Math.floor(fr);
      const s = 1 + 0.15 * (1 - Math.cos(2 * Math.PI * fase)) + 1.4 * o.brillo;
      o.el.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) scale(${s.toFixed(3)})`;
    });
    // alineación: todas sobre la mónada
    const k = Math.round((t - ALINEA) / CICLO);
    if (Math.abs(t - ALINEA - k * CICLO) < 0.05 && k !== ultimaAlineacion) {
      ultimaAlineacion = k;
      reflejo(true);
      destello.classList.remove('encendido'); void destello.offsetWidth; destello.classList.add('encendido');
    }
    dibujar(ahora);
    requestAnimationFrame(mover);
  }

  /* ---------------- Ecos de percepción ---------------- */
  function eco(x, y) {
    const e = document.createElement('div');
    e.className = 'perception-echo';
    e.style.left = (x * 100) + '%'; e.style.top = (y * 100) + '%';
    campo.appendChild(e);
    setTimeout(() => e.remove(), 6200);
  }
  function ecoAlAzar() {
    const a = Math.random() * Math.PI * 2, d = 10 + Math.random() * 30;
    eco(0.5 + Math.cos(a) * d / 100, 0.5 + Math.sin(a) * d / 100);
  }

  if (reduce) {
    // Pista quieta: las órbitas detenidas en una espiral, poco después de alinearse
    const m = Math.min(W, H);
    orbitas.forEach((o, i) => {
      const ang = -Math.PI / 2 + 2 * Math.PI * o.n * 24 / CICLO;
      const r = m * (0.05 + 0.025 * i);
      o.el.style.transform = `translate(${(W / 2 + Math.cos(ang) * r).toFixed(1)}px, ${(H / 2 + Math.sin(ang) * r).toFixed(1)}px)`;
    });
    g.lineWidth = 1;
    [0.12, 0.24, 0.38].forEach((k, i) => {
      g.beginPath(); g.arc(W / 2, H / 2, k * Math.min(W, H), 0, Math.PI * 2);
      g.strokeStyle = 'rgba(' + TONOS[i] + ',0.22)'; g.stroke();
    });
  } else {
    for (let i = 0; i < 5; i++) setTimeout(() => reflejo(false), i * 1200);
    setInterval(() => reflejo(false), 1800);
    for (let i = 0; i < 8; i++) setTimeout(ecoAlAzar, i * 400);
    setInterval(ecoAlAzar, 800);
    requestAnimationFrame(mover);
  }

  /* ---------------- Textos: cada uno cambia mientras está invisible ---------------- */
  const percepciones = [
    ['Sin ventanas', 'Sin puertas', 'Todo reflejado', 'Todo contenido'],
    ['Mónada pura', 'Sin extensión', 'Con percepción', 'Con apetición'],
    ['Espejo vivo', 'Del universo', 'Perspectiva única', 'Armonía eterna'],
    ['1 = ∞', 'Punto = Todo', 'Simple = Complejo', 'Unidad = Pluralidad']
  ];
  const citas = [
    '"Cada mónada es un espejo viviente<br>del universo entero"',
    '"No hay dos mónadas<br>perfectamente iguales"',
    '"La mónada no tiene ventanas<br>por donde algo pueda entrar o salir"',
    '"Todo está conectado<br>en la armonía preestablecida"'
  ];
  document.querySelectorAll('.perception-text').forEach((el, k) => {
    let gi = 0;
    el.addEventListener('animationiteration', () => { gi = (gi + 1) % percepciones.length; el.textContent = percepciones[gi][k]; });
  });
  const cita = document.getElementById('cita');
  let ic = 0;
  cita.addEventListener('animationiteration', () => { ic = (ic + 1) % citas.length; cita.innerHTML = citas[ic]; });

  /* ---------------- Diseño sonoro: coros que no se oyen y concuerdan ----------------
     La imagen es del propio Leibniz: varios coros que cantan cada uno su parte, sin
     verse ni oírse, y que sin embargo concuerdan, porque todo quedó afinado desde el
     principio (la armonía preestablecida). Cada órbita es una voz con su lugar fijo en el
     estéreo, y suena una nota breve cada vez que pasa por lo alto. Su nota es un armónico
     de un mismo Do grave (65,4 Hz): la de adentro, el decimosexto; la de afuera, el
     fundamental. Entre alineaciones, las voces forman melodías cambiantes de la serie
     armónica; al acercarse la alineación, sus pasos se agrupan; y cuando todas quedan en
     línea, los dieciséis armónicos suenan juntos y el oído los funde en un solo tono, el
     Do grave: muchas voces oídas como una.
  ------------------------------------------------------------------------------------ */
  let started = false, ctx, master, conv;
  const F0 = 65.4;

  function makeReverbIR(ac, seconds = 4.2, decay = 2.6) {
    const len = Math.floor(ac.sampleRate * seconds);
    const buf = ac.createBuffer(2, len, ac.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      for (let i = 0; i < len; i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, decay);
    }
    return buf;
  }
  function sonar(o) {
    if (!started) return;
    const t = ctx.currentTime + 0.01;
    const osc = ctx.createOscillator(); osc.type = 'sine'; osc.frequency.value = F0 * o.h;
    const a = ctx.createGain(); a.gain.value = 0;
    const p = ctx.createStereoPanner(); p.pan.value = o.pan;
    osc.connect(a); a.connect(p); p.connect(master); p.connect(conv);
    const nivel = 0.055 * Math.pow(o.h, -0.3);
    a.gain.setValueAtTime(0, t);
    a.gain.linearRampToValueAtTime(nivel, t + 0.012);
    a.gain.exponentialRampToValueAtTime(0.0003, t + 3.2);
    osc.start(t); osc.stop(t + 3.3);
  }
  function startAudio() {
    if (started) return;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 3; comp.attack.value = 0.01; comp.release.value = 0.4;
    comp.connect(ctx.destination);
    master = ctx.createGain(); master.gain.value = 0;
    master.connect(comp);
    master.gain.linearRampToValueAtTime(0.62, ctx.currentTime + 6);
    conv = ctx.createConvolver(); conv.buffer = makeReverbIR(ctx);
    const wet = ctx.createGain(); wet.gain.value = 0.3;
    conv.connect(wet); wet.connect(master);
    // La mónada: un fondo apenas audible de su propio Do (armónicos 2 y 3), que respira
    const fondo = ctx.createGain(); fondo.gain.value = 0.012;
    const res = ctx.createOscillator(); res.frequency.value = 0.05;
    const resG = ctx.createGain(); resG.gain.value = 0.006;
    res.connect(resG); resG.connect(fondo.gain); res.start();
    fondo.connect(master); fondo.connect(conv);
    [2, 3].forEach(h => {
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = F0 * h;
      o.connect(fondo); o.start();
    });
    started = true;
  }

  const hint = document.querySelector('.hint');
  window.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.infinito')) return;
    startAudio();
    if (hint) hint.classList.add('oculto');
    const r = campo.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
    if (!reduce && x >= 0 && x <= 1 && y >= 0 && y <= 1) eco(x, y);
  });
</script>
